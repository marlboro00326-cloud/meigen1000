<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>毎日に効く名言100</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#09101e,#172442);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 18px max(25px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;color:#aeb8d0;font-size:13px}.card{margin-top:24px;background:rgba(255,255,255,.08);border-radius:26px;padding:24px 21px}.theme{font-size:12px;color:#aeb8d0;margin-bottom:16px}.orig{font-size:20px;line-height:1.5;font-weight:700}.ja{font-size:25px;line-height:1.55;font-weight:750;margin-top:17px}.person{text-align:right;font-weight:700;margin-top:20px}.source{text-align:right;color:#9da9c2;font-size:12px;margin-top:7px;line-height:1.4}.insight{margin-top:18px;padding:18px;background:rgba(255,255,255,.07);border-radius:20px;line-height:1.75;font-size:16px}.insight b{display:block;margin-bottom:6px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700}.secondary{background:rgba(255,255,255,.12);color:white}.note{font-size:11px;color:#8490aa;line-height:1.5;margin-top:14px}</style></head><body><main><header><span>毎日に効く名言100</span><span id="num"></span></header><div class="card"><div class="theme" id="theme"></div><div class="orig" id="orig"></div><div class="ja" id="ja"></div><div class="person" id="person"></div><div class="source" id="source"></div></div><div class="insight"><b>💡 この言葉から</b><span id="insight"></span></div><div class="buttons"><button id="next">次の名言</button><button class="secondary" id="random">ランダム</button><button class="secondary" id="share">共有</button><button class="secondary" id="fav">♡ お気に入り</button></div><div class="note">原文は短い引用、日本語は読みやすさを優先した独自訳です。「attribution / widely cited」とあるものは、本人への帰属が広く流通している一方、一次資料の特定に注意が必要なものです。</div></main>
<script>const quotes=[{"id":1,"person":"スティーブ・ジョブズ","original":"Your time is limited.","japanese":"あなたの時間は限られている。","source":"Stanford Commencement Address (2005)","theme":"時間","insight":"やりたいことを全部できるほど時間は無限ではありません。迷った時は「これは自分の時間を使う価値があるか」で考えると、優先順位が見えやすくなります。"},{"id":2,"person":"スティーブ・ジョブズ","original":"Don’t waste it living someone else’s life.","japanese":"他人の人生を生きて、自分の時間を無駄にしてはいけない。","source":"Stanford Commencement Address (2005)","theme":"人生","insight":"周囲の期待は参考にはなりますが、最後にその人生を生きるのは自分です。人の評価より、自分が納得できる選択かを確認したい時の言葉です。"},{"id":3,"person":"スティーブ・ジョブズ","original":"You’ve got to find what you love.","japanese":"自分が愛せるものを見つけなければならない。","source":"Stanford Commencement Address (2005)","theme":"仕事","insight":"天職を一度で見つける必要はありません。「もっとやってみたい」と思える方向を探し続けることが、仕事を自分のものにしていきます。"},{"id":4,"person":"スティーブ・ジョブズ","original":"Keep looking. Don’t settle.","japanese":"探し続けよう。妥協してはいけない。","source":"Stanford Commencement Address (2005)","theme":"仕事","insight":"今の状態に違和感があるなら、それを無視しないこと。すぐ辞めるという意味ではなく、より納得できる選択肢を探し続ける姿勢です。"},{"id":5,"person":"スティーブ・ジョブズ","original":"Stay hungry. Stay foolish.","japanese":"ハングリーであれ。愚かであれ。","source":"Stanford Commencement Address (2005)","theme":"挑戦","insight":"知ったつもりになると、新しいことを試さなくなります。初心者の好奇心と、少し無謀なくらいの挑戦心を残しておきたいものです。"},{"id":6,"person":"スティーブ・ジョブズ","original":"You have to trust in something.","japanese":"何かを信じなければならない。","source":"Stanford Commencement Address (2005)","theme":"決断","insight":"未来の正解は事前には分かりません。十分に考えた後は、自分の選択を信じて進む時間も必要です。"},{"id":7,"person":"スティーブ・ジョブズ","original":"Don’t lose faith.","japanese":"信念を失ってはいけない。","source":"Stanford Commencement Address (2005)","theme":"困難","insight":"一度うまくいかなかったことと、自分に可能性がないことは別です。方法を変えて、もう一度試せる余地が残っていないか考えてみましょう。"},{"id":8,"person":"スティーブ・ジョブズ","original":"Have the courage to follow your heart and intuition.","japanese":"自分の心と直感に従う勇気を持とう。","source":"Stanford Commencement Address (2005)","theme":"決断","insight":"情報を集めても最後まで迷うことはあります。そんな時は「自分は本当はどちらを望んでいるか」も判断材料にしてよいのです。"},{"id":9,"person":"スティーブ・ジョブズ","original":"Sometimes life hits you in the head with a brick.","japanese":"時には人生にレンガで頭を殴られるようなこともある。","source":"Stanford Commencement Address (2005)","theme":"失敗","insight":"予想外の失敗は誰にでも起こります。そこで人生全体を失敗と決めず、「次に何をするか」へ意識を移すことが大切です。"},{"id":10,"person":"スティーブ・ジョブズ","original":"The only way to do great work is to love what you do.","japanese":"素晴らしい仕事をする唯一の方法は、自分の仕事を愛することだ。","source":"Stanford Commencement Address (2005)","theme":"仕事","insight":"好きなことなら楽という意味ではありません。大変でも「もっと良くしたい」と思える対象を持てると、努力を長く続けやすくなります。"},{"id":11,"person":"ヘレン・ケラー","original":"Optimism is the faith that leads to achievement.","japanese":"楽観は、達成へと導く信念である。","source":"Optimism (1903)","theme":"希望","insight":"楽観とは待っていれば何とかなるという意味ではありません。「まだできることがある」と考えて行動を続ける姿勢です。"},{"id":12,"person":"ヘレン・ケラー","original":"Nothing can be done without hope.","japanese":"希望なしには何も成し遂げられない。","source":"Optimism (1903)","theme":"希望","insight":"結果が見えない時期を乗り切るには、確信よりも「可能性は残っている」と思えることが大切です。"},{"id":13,"person":"ヘレン・ケラー","original":"I can think, act and attain.","japanese":"私は考え、行動し、到達できる。","source":"Optimism (1903)","theme":"自信","insight":"できないことを数えるより、今の自分にできることを一つ使う。落ち込んだ日に行動を再開するための言葉です。"},{"id":14,"person":"ヘレン・ケラー","original":"The world is full of suffering.","japanese":"世界は苦しみに満ちている。","source":"Optimism (1903)","theme":"困難","insight":"つらい現実を無理に明るく考える必要はありません。まず「つらいものはつらい」と認めることも、立て直しの第一歩です。"},{"id":15,"person":"ヘレン・ケラー","original":"It is full also of the overcoming of it.","japanese":"世界は、それを乗り越えることにも満ちている。","source":"Optimism (1903)","theme":"困難","insight":"苦しみだけが世界のすべてではありません。人が立て直した例も無数にある、と未来側へ視点を戻してくれます。"},{"id":16,"person":"ヘレン・ケラー","original":"The desire and will to work is optimism itself.","japanese":"働こうとする願いと意志、それ自体が楽観である。","source":"Optimism (1903)","theme":"仕事","insight":"前向きな気分になるのを待つより、まず少し手を動かす。行動から気持ちが戻ってくることもあります。"},{"id":17,"person":"ヘレン・ケラー","original":"My share in the work of the world may be limited.","japanese":"世界の仕事における私の役割は限られているかもしれない。","source":"Optimism (1903)","theme":"仕事","insight":"一人で全部を変える必要はありません。自分にできる範囲をきちんとやることにも十分な価値があります。"},{"id":18,"person":"ヘレン・ケラー","original":"The work open to me is endless.","japanese":"私にできる仕事は尽きることがない。","source":"Optimism (1903)","theme":"可能性","insight":"できないことがあっても、できることまでなくなるわけではありません。選択肢を別の角度から探してみるきっかけになります。"},{"id":19,"person":"ヘレン・ケラー","original":"I have learned to live, to think, to hope.","japanese":"私は生きること、考えること、希望を持つことを学んだ。","source":"Optimism (1903)","theme":"成長","insight":"考え方は生まれつき固定されたものではなく、経験から学び直せます。今の自分が最終形ではありません。"},{"id":20,"person":"ヘレン・ケラー","original":"I trust, and nothing that happens disturbs my trust.","japanese":"私は信じている。何が起きても、その信頼は揺らがない。","source":"Optimism (1903)","theme":"心","insight":"状況は変わっても、自分が大切にする価値観まで毎回変える必要はありません。心の軸を一つ持つと判断が安定します。"},{"id":21,"person":"セオドア・ルーズベルト","original":"It is not the critic who counts.","japanese":"重要なのは批評する人ではない。","source":"Citizenship in a Republic (1910)","theme":"人間関係","insight":"何かを始めると、外から批評する人は必ず現れます。すべての声に反応せず、実際に責任を負って行動している自分の目的へ戻りましょう。"},{"id":22,"person":"セオドア・ルーズベルト","original":"The credit belongs to the man who is actually in the arena.","japanese":"称賛されるべきは、実際に競技場に立っている人である。","source":"Citizenship in a Republic (1910)","theme":"挑戦","insight":"挑戦して失敗した自分を、何もしなかった人の評価だけで否定する必要はありません。まず「やったこと」を認める言葉です。"},{"id":23,"person":"セオドア・ルーズベルト","original":"Who strives valiantly.","japanese":"勇敢に努力する人。","source":"Citizenship in a Republic (1910)","theme":"努力","insight":"結果だけで自分を採点すると途中の努力が見えなくなります。今日きちんと取り組んだことにも価値があります。"},{"id":24,"person":"セオドア・ルーズベルト","original":"Who errs, who comes short again and again.","japanese":"間違い、何度も届かない人。","source":"Citizenship in a Republic (1910)","theme":"失敗","insight":"挑戦する限りミスは起こります。「失敗した＝向いていない」と早く決めず、何を修正できるかを見ることが重要です。"},{"id":25,"person":"セオドア・ルーズベルト","original":"There is no effort without error and shortcoming.","japanese":"誤りや欠点のない努力など存在しない。","source":"Citizenship in a Republic (1910)","theme":"失敗","insight":"完璧にできるようになってから始めようとすると、いつまでも始まりません。間違い込みで始め、途中で直す方が前へ進めます。"},{"id":26,"person":"セオドア・ルーズベルト","original":"Who does actually strive to do the deeds.","japanese":"実際に行動しようと努力する人。","source":"Citizenship in a Republic (1910)","theme":"行動","insight":"考えているだけでは現実は変わりません。今日できる一つを実際に終わらせることが、次の変化を生みます。"},{"id":27,"person":"セオドア・ルーズベルト","original":"Who spends himself in a worthy cause.","japanese":"価値ある目的のために自分を尽くす人。","source":"Citizenship in a Republic (1910)","theme":"目的","insight":"忙しいことと、価値あることに時間を使っていることは別です。「何のために頑張っているか」を確認するきっかけに。"},{"id":28,"person":"セオドア・ルーズベルト","original":"If he fails, at least fails while daring greatly.","japanese":"失敗するとしても、大いなる挑戦の中で失敗する。","source":"Citizenship in a Republic (1910)","theme":"挑戦","insight":"失敗ゼロの人生より、価値あることに挑戦した経験の方が後に残ります。失敗の大きさより、何に挑んだかを見る言葉です。"},{"id":29,"person":"セオドア・ルーズベルト","original":"His place shall never be with those cold and timid souls.","japanese":"彼の居場所は、冷たく臆病な傍観者たちの中ではない。","source":"Citizenship in a Republic (1910)","theme":"勇気","insight":"安全な場所から他人を評価するだけでは得られない経験があります。自分が本当に望むなら、一歩当事者側へ出てみる価値があります。"},{"id":30,"person":"セオドア・ルーズベルト","original":"Who knows the great enthusiasms.","japanese":"大きな情熱を知る人。","source":"Citizenship in a Republic (1910)","theme":"情熱","insight":"効率だけで選ぶと、心が動くものを見失うことがあります。損得を離れて夢中になれるものも人生には必要です。"},{"id":31,"person":"ベンジャミン・フランクリン","original":"Time is money.","japanese":"時は金なり。","source":"Advice to a Young Tradesman (1748)","theme":"時間","insight":"時間にも価値があるという有名な考え方です。安さだけでなく「自分の時間を何時間使うか」も含めて判断すると、生活の選択が変わります。"},{"id":32,"person":"ベンジャミン・フランクリン","original":"Lost time is never found again.","japanese":"失った時間は二度と見つからない。","source":"Poor Richard's Almanack","theme":"時間","insight":"お金と違って昨日の1時間は買い戻せません。先延ばししそうな時に「本当に後でいいか」を考える基準になります。"},{"id":33,"person":"ベンジャミン・フランクリン","original":"Well done is better than well said.","japanese":"よく言うことより、よく行うことの方がよい。","source":"Poor Richard's Almanack","theme":"行動","insight":"宣言や計画だけで達成感を得ず、小さくても実際に一つ終わらせる。行動量を増やしたい日に思い出したい言葉です。"},{"id":34,"person":"ベンジャミン・フランクリン","original":"Never leave that till tomorrow which you can do today.","japanese":"今日できることを明日まで残すな。","source":"Autobiography / Franklin maxim","theme":"習慣","insight":"全部を今日やる必要はありません。ただ、5分で終わることまで先延ばしにしていないかを確認すると、未処理の負担を減らせます。"},{"id":35,"person":"ベンジャミン・フランクリン","original":"Dost thou love life? Then do not squander time.","japanese":"人生を愛するなら、時間を浪費してはいけない。","source":"Poor Richard's Almanack","theme":"時間","insight":"人生は時間の集まりです。何となく消費している時間を少しだけ、自分が本当にしたいことへ移すだけでも変化になります。"},{"id":36,"person":"ベンジャミン・フランクリン","original":"Early to bed and early to rise makes a man healthy, wealthy, and wise.","japanese":"早寝早起きは、人を健康に、豊かに、賢くする。","source":"Poor Richard's Almanack","theme":"習慣","insight":"派手な方法より、睡眠などの基本習慣が長期的には効きます。調子が悪い時ほど基本へ戻る、という使い方ができます。"},{"id":37,"person":"ベンジャミン・フランクリン","original":"There are no gains without pains.","japanese":"苦労なくして得るものはない。","source":"The Way to Wealth (1758)","theme":"努力","insight":"成果にはある程度の負荷が伴います。ただし苦しむこと自体が目的ではなく、必要な努力を避けすぎないという意味で受け取りたい言葉です。"},{"id":38,"person":"ベンジャミン・フランクリン","original":"Industry pays debts, while despair increaseth them.","japanese":"勤勉は借りを返し、絶望はそれを増やす。","source":"The Way to Wealth (1758)","theme":"行動","insight":"問題が大きいほど考えるだけで疲れてしまいます。状況を一気に解決できなくても、今日一つ処理する方が現実は少し改善します。"},{"id":39,"person":"ベンジャミン・フランクリン","original":"Sloth makes all things difficult, but industry all easy.","japanese":"怠惰はすべてを難しくし、勤勉はすべてを容易にする。","source":"The Way to Wealth (1758)","theme":"習慣","insight":"放置した仕事は心理的にも大きくなります。少しずつ手を付けておくと、未来の自分の負担を減らせます。"},{"id":40,"person":"ベンジャミン・フランクリン","original":"One today is worth two tomorrows.","japanese":"今日一日は、二つの明日ほどの価値がある。","source":"Poor Richard's Almanack","theme":"行動","insight":"未来の自分に期待しすぎず、今日できる一歩を今日やる。先延ばしを止めたい時に非常に実用的な言葉です。"},{"id":41,"person":"ヘンリー・デイヴィッド・ソロー","original":"Simplify, simplify.","japanese":"単純に、単純に。","source":"Walden (1854)","theme":"生活","insight":"物、予定、情報が増えすぎると大切なものが見えにくくなります。「一つ減らせないか」と考えるだけでも生活は軽くなります。"},{"id":42,"person":"ヘンリー・デイヴィッド・ソロー","original":"I went to the woods because I wished to live deliberately.","japanese":"私は意識的に生きたいと思い、森へ行った。","source":"Walden (1854)","theme":"人生","insight":"忙しさに流されると、選んでいるつもりでも惰性になります。時々「なぜこれをしているのか」を確認する時間を持ちましょう。"},{"id":43,"person":"ヘンリー・デイヴィッド・ソロー","original":"I wanted to live deep and suck out all the marrow of life.","japanese":"深く生き、人生の髄まで味わいたかった。","source":"Walden (1854)","theme":"人生","insight":"ただ予定を消化するだけでなく、好きな人との時間や体験をしっかり味わう。人生の量より密度を意識させる言葉です。"},{"id":44,"person":"ヘンリー・デイヴィッド・ソロー","original":"Our life is frittered away by detail.","japanese":"私たちの人生は、細々したことによって浪費されている。","source":"Walden (1854)","theme":"生活","insight":"細かな用事だけで一日が終わることがあります。今日いちばん重要なことを一つ先に決めるだけでも違います。"},{"id":45,"person":"ヘンリー・デイヴィッド・ソロー","original":"The mass of men lead lives of quiet desperation.","japanese":"多くの人は、静かな絶望の中で生きている。","source":"Walden (1854)","theme":"人生","insight":"表面上問題がなくても、納得できない生活を我慢していることがあります。違和感を無視せず、小さな変更から始めるきっかけになります。"},{"id":46,"person":"ヘンリー・デイヴィッド・ソロー","original":"The sun is but a morning star.","japanese":"太陽もまた、朝を告げる星にすぎない。","source":"Walden (1854)","theme":"希望","insight":"今見えている世界が完成形とは限りません。状況が固定されたように感じる時にも、次の展開はあり得ます。"},{"id":47,"person":"ヘンリー・デイヴィッド・ソロー","original":"A man is rich in proportion to the number of things which he can afford to let alone.","japanese":"手放しておけるものが多いほど、人は豊かである。","source":"Walden (1854)","theme":"お金","insight":"豊かさは持っている物の数だけではありません。「なくても困らない」と思える自由も豊かさの一つです。買い物前に思い出したい言葉です。"},{"id":48,"person":"ヘンリー・デイヴィッド・ソロー","original":"Things do not change; we change.","japanese":"物事が変わるのではない。私たちが変わるのだ。","source":"Walden (1854)","theme":"成長","insight":"同じ環境でも、自分の見方や能力が変わると意味が変わります。環境だけでなく、自分が変えられる部分にも目を向けましょう。"},{"id":49,"person":"ヘンリー・デイヴィッド・ソロー","original":"However mean your life is, meet it and live it.","japanese":"どんな人生であっても、それに向き合い、生きよ。","source":"Walden (1854)","theme":"人生","insight":"理想と違う現在を嫌うだけでは前に進めません。まず現在地を認め、その場所から一つ改善するという現実的な考え方です。"},{"id":50,"person":"ヘンリー・デイヴィッド・ソロー","original":"Cultivate poverty like a garden herb.","japanese":"質素さを、庭の草花のように育てよ。","source":"Walden (1854)","theme":"お金","insight":"支出を減らすことを我慢だけと考えず、少ないもので満足できる能力を育てる。お金に振り回されにくくなる考え方です。"},{"id":51,"person":"ラルフ・ワルド・エマーソン","original":"Trust thyself.","japanese":"自分自身を信じよ。","source":"Self-Reliance (1841)","theme":"自信","insight":"自分は絶対正しいと思うことではありません。最後は自分で考え、自分で選択を引き受けることです。"},{"id":52,"person":"ラルフ・ワルド・エマーソン","original":"Nothing is at last sacred but the integrity of your own mind.","japanese":"最後に神聖なのは、自分自身の心の誠実さだけだ。","source":"Self-Reliance (1841)","theme":"自分らしさ","insight":"周囲に合わせることは必要でも、自分が間違っていると思うことまで無理に合わせる必要はありません。自分の良心を判断基準にする言葉です。"},{"id":53,"person":"ラルフ・ワルド・エマーソン","original":"Whoso would be a man must be a nonconformist.","japanese":"一人の人間として生きるなら、時には同調しない者でなければならない。","source":"Self-Reliance (1841)","theme":"自分らしさ","insight":"多数派と違うこと自体が正しいわけではありません。ただ「みんながそうだから」だけで決めない姿勢は大切です。"},{"id":54,"person":"ラルフ・ワルド・エマーソン","original":"For every minute you are angry you lose sixty seconds of happiness.","japanese":"怒っている一分ごとに、幸福な六十秒を失う。","source":"Emerson attribution, widely cited","theme":"感情","insight":"怒るべき時はあります。ただ、終わった出来事を何時間も頭の中で繰り返すと、自分の時間まで奪われます。切り替える理由をくれる言葉です。"},{"id":55,"person":"ラルフ・ワルド・エマーソン","original":"Adopt the pace of nature: her secret is patience.","japanese":"自然の歩調を取り入れよ。その秘密は忍耐である。","source":"Essays / Emerson attribution","theme":"忍耐","insight":"成長には時間がかかるものがあります。すぐ結果が出ないことを「失敗」と判断せず、必要な期間を与えることも大切です。"},{"id":56,"person":"ラルフ・ワルド・エマーソン","original":"Insist on yourself; never imitate.","japanese":"自分自身を貫け。決して模倣するだけで終わるな。","source":"Self-Reliance (1841)","theme":"自分らしさ","insight":"人の成功例を参考にするのは有効ですが、そのままコピーする必要はありません。自分に合う形へ変えることが重要です。"},{"id":57,"person":"ラルフ・ワルド・エマーソン","original":"Do your work, and I shall know you.","japanese":"あなたの仕事をせよ。そうすればあなたが分かる。","source":"Self-Reliance (1841)","theme":"仕事","insight":"肩書きや自己紹介より、実際に何をするかが自分を表します。評価を気にするより、目の前の仕事の質を上げる方へ意識を戻しましょう。"},{"id":58,"person":"ラルフ・ワルド・エマーソン","original":"A foolish consistency is the hobgoblin of little minds.","japanese":"愚かな一貫性は、小さな心につきまとう妖怪だ。","source":"Self-Reliance (1841)","theme":"成長","insight":"以前言ったことに縛られて、間違いに気づいても変えないのは本末転倒です。新しい情報があれば考えを変えて構いません。"},{"id":59,"person":"ラルフ・ワルド・エマーソン","original":"Speak what you think now in hard words.","japanese":"今考えていることを、率直な言葉で語れ。","source":"Self-Reliance (1841)","theme":"コミュニケーション","insight":"曖昧にして後で不満をためるより、相手を尊重しながら必要なことを明確に伝える。人間関係を長持ちさせるためにも役立ちます。"},{"id":60,"person":"ラルフ・ワルド・エマーソン","original":"Nothing can bring you peace but yourself.","japanese":"自分自身以外に、あなたへ平穏をもたらすものはない。","source":"Self-Reliance (1841)","theme":"心","insight":"周囲を完全に自分の望み通りにすることはできません。外側を変えるだけでなく、自分の受け止め方を整えることも必要です。"},{"id":61,"person":"マルクス・アウレリウス","original":"You have power over your mind—not outside events.","japanese":"あなたが力を持てるのは自分の心であって、外の出来事ではない。","source":"Meditations","theme":"心","insight":"他人の行動や過去は変えられません。自分が次にどう反応するかへ集中すると、無力感を減らせます。"},{"id":62,"person":"マルクス・アウレリウス","original":"Realize this, and you will find strength.","japanese":"それを理解すれば、強さを見いだせる。","source":"Meditations","theme":"心","insight":"コントロールできないことを手放すのは諦めではありません。自分が動かせる部分へ力を集中するための選択です。"},{"id":63,"person":"マルクス・アウレリウス","original":"The happiness of your life depends upon the quality of your thoughts.","japanese":"人生の幸福は、思考の質に左右される。","source":"Meditations","theme":"幸福","insight":"同じ出来事でも、どう解釈するかで気持ちは変わります。最悪の想像だけを事実のように扱っていないか確認してみましょう。"},{"id":64,"person":"マルクス・アウレリウス","original":"Waste no more time arguing what a good man should be. Be one.","japanese":"善い人とは何かを議論する時間をこれ以上使うな。善い人であれ。","source":"Meditations","theme":"行動","insight":"理想について語るより、自分が正しいと思う行動を一つ実行する方が早い。人への親切も仕事の誠実さも今日からできます。"},{"id":65,"person":"マルクス・アウレリウス","original":"The impediment to action advances action.","japanese":"行動を妨げるものが、行動を前進させる。","source":"Meditations","theme":"困難","insight":"障害があるからこそ別の方法を考え、能力が増えることがあります。「邪魔だから終わり」ではなく「ではどうする？」へ切り替える言葉です。"},{"id":66,"person":"マルクス・アウレリウス","original":"What stands in the way becomes the way.","japanese":"道を塞ぐものが、道になる。","source":"Meditations","theme":"困難","insight":"問題そのものを練習材料にできないか考えてみましょう。苦手な仕事なら、それを通じて苦手な能力を鍛えることもできます。"},{"id":67,"person":"マルクス・アウレリウス","original":"Confine yourself to the present.","japanese":"自分を現在に集中させよ。","source":"Meditations","theme":"集中","insight":"過去の後悔と未来の不安を同時に考えると疲れます。今の10分でできることへ意識を戻すための言葉です。"},{"id":68,"person":"マルクス・アウレリウス","original":"Very little is needed to make a happy life.","japanese":"幸福な人生に必要なものは、ごくわずかである。","source":"Meditations","theme":"幸福","insight":"欲しいものが増え続けると、満足はいつまでも先になります。すでに持っているものの価値を確認することも幸福の技術です。"},{"id":69,"person":"マルクス・アウレリウス","original":"Do every act of your life as though it were the very last act.","japanese":"人生の一つ一つの行為を、最後の行為であるかのように行え。","source":"Meditations","theme":"時間","insight":"今日が最後だと極端に考える必要はありません。ただ、雑に扱っている大切な人や仕事がないか見直すきっかけになります。"},{"id":70,"person":"マルクス・アウレリウス","original":"Our life is what our thoughts make it.","japanese":"人生は、私たちの思考が作るものだ。","source":"Meditations","theme":"心","insight":"考え方だけですべてが解決するわけではありません。しかし、自分に不利な解釈を繰り返して苦しみを増やしていないかは見直せます。"},{"id":71,"person":"エピクテトス","original":"Some things are in our control and others not.","japanese":"あるものは自分で制御でき、あるものはできない。","source":"Enchiridion 1","theme":"心","insight":"悩んだ時は紙を二つに分けて「変えられること／変えられないこと」を書くだけでも整理できます。前者に時間を使いましょう。"},{"id":72,"person":"エピクテトス","original":"Men are disturbed not by things, but by the views which they take of things.","japanese":"人を苦しめるのは物事そのものではなく、それについての見方である。","source":"Enchiridion 5","theme":"感情","insight":"事実と自分の解釈を分ける習慣は強力です。「嫌われた」ではなく「返信がまだない」のように事実へ戻すと、不安を減らせる場合があります。"},{"id":73,"person":"エピクテトス","original":"Seek not that the things which happen should happen as you wish.","japanese":"起こることが自分の望み通りになることを求めるな。","source":"Enchiridion 8","theme":"心","insight":"予定通りにならないことは必ずあります。現実と戦い続けるより、起きた条件の中で次の最善を探す方が建設的です。"},{"id":74,"person":"エピクテトス","original":"It is not things themselves that trouble people.","japanese":"人を悩ませるのは、物事そのものではない。","source":"Enchiridion","theme":"感情","insight":"嫌な出来事の後に、自分の頭の中でさらに悪い物語を作っていないか確認しましょう。事実だけを見る時間を作ると落ち着きやすくなります。"},{"id":75,"person":"エピクテトス","original":"If you wish to improve, be content to appear foolish.","japanese":"成長したいなら、愚かに見えることを受け入れよ。","source":"Enchiridion 13","theme":"学び","insight":"初心者は分からなくて当然です。恥を避けて質問しないより、「分かりません」と言える方が上達は速くなります。"},{"id":76,"person":"エピクテトス","original":"No man is free who is not master of himself.","japanese":"自分自身を支配できない者は自由ではない。","source":"Discourses / Epictetus tradition","theme":"自制","insight":"好きな時に好きなことをするだけが自由ではありません。誘惑に「今はやらない」と言える力も、自分の人生を選ぶ自由です。"},{"id":77,"person":"エピクテトス","original":"First say to yourself what you would be.","japanese":"まず、自分が何になりたいかを自分に言え。","source":"Discourses","theme":"目標","insight":"目標が曖昧だと、日々の判断も曖昧になります。「どういう人になりたいか」を一文にすると、今日の行動を選びやすくなります。"},{"id":78,"person":"エピクテトス","original":"Then do what you have to do.","japanese":"そして、なすべきことをせよ。","source":"Discourses","theme":"行動","insight":"目標を書くだけでは変化しません。理想の自分なら今日何をするか、一つ具体的な行動へ変換してみましょう。"},{"id":79,"person":"エピクテトス","original":"Practice yourself, for heaven's sake, in little things.","japanese":"どうか、小さなことから自分を鍛えよ。","source":"Discourses","theme":"習慣","insight":"大きな意志力を一度発揮するより、小さな約束を毎日守る方が自信につながります。5分の習慣からでも十分です。"},{"id":80,"person":"エピクテトス","original":"Difficulties are things that show a person what they are.","japanese":"困難は、その人が何者かを示すものだ。","source":"Discourses","theme":"困難","insight":"順調な時より問題が起きた時に、普段の習慣や考え方が表れます。困難を自己否定ではなく、自分を知る材料として使いましょう。"},{"id":81,"person":"セネカ","original":"It is not that we have a short time to live, but that we waste a lot of it.","japanese":"人生が短いのではない。私たちが多くを浪費しているのだ。","source":"On the Shortness of Life","theme":"時間","insight":"時間が足りない時、予定を増やす前に「やめられること」を探してみましょう。時間管理は削ることから始まる場合があります。"},{"id":82,"person":"セネカ","original":"Life is long if you know how to use it.","japanese":"使い方を知っていれば、人生は長い。","source":"On the Shortness of Life","theme":"時間","insight":"自由時間の長さだけでなく、その時間を何に使ったかが満足度を変えます。短い時間でも意識的に使えば価値は高まります。"},{"id":83,"person":"セネカ","original":"While we are postponing, life speeds by.","japanese":"私たちが先延ばししている間にも、人生は過ぎていく。","source":"Letters / Seneca","theme":"行動","insight":"「いつか」は予定ではありません。本当にやりたいことなら、今日できる最小の一歩を日付のある予定に変えてみましょう。"},{"id":84,"person":"セネカ","original":"We suffer more often in imagination than in reality.","japanese":"私たちは現実よりも、想像の中でより多く苦しむ。","source":"Letters to Lucilius, Letter 13","theme":"不安","insight":"まだ起きていない最悪のケースを何度も考えると、実際の問題以上に疲れます。「今確実に起きていることは何か」へ戻りましょう。"},{"id":85,"person":"セネカ","original":"Difficulties strengthen the mind, as labor does the body.","japanese":"困難は、運動が身体を鍛えるように心を鍛える。","source":"Seneca, commonly cited from providential writings","theme":"困難","insight":"適度な負荷は能力を育てます。今の大変さから「何の力が身につくか」を一つ見つけると、経験の意味が変わります。"},{"id":86,"person":"セネカ","original":"He who is brave is free.","japanese":"勇敢な者は自由である。","source":"Letters / Seneca tradition","theme":"勇気","insight":"恐怖によって選択肢を狭められると自由も小さくなります。怖さがあっても必要な行動を選べることが、自分の自由を広げます。"},{"id":87,"person":"セネカ","original":"Associate with people who are likely to improve you.","japanese":"あなたを成長させてくれる人と付き合いなさい。","source":"Letters to Lucilius","theme":"人間関係","insight":"人は周囲の習慣や考え方から影響を受けます。一緒にいると前向きに行動できる人との時間を意識して増やしてみましょう。"},{"id":88,"person":"セネカ","original":"Luck is what happens when preparation meets opportunity.","japanese":"幸運とは、準備と機会が出会う時に起こる。","source":"Seneca attribution, widely cited","theme":"準備","insight":"チャンスそのものは選べなくても、来た時につかめる準備はできます。運を待つ時間を、技術や知識を磨く時間へ変える考え方です。"},{"id":89,"person":"セネカ","original":"Begin at once to live.","japanese":"今すぐ生き始めよ。","source":"Letters / Seneca","theme":"人生","insight":"理想の条件が全部そろってから人生が始まるわけではありません。今の環境の中にも楽しめること、始められることがあります。"},{"id":90,"person":"セネカ","original":"Count each separate day as a separate life.","japanese":"一日一日を、それぞれ一つの人生として数えよ。","source":"Letters to Lucilius","theme":"時間","insight":"一年単位では変化が遠く感じます。「今日はどう生きるか」まで小さくすると、行動に移しやすくなります。"},{"id":91,"person":"ウィリアム・シェイクスピア","original":"To thine own self be true.","japanese":"何よりも、自分自身に忠実であれ。","source":"Hamlet, Act 1 Scene 3","theme":"自分らしさ","insight":"人に好かれるために自分の価値観まで曲げ続けると疲れます。自分が大切にしたい基準を一つ持っておきましょう。"},{"id":92,"person":"ウィリアム・シェイクスピア","original":"Brevity is the soul of wit.","japanese":"簡潔さは知恵の魂である。","source":"Hamlet, Act 2 Scene 2","theme":"コミュニケーション","insight":"伝えたいことが多いほど話は長くなります。仕事の説明なら「結論は何か」を最初に一文で言うだけでも伝わりやすくなります。"},{"id":93,"person":"ウィリアム・シェイクスピア","original":"Our doubts are traitors.","japanese":"私たちの疑いは裏切り者だ。","source":"Measure for Measure, Act 1 Scene 4","theme":"自信","insight":"失敗を恐れすぎると、本来得られた経験まで失います。危険を確認したら、必要以上の不安で機会を捨てていないか考えてみましょう。"},{"id":94,"person":"ウィリアム・シェイクスピア","original":"All that glisters is not gold.","japanese":"光るものすべてが金とは限らない。","source":"The Merchant of Venice, Act 2 Scene 7","theme":"判断","insight":"見た目の良さ、肩書き、値段だけでは本当の価値は分かりません。買い物や人の評価で、表面以外も見るための言葉です。"},{"id":95,"person":"ウィリアム・シェイクスピア","original":"The readiness is all.","japanese":"肝心なのは、覚悟ができていることだ。","source":"Hamlet, Act 5 Scene 2","theme":"準備","insight":"未来を完全には予測できません。だからこそ、何が起きても対応できるよう普段から準備しておくことに意味があります。"},{"id":96,"person":"ウィリアム・シェイクスピア","original":"What's past is prologue.","japanese":"過ぎたことは序章にすぎない。","source":"The Tempest, Act 2 Scene 1","theme":"過去","insight":"過去は変えられませんが、それで今後のすべてが決まるわけでもありません。過去を次の章の材料として使う考え方です。"},{"id":97,"person":"ウィリアム・シェイクスピア","original":"Sweet are the uses of adversity.","japanese":"逆境にも、役立つところがある。","source":"As You Like It, Act 2 Scene 1","theme":"困難","insight":"苦労を美化する必要はありません。ただ、そこから得た知識や人への理解を次に使えれば、経験を無駄にせずに済みます。"},{"id":98,"person":"ウィリアム・シェイクスピア","original":"Wisely and slow; they stumble that run fast.","japanese":"賢く、ゆっくり進め。急ぐ者はつまずく。","source":"Romeo and Juliet, Act 2 Scene 3","theme":"判断","insight":"早く決めることが常に良いわけではありません。大きな買い物や重要な決断ほど、一晩置くことが失敗を防ぐ場合があります。"},{"id":99,"person":"ウィリアム・シェイクスピア","original":"There is nothing either good or bad, but thinking makes it so.","japanese":"物事に絶対の善悪があるのではない。考え方がそうさせる。","source":"Hamlet, Act 2 Scene 2","theme":"心","insight":"同じ出来事でも意味づけは変えられます。悪い面だけを見ている時は、別の見方が一つでもないか探してみましょう。"},{"id":100,"person":"ウィリアム・シェイクスピア","original":"Better three hours too soon than a minute too late.","japanese":"一分遅れるより、三時間早い方がよい。","source":"The Merry Wives of Windsor, Act 2 Scene 2","theme":"時間","insight":"文字通り三時間前に行く必要はありませんが、時間に余裕を持つと焦りやミスが減ります。重要な予定ほど少し早めに準備しましょう。"}];let pos=Math.floor(Math.random()*quotes.length),favs=new Set(JSON.parse(localStorage.getItem("dailyQuoteFavs100")||"[]"));function render(){let q=quotes[pos];theme.textContent=q.theme;orig.textContent="“"+q.original+"”";ja.textContent="「"+q.japanese+"」";person.textContent="— "+q.person;source.textContent="出典："+q.source;insight.textContent=q.insight;num.textContent=(pos+1)+" / "+quotes.length;fav.textContent=(favs.has(q.id)?"♥":"♡")+" お気に入り"}next.onclick=()=>{pos=(pos+1)%quotes.length;render()};random.onclick=()=>{pos=Math.floor(Math.random()*quotes.length);render()};fav.onclick=()=>{let id=quotes[pos].id;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("dailyQuoteFavs100",JSON.stringify([...favs]));render()};share.onclick=async()=>{let q=quotes[pos],t="“"+q.original+"”\n「"+q.japanese+"」\n— "+q.person+"\n出典："+q.source+"\n\n💡 "+q.insight;if(navigator.share)try{await navigator.share({text:t})}catch(e){}};render();</script></body></html>
