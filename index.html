</main><script>
const quotes=[{"day":1,"original":"The fountain of content must spring up in the mind, and he who has so little knowledge of human nature as to seek happiness by changing anything but his own disposition will waste his life in fruitless efforts, and multiply the griefs which he purposes to remove.","person":"サミュエル・ジョンソン","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 334（サミュエル・ジョンソン名義で収録）"},{"day":2,"original":"","person":"福澤諭吉","theme":"学び・自立","gist":"天は人の上に人を造らず人の下に人を造らずと云へり。","insight":"人に頼らないことではなく、自分で考えて選べる力を持つことが自立です。その土台として学びを続ける、という読み方ができます。","source":"『学問のすゝめ』初編"},{"day":3,"original":"Let a man’s talents or virtues be what they may, we feel satisfaction in his society only as he is satisfied in himself. We cannot enjoy the good qualities of a friend if he seems to be none the better for them.","person":"ウィリアム・ハズリット","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 27（ウィリアム・ハズリット名義で収録）"},{"day":4,"original":"In poverty and other misfortunes of life men think friends to be their only refuge. The young they keep out of mischief, to the old they are a comfort and aid in their weakness, and those in the prime of life they incite to noble deeds.","person":"アリストテレス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 458（アリストテレス名義で収録）"},{"day":5,"original":"The son who delights his father by his good actions; the wife who seeks only her husband’s good; the friend who is the same in prosperity and adversity—these three things are the reward of virtue.","person":"バルトリハリ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 16（バルトリハリ名義で収録）"},{"day":6,"original":"","person":"福澤諭吉","theme":"学び","gist":"賢人と愚人との別は学ぶと学ばざるとに由て出来るものなり。","insight":"学びは知識を増やすだけでなく、選択肢を増やします。分からないことがあった日は、一つ調べて昨日より少し前へ進めば十分です。","source":"『学問のすゝめ』初編"},{"day":7,"original":"The good man shuns evil and follows good; he keeps secret that which ought to be hidden; he makes his virtues manifest to all; he does not forsake one in adversity; he gives in season: such are the marks of a worthy friend.","person":"バルトリハリ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 288（バルトリハリ名義で収録）"},{"day":8,"original":"If thou desirest that the pure in heart should praise thee, lay aside anger; be not a man of many words; and parade not thy virtues in the face of others.","person":"フェルドウスィー","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 130（フェルドウスィー名義で収録）"},{"day":9,"original":"To friends and eke to foes true kindness show; No kindly heart unkindly deeds will do; Harshness will alienate a bosom friend. And kindness reconcile a deadly foe.","person":"ウマル・ハイヤーム","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 5（ウマル・ハイヤーム名義で収録）"},{"day":10,"original":"","person":"福澤諭吉","theme":"自立","gist":"一身独立して一国独立す。","insight":"自分で決めるほど責任も増えます。小さなことから自分で判断し、その結果を引き受ける経験が自信につながります。","source":"『学問のすゝめ』"},{"day":11,"original":"Increase in goodness as long as thou art here, that, when thou departest, in that thou mayest still be joyful. According to our words and deeds in this life will be the remembrance of us in the world.","person":"フェルドウスィー","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 153（フェルドウスィー名義で収録）"},{"day":12,"original":"No man learns to know his inmost nature by introspection, for he rates himself sometimes too low, and often too high, by his own measurement. Man knows himself only by comparing himself with other men; it is life that touches his genuine worth.","person":"ゲーテ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 152（ゲーテ名義で収録）"},{"day":13,"original":"","person":"福澤諭吉","theme":"自由・責任","gist":"自由と我儘との界は、他人の妨げを為すと為さざるとの間にあり。","insight":"自由は何をしてもよいという意味ではありません。自分の自由と相手の自由が両立する境界を意識すると、人間関係も安定します。","source":"『学問のすゝめ』"},{"day":14,"original":"Wisdom alone is the true and unalloyed coin for which we ought to exchange all things, for this and with this everything is bought and sold—fortitude, temperance, and justice; in a word, true virtue subsists with wisdom.","person":"プラトン","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 482（プラトン名義で収録）"},{"day":15,"original":"Do nothing rashly; want of circumspection is the chief cause of failure and disaster. Fortune, wise lover of the wise, selects him for her lord who ere he acts reflects.","person":"バーラヴィ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 473（バーラヴィ名義で収録）"},{"day":16,"original":"Seest thou good days? Prepare for evil times. No summer but hath its winter. He never reaped comfort in adversity that sowed not in prosperity.","person":"フランシス・クォールズ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 393（フランシス・クォールズ名義で収録）"},{"day":17,"original":"","person":"福澤諭吉","theme":"学び","gist":"学問の本趣意は読書にのみ非ずして精神の働きに在り。","insight":"学びは知識を増やすだけでなく、選択肢を増やします。分からないことがあった日は、一つ調べて昨日より少し前へ進めば十分です。","source":"『学問のすゝめ』"},{"day":18,"original":"No man is the wiser for his learning. It may administer matter to work in, or objects to work upon, but wit and wisdom are born with a man.","person":"ジョン・セルデン","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 558（ジョン・セルデン名義で収録）"},{"day":19,"original":"Be patient, if thou wouldst thy ends accomplish; for like patience is there no appliance effective of success, producing certainly abundant fruit of actions, never damped by failure, conquering all impediments.","person":"バーラヴィ","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 118（バーラヴィ名義で収録）"},{"day":20,"original":"Patience is the chiefest fruit of study; a man that strives to make himself different from other men by much reading gains this chiefest good, that in all fortunes he hath something to entertain and comfort himself withal.","person":"ジョン・セルデン","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 476（ジョン・セルデン名義で収録）"},{"day":21,"original":"","person":"福澤諭吉","theme":"自立","gist":"独立の気力なき者は必ず人に依頼す。","insight":"自分で決めるほど責任も増えます。小さなことから自分で判断し、その結果を引き受ける経験が自信につながります。","source":"『学問のすゝめ』"},{"day":22,"original":"We are like vessels tossed on the bosom of the deep; our passions are the winds that sweep us impetuously forward; each pleasure is a rock; the whole life is a wide ocean. Reason is the pilot to guide us, but often allows itself to be led astray by the storms of pride.","person":"ピエトロ・メタスタージオ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 409（ピエトロ・メタスタージオ名義で収録）"},{"day":23,"original":"If with a stranger thou discourse, first learn, By strictest observation, to discern If he be wiser than thyself, if so, Be dumb, and rather choose by him to know; But if thyself perchance the wiser be, Then do thou speak, that he may learn by thee.","person":"トーマス・ランドルフ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 254（トーマス・ランドルフ名義で収録）"},{"day":24,"original":"","person":"福澤諭吉","theme":"時間","gist":"人の一生は誠に僅の事なり。","insight":"この言葉を今日の生活に置き換え、実際にできる小さな行動を一つ決めてみましょう。言葉は行動に変えた時に自分のものになります。","source":"『福翁百話』"},{"day":25,"original":"How can we learn to know ourselves? By reflection, never, but by our actions. Attempt to do your duty, and you will immediately find what is in you.","person":"ゲーテ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 261（ゲーテ名義で収録）"},{"day":26,"original":"Hearts are like tapers, which at beauteous eyes Kindle a flame of love that never dies; And beauty is a flame, where hearts, like moths, Offer themselves a burning sacrifice.","person":"ウマル・ハイヤーム","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 179（ウマル・ハイヤーム名義で収録）"},{"day":27,"original":"Look not mournfully into the Past. It comes not back again. Wisely improve the Present. It is thine. Go forth to meet the shadowy Future, without fear, and with a manly heart.","person":"ヘンリー・ワズワース・ロングフェロー","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 326（ヘンリー・ワズワース・ロングフェロー名義で収録）"},{"day":28,"original":"","person":"福澤諭吉","theme":"人間関係","gist":"世の中で一番美しいことは、すべての物に愛情を持つことです。","insight":"自分を大切にすることと、相手を尊重することは両立します。自分の個性を守るなら、相手の違いも同じように認めたいものです。","source":"福澤諭吉の言葉として慶應関係資料等で紹介"},{"day":29,"original":"Whilom, ere youth’s conceit had waned, methought Answers to all life’s problems I had wrought; But now, grown old and wise, too late I see My life is spent, and all my lore is nought.","person":"ウマル・ハイヤーム","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 235（ウマル・ハイヤーム名義で収録）"},{"day":30,"original":"Let us be well persuaded that everyone of us possesses happiness in proportion to his virtue and wisdom, and according as he acts in obedience to their suggestion.","person":"アリストテレス","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 367（アリストテレス名義で収録）"},{"day":31,"original":"Women are ever masters when they like, And cozen with their kindness; they have spells Superior to the wand of the magicians; And from their lips the words of wisdom fall, Like softest music on the listening ear.","person":"フェルドウスィー","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 230（フェルドウスィー名義で収録）"},{"day":32,"original":"","person":"渋沢栄一","theme":"仕事・お金","gist":"論語と算盤は甚だ遠くして甚だ近いもの。","insight":"利益だけでも理想だけでも仕事は続きません。正しい方法で価値を生み、その結果として利益を得るという順番を意識したい言葉です。","source":"『論語と算盤』処世と信条"},{"day":33,"original":"Very distasteful is excessive fame To the sour palate of the envious mind, Who hears with grief his neighbours good by name, And hates the fortune that he ne’er shall find.","person":"ピンダロス","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 343（ピンダロス名義で収録）"},{"day":34,"original":"Poverty is not dishonourable in itself, but only when it arises from idleness, intemperance, extravagance, and folly.","person":"プルタルコス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 472（プルタルコス名義で収録）"},{"day":35,"original":"","person":"渋沢栄一","theme":"仕事・お金","gist":"富を成す根源は仁義道徳、正しい道理の富でなければならぬ。","insight":"利益だけでも理想だけでも仕事は続きません。正しい方法で価値を生み、その結果として利益を得るという順番を意識したい言葉です。","source":"『論語と算盤』処世と信条"},{"day":36,"original":"Were all thy fond endeavours vain To chase away the sufferer’s smart, Still hover near, lest absence pain His lonely heart. For friendship’s tones have kindlier power Than odorous fruit, or nectared bowl, To soothe, in sorrow’s languid hour, The sinking soul.","person":"サアディ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 346（サアディ名義で収録）"},{"day":37,"original":"The round of a passionate man’s life is in contracting debts in his passion which his virtue obliges him to pay. He spends his time in outrage and acknowledgment, injury and reparation.","person":"サミュエル・ジョンソン","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 74（サミュエル・ジョンソン名義で収録）"},{"day":38,"original":"Lost money is bewailed with deeper sighs Than friends, or kindred, and with louder cries.","person":"ユウェナリス","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 190（ユウェナリス名義で収録）"},{"day":39,"original":"","person":"渋沢栄一","theme":"仕事","gist":"士魂商才。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"『論語と算盤』処世と信条"},{"day":40,"original":"I hate the miser, whose unsocial breast Locks from the world his useless stores. Wealth by the bounteous only is enjoyed, Whose treasures, in diffusive good employed, The rich return of fame and friends procure, And ’gainst a sad reverse a safe retreat secure.","person":"ピンダロス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 481（ピンダロス名義で収録）"},{"day":41,"original":"The man of affluence is not in fact more happy than the possessor of a bare competency, unless, in addition to his wealth, the end of his life be fortunate. We often see misery dwelling in the midst of splendour, whilst real happiness is found in humbler stations.","person":"ヘロドトス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 187（ヘロドトス名義で収録）"},{"day":42,"original":"","person":"渋沢栄一","theme":"信用","gist":"信用は実に資本であって商売繁昌の根底である。","insight":"信用は一度に作れません。約束を守る、返信する、誤りを認めるといった小さな行動の積み重ねが後で大きな力になります。","source":"『論語と算盤』"},{"day":43,"original":"There is no pleasure of life sprouting like a tree from one root but there is some pain joined to it; and again nature brings good out of evil.","person":"メナンドロス","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 353（メナンドロス名義で収録）"},{"day":44,"original":"It cannot but be injurious to the human mind never to be called into effort: the habit of receiving pleasure without any exertion of thought, by the mere excitement of curiosity, and sensibility, may be justly ranked among the worst effects of habitual novel-reading.","person":"サミュエル・テイラー・コールリッジ","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 475（サミュエル・テイラー・コールリッジ名義で収録）"},{"day":45,"original":"To the tongue which bringeth thee words without reason, the answer that best beseemeth thee is—silence.","person":"ニザーミー","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 181（ニザーミー名義で収録）"},{"day":46,"original":"","person":"渋沢栄一","theme":"心","gist":"成敗に関わらず、精神を常に満足させねばならぬ。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"『論語と算盤』"},{"day":47,"original":"As gold is tried by the furnace, and the baser metal shown, so the hollow-hearted friend is known by adversity.","person":"ピエトロ・メタスタージオ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 330（ピエトロ・メタスタージオ名義で収録）"},{"day":48,"original":"Time, which gnaws and diminishes all things else, augments and increases benefits, because a noble action of liberality done to a man of reason doth grow continually by his generously thinking of it and remembering it.","person":"フランソワ・ラブレー","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 345（フランソワ・ラブレー名義で収録）"},{"day":49,"original":"Humility is a virtue all preach, none practise, and yet everybody is content to hear. The master thinks it good doctrine for his servant, the laity for the clergy, and the clergy for the laity.","person":"ジョン・セルデン","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 150（ジョン・セルデン名義で収録）"},{"day":50,"original":"","person":"渋沢栄一","theme":"心","gist":"得意時代だからとて気を緩さず、失意時代だからとて落胆せず。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"『論語と算盤』得意時代と失意時代"},{"day":51,"original":"The mere reality of life would be inconceivably poor without the charm of fancy, which brings in its bosom as many vain fears as idle hopes, but lends much oftener to the illusions it calls up a gay flattering hue than one which inspires terror.","person":"ヴィルヘルム・フォン・フンボルト","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 514（ヴィルヘルム・フォン・フンボルト名義で収録）"},{"day":52,"original":"The friendships formed between good and evil men differ. The friendship of the good, at first faint like the morning light, continually increases; the friendship of the evil at the very beginning is like the light of midday, and dies away like the light of evening.[13]","person":"バルトリハリ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 309（バルトリハリ名義で収録）"},{"day":53,"original":"","person":"渋沢栄一","theme":"希望","gist":"道理ある希望を持つのがよい。","insight":"根拠のない楽観ではなく、まだできることがあると考えて動くことが希望です。問題を一つ小さく分けてみましょう。","source":"『論語と算盤』"},{"day":54,"original":"Discontent is like ink poured into water, which fills the whole fountain full of blackness. It casts a cloud over the mind, and renders it more occupied about the evil which disquiets it than about the means of removing it.","person":"オーウェン・フェルサム","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 520（オーウェン・フェルサム名義で収録）"},{"day":55,"original":"He that will give himself to all manner of ways to get money may be rich; so he that lets fly all he knows or thinks may by chance be satirically witty. Honesty sometimes keeps a man from growing rich, and civility from being witty.","person":"ジョン・セルデン","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 470（ジョン・セルデン名義で収録）"},{"day":56,"original":"It is our follies that make our lives uncomfortable. Our errors of opinion, our cowardly fear of the world’s worthless censure, and our eagerness after unnecessary gold have hampered the way of virtue, and made it far more difficult than, in itself, it is.","person":"オーウェン・フェルサム","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 97（オーウェン・フェルサム名義で収録）"},{"day":57,"original":"","person":"渋沢栄一","theme":"仕事","gist":"事業には信用が第一である。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"『論語と算盤』の趣旨"},{"day":58,"original":"He who devises evil for another falls at last into his own pit, and the most cunning finds himself caught by what he had prepared for another. But virtue without guile, erect like the lofty palm, rises with greater vigour when it is oppressed.","person":"ピエトロ・メタスタージオ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 162（ピエトロ・メタスタージオ名義で収録）"},{"day":59,"original":"It is commonly a dangerous thing for a man to have more sense than his neighbours. Socrates paid for his superiority with his life; and if Aristotle saved his skin, accused as he was of heresy by the chief priest Eurymedon, it was because he took to his heels in time.","person":"クリストフ・マルティン・ヴィーラント","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 527（クリストフ・マルティン・ヴィーラント名義で収録）"},{"day":60,"original":"Men are not to be judged by their looks, habits, and appearances, but by the character of their lives and conversations. ’Tis better that a man’s own works than another man’s words should praise him.","person":"ロジャー・レストレンジ","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 109（ロジャー・レストレンジ名義で収録）"},{"day":61,"original":"","person":"西郷隆盛","theme":"誠実","gist":"敬天愛人。","insight":"誰も見ていない時にも自分が納得できる行動を選ぶ。それが長い目で見た信用と自信につながります。","source":"『南洲翁遺訓』に伝わる思想"},{"day":62,"original":"Let thy words between two foes be such that if they were to become friends thou shouldst not be ashamed.","person":"サアディ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 84（サアディ名義で収録）"},{"day":63,"original":"A lively blockhead in company is a public benefit. Silence or dulness by the side of folly looks like wisdom.","person":"ウィリアム・ハズリット","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 562（ウィリアム・ハズリット名義で収録）"},{"day":64,"original":"","person":"西郷隆盛","theme":"心","gist":"人を相手にせず、天を相手にせよ。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"『南洲翁遺訓』"},{"day":65,"original":"The value of three things is justly appreciated by all classes of men: youth, by the old; health, by the diseased; and wealth, by the needy.","person":"ウマル・ハイヤーム","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 399（ウマル・ハイヤーム名義で収録）"},{"day":66,"original":"Truth from the mouth of an honest man and severity from a good-natured man have a double effect.","person":"ウィリアム・ハズリット","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 332（ウィリアム・ハズリット名義で収録）"},{"day":67,"original":"An absent friend gives us friendly company when we are well assured of his happiness.","person":"ゲーテ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 496（ゲーテ名義で収録）"},{"day":68,"original":"","person":"西郷隆盛","theme":"自分を知る","gist":"己れを愛するは善からぬことの第一也。","insight":"他人の欠点より自分の癖は見えにくいものです。失敗した時、自分側で直せる点を一つ探すと経験が成長に変わります。","source":"『南洲翁遺訓』"},{"day":69,"original":"A man ought not to return evil for evil, as many think, since at no time ought we to do an injury to our neighbour.[22]","person":"プラトン","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 413（プラトン名義で収録）"},{"day":70,"original":"Heed not the flatterer’s fulsome talk, He from thee hopes some trifle to obtain; Thou wilt, shouldst thou his wishes baulk, Ten hundred times as much of censure gain.","person":"サアディ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 459（サアディ名義で収録）"},{"day":71,"original":"Anger that has no limit causes terror, and unseasonable kindness does away with respect. Be not so severe as to cause disgust, nor so lenient as to make people presume.","person":"サアディ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 117（サアディ名義で収録）"},{"day":72,"original":"","person":"西郷隆盛","theme":"仕事・責任","gist":"些とも私を挟みては済まぬもの也。","insight":"立場が上がるほど、自分の好みと組織にとって良い判断を分ける必要があります。私情を一度外して考える習慣が役立ちます。","source":"『南洲翁遺訓』第一条"},{"day":73,"original":"All kinds of beauty do not inspire love: there is a kind of it which pleases only the sight, but does not captivate the affections.","person":"ミゲル・デ・セルバンテス","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 100（ミゲル・デ・セルバンテス名義で収録）"},{"day":74,"original":"No fathers and mothers think their own children ugly, and this self-deceit is yet stronger with respect to the offspring of the mind.","person":"ミゲル・デ・セルバンテス","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 417（ミゲル・デ・セルバンテス名義で収録）"},{"day":75,"original":"","person":"西郷隆盛","theme":"判断","gist":"心を公平に操り、正道を踏み。","insight":"迷った時は、事実・感情・予想を分けて考えてみましょう。思い込みを事実として扱わないだけでも判断の質は上がります。","source":"『南洲翁遺訓』第一条"},{"day":76,"original":"If passion gaineth the mastery over reason, the wise will not count thee amongst men.","person":"フェルドウスィー","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 2（フェルドウスィー名義で収録）"},{"day":77,"original":"Vulgar prejudices are those which arise out of accident, ignorance, or authority; natural prejudices are those which arise out of the constitution of the human mind itself.","person":"ウィリアム・ハズリット","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 551（ウィリアム・ハズリット名義で収録）"},{"day":78,"original":"Eschew that friend, if thou art wise, who consorts with thy enemies.","person":"サアディ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 544（サアディ名義で収録）"},{"day":79,"original":"","person":"西郷隆盛","theme":"準備","gist":"事に当り思慮の乏しきを憂ふること勿れ。","insight":"本番で急に良い判断をするのは難しいものです。大切なことほど事前に考え、失敗した場合の次の手まで用意すると落ち着いて動けます。","source":"『南洲翁遺訓』追加"},{"day":80,"original":"By Fate full many a heart has been undone, And many a sprightly rose made woe-begone; Plume thee not on thy lusty youth and strength: Full many a bud is blasted ere its bloom.","person":"ウマル・ハイヤーム","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 122（ウマル・ハイヤーム名義で収録）"},{"day":81,"original":"There is nothing keeps longer than a middling fortune, and nothing melts away sooner than a great one. Poverty treads upon the heels of great and unexpected riches.","person":"ラ・ブリュイエール","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 536（ラ・ブリュイエール名義で収録）"},{"day":82,"original":"Real and solid happiness springs from moderation.","person":"ゲーテ","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 363（ゲーテ名義で収録）"},{"day":83,"original":"","person":"吉田松陰","theme":"目標","gist":"夢なき者に理想なし。","insight":"目標が大きすぎると動けなくなります。今日できる行動まで小さくして、まず一つ終わらせると目標が現実に近づきます。","source":"吉田松陰の言葉として伝承"},{"day":84,"original":"Adorn thy mind with knowledge, for knowledge maketh thy worth.","person":"フェルドウスィー","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 286（フェルドウスィー名義で収録）"},{"day":85,"original":"The wicked have no stability, for they do not remain in consistency with themselves; they continue friends only for a short time, rejoicing in each other’s wickedness.","person":"アリストテレス","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 411（アリストテレス名義で収録）"},{"day":86,"original":"","person":"吉田松陰","theme":"目標","gist":"志を立てて以て万事の源と為す。","insight":"目標が大きすぎると動けなくなります。今日できる行動まで小さくして、まず一つ終わらせると目標が現実に近づきます。","source":"吉田松陰の言葉として伝承"},{"day":87,"original":"Choose knowledge, if thou desirest a blessing from the Universal Provider; for the ignorant man cannot raise himself above the earth, and it is by knowledge that thou must render thy soul praiseworthy.","person":"フェルドウスィー","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 55（フェルドウスィー名義で収録）"},{"day":88,"original":"Those who are guided by reason are generally successful in their plans; those who are rash and precipitate seldom enjoy the favour of the gods.","person":"ヘロドトス","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 559（ヘロドトス名義で収録）"},{"day":89,"original":"Obstinate silence implies either a mean opinion of ourselves, or a contempt for our company; and it is the more provoking, as others do not know to which of these causes to attribute it—whether humility or pride.","person":"ウィリアム・ハズリット","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 244（ウィリアム・ハズリット名義で収録）"},{"day":90,"original":"","person":"吉田松陰","theme":"誠実","gist":"至誠にして動かざる者は未だ之れ有らざるなり。","insight":"誰も見ていない時にも自分が納得できる行動を選ぶ。それが長い目で見た信用と自信につながります。","source":"吉田松陰が重んじた『孟子』の句"},{"day":91,"original":"Wrapt up in error is the human mind, And human bliss is ever insecure; Know we what fortune yet remains behind? Know we how long the present shall endure?","person":"ピンダロス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 66（ピンダロス名義で収録）"},{"day":92,"original":"The shadows of the mind are like those of the body. In the morning of life they all lie behind us, at noon we trample them under foot, and in the evening they stretch long, broad, and deepening before us.","person":"ヘンリー・ワズワース・ロングフェロー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 226（ヘンリー・ワズワース・ロングフェロー名義で収録）"},{"day":93,"original":"We have more faith in a well-written romance while we are reading it than in common history. The vividness of the representations in the one case more than counterbalances the mere knowledge of the truth of facts in the other.","person":"ウィリアム・ハズリット","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 419（ウィリアム・ハズリット名義で収録）"},{"day":94,"original":"","person":"吉田松陰","theme":"人生","gist":"今日死を決するの安心は四時の順環に於て得る所あり。","insight":"人生全体の答えを一度に出す必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わります。","source":"『留魂録』"},{"day":95,"original":"The mother of the useful arts is necessity, that of the fine arts is luxury; for father the former have intellect, the latter, genius, which itself is a kind of luxury.","person":"アルトゥル・ショーペンハウアー","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 540（アルトゥル・ショーペンハウアー名義で収録）"},{"day":96,"original":"In this world, however little happiness may have been our portion, yet have we no desire to die. Whether he can speak of life as cheerful and delicate, or as full of pain, anxiety, and sorrow, never yet have I seen one who wished to die.","person":"フェルドウスィー","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 138（フェルドウスィー名義で収録）"},{"day":97,"original":"","person":"吉田松陰","theme":"信念","gist":"身はたとひ武蔵の野辺に朽ちぬとも留置まし大和魂。","insight":"信念は頑固になることではありません。大切な軸を持ちながら、新しい事実があれば方法は柔軟に変えることができます。","source":"『留魂録』"},{"day":98,"original":"Pride is a vice which pride itself inclines every man to find in others and overlook in himself.","person":"サミュエル・ジョンソン","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 107（サミュエル・ジョンソン名義で収録）"},{"day":99,"original":"He who has given satisfaction to the best of his time has lived for ages.","person":"フリードリヒ・シラー","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 156（フリードリヒ・シラー名義で収録）"},{"day":100,"original":"Friendship throws a greater lustre on prosperity, while it lightens adversity by sharing in its griefs and troubles.","person":"キケロ","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 477（キケロ名義で収録）"},{"day":101,"original":"","person":"吉田松陰","theme":"家族","gist":"親思ふこころにまさる親ごころ。","insight":"近い関係ほど感謝を言葉にする機会が減りがちです。家族だから分かるだろうと思わず、短い一言でも伝えることに意味があります。","source":"吉田松陰辞世として伝わる歌"},{"day":102,"original":"Gross ignorance produces a dogmatic spirit. He who knows nothing thinks he can teach others what he has himself just been learning. He who knows much scarcely believes that what he is saying is unknown to others, and consequently speaks with more hesitation.","person":"ラ・ブリュイエール","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 290（ラ・ブリュイエール名義で収録）"},{"day":103,"original":"Be modest and simple in your deportment, and treat with indifference whatever lies between virtue and vice. Love the human race; obey God.","person":"マルクス・アウレリウス","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 206（マルクス・アウレリウス名義で収録）"},{"day":104,"original":"Faith is like love, it cannot be forced. Therefore it is a dangerous operation if an attempt be made to introduce or bind it by state regulations; for, as the attempt to force love begets hatred, so also to compel religious belief produces rank unbelief.","person":"アルトゥル・ショーペンハウアー","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 408（アルトゥル・ショーペンハウアー名義で収録）"},{"day":105,"original":"","person":"夏目漱石","theme":"自分らしさ","gist":"自己本位という四字をようやく考えて。","insight":"周囲の意見を参考にしつつ、最後は自分で考える。他人の人生をコピーせず、自分が納得できる基準を持つことが大切です。","source":"『私の個人主義』"},{"day":106,"original":"The constant man loses not his virtue in misfortune. A torch may point towards the ground, but its flame will still point upwards.","person":"バルトリハリ","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 577（バルトリハリ名義で収録）"},{"day":107,"original":"Idleness is a great enemy to mankind. There is no friend like energy, for, if you cultivate that, it will never fail.","person":"バルトリハリ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 424（バルトリハリ名義で収録）"},{"day":108,"original":"","person":"夏目漱石","theme":"自分らしさ","gist":"他人本位ではいけない。","insight":"周囲の意見を参考にしつつ、最後は自分で考える。他人の人生をコピーせず、自分が納得できる基準を持つことが大切です。","source":"『私の個人主義』の趣旨"},{"day":109,"original":"No one ought to despond in adverse circumstances, for they may turn out to be the cause of good to us.[30]","person":"メナンドロス","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 576（メナンドロス名義で収録）"},{"day":110,"original":"Success is like a lovely woman, wooed by many men, but folded in the arms of him alone who, free from over-zeal, firmly persists and calmly perseveres.","person":"バーラヴィ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 585（バーラヴィ名義で収録）"},{"day":111,"original":"The noble-minded dedicate themselves to the promotion of the happiness of others—even of those who injure them. True happiness consists in making happy.","person":"バーラヴィ","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 311（バーラヴィ名義で収録）"},{"day":112,"original":"","person":"夏目漱石","theme":"人間関係","gist":"私は私の個性を発展させると同時に、他人の個性も尊重します。","insight":"自分を大切にすることと、相手を尊重することは両立します。自分の個性を守るなら、相手の違いも同じように認めたいものです。","source":"『私の個人主義』"},{"day":113,"original":"Those who wish well towards their friends disdain to please them with words which are not true.","person":"バーラヴィ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 13（バーラヴィ名義で収録）"},{"day":114,"original":"In the hour of adversity be not without hope, for crystal rain falls from black clouds.","person":"ニザーミー","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 8（ニザーミー名義で収録）"},{"day":115,"original":"","person":"夏目漱石","theme":"責任","gist":"権力を使用する以上、義務が附随している。","insight":"権限や力には責任が伴います。できることが増えた時ほど、その力を誰のためにどう使うかを考える必要があります。","source":"『私の個人主義』"},{"day":116,"original":"Our time is like our money; when we change a guinea the shillings escape as things of small account; when we break a day by idleness in the morning, the rest of the hours lose their importance in our eyes.","person":"ウォルター・スコット","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 360（ウォルター・スコット名義で収録）"},{"day":117,"original":"Hath any wronged thee, be bravely revenged. Slight it, and the work’s begun; forgive it, and ’tis finished. He is below himself that is not above an injury.","person":"フランシス・クォールズ","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 329（フランシス・クォールズ名義で収録）"},{"day":118,"original":"Whoever brings cheerfulness to his work, and is ever active, dashes through the world’s labours.","person":"ルートヴィヒ・ティーク","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 302（ルートヴィヒ・ティーク名義で収録）"},{"day":119,"original":"","person":"夏目漱石","theme":"お金・責任","gist":"金力を使用する以上、責任が附随している。","insight":"お金は選択肢を増やしますが、使い方にも責任があります。値段だけでなく、その支出が自分や周囲に何を残すか考えてみましょう。","source":"『私の個人主義』"},{"day":120,"original":"We deliberate about the parcels of life, but not about life itself, and so we arrive all unawares at its different epochs, and have the trouble of beginning all again. And so finally it is that we do not walk as men confidently towards death, but let death come suddenly upon us.","person":"セネカ","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 461（セネカ名義で収録）"},{"day":121,"original":"No joy in nature is so sublimely affecting as the joy of a mother at the good fortune of a child.","person":"ジャン・パウル","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 566（ジャン・パウル名義で収録）"},{"day":122,"original":"As drops of bitter medicine, though minute, may have a salutary force, so words, though few and painful, uttered seasonably, may rouse the prostrate energies of those who meet misfortune with despondency.","person":"バーラヴィ","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 82（バーラヴィ名義で収録）"},{"day":123,"original":"","person":"夏目漱石","theme":"判断","gist":"智に働けば角が立つ。情に棹させば流される。","insight":"迷った時は、事実・感情・予想を分けて考えてみましょう。思い込みを事実として扱わないだけでも判断の質は上がります。","source":"『草枕』"},{"day":124,"original":"The way to subject all things to thyself is to subject thyself to reason; thou shalt govern many if reason govern thee. Wouldst thou be a monarch of a little world, command thyself.","person":"フランシス・クォールズ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 299（フランシス・クォールズ名義で収録）"},{"day":125,"original":"Use law and physic only for necessity. They that use them otherwise abuse themselves into weak bodies and light purses. They are good remedies, bad businesses, and worse recreations.","person":"フランシス・クォールズ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 167（フランシス・クォールズ名義で収録）"},{"day":126,"original":"","person":"宮本武蔵","theme":"決断","gist":"我、事において後悔せず。","insight":"決断した後に延々と自分を責めるより、そこから何を学ぶかへ意識を移す方が前に進めます。次の判断材料に変えましょう。","source":"『独行道』"},{"day":127,"original":"When you see a man elated with pride, glorying in his riches and high descent, rising even above fortune, look out for his speedy punishment; for he is only raised the higher that he may fall with a heavier crash.","person":"メナンドロス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 291（メナンドロス名義で収録）"},{"day":128,"original":"I never yet found pride in a noble nature nor humility in an unworthy mind.","person":"オーウェン・フェルサム","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 157（オーウェン・フェルサム名義で収録）"},{"day":129,"original":"Whoever has the seed of virtue and honour implanted in his breast will drop a sympathising tear on the woes of his neighbour.","person":"ナフシャビー","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 371（ナフシャビー名義で収録）"},{"day":130,"original":"","person":"宮本武蔵","theme":"自制","gist":"身に楽しみをたくまず。","insight":"欲しいものや楽な方へ毎回流されない力も自由の一部です。小さな誘惑に一度だけ『今はやらない』と言う練習から始められます。","source":"『独行道』"},{"day":131,"original":"Love of money is the disease which renders us most pitiful and grovelling, and love of pleasure is that which renders us most despicable.","person":"ロンギノス","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 188（ロンギノス名義で収録）"},{"day":132,"original":"Man is an actor who plays various parts: First comes a boy, then out a lover starts; His garb is changed for, lo! a beggar’s rags; Then he’s a merchant with full money-bags; Anon, an aged sire, wrinkled and lean; At last Death drops the curtain on the scene.[5]","person":"バルトリハリ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 37（バルトリハリ名義で収録）"},{"day":133,"original":"Give not thy tongue too great a liberty, lest it take thee prisoner. A word unspoken is like thy sword in thy scabbard; if vented, the sword is in another’s hand.[23] If thou desire to be held wise, be so wise as to hold thy tongue.","person":"フランシス・クォールズ","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 438（フランシス・クォールズ名義で収録）"},{"day":134,"original":"","person":"宮本武蔵","theme":"自立","gist":"よろずに依怙の心なし。","insight":"自分で決めるほど責任も増えます。小さなことから自分で判断し、その結果を引き受ける経験が自信につながります。","source":"『独行道』"},{"day":135,"original":"He travels safe and not unpleasantly who is guarded by poverty and guided by love.","person":"フィリップ・シドニー","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 105（フィリップ・シドニー名義で収録）"},{"day":136,"original":"In conversation humour is more than wit, easiness, more than knowledge; few desire to learn, or to think they need it; all desire to be pleased, or, if not, to be easy.","person":"ウィリアム・テンプル","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 71（ウィリアム・テンプル名義で収録）"},{"day":137,"original":"","person":"宮本武蔵","theme":"覚悟","gist":"道においては死をいとわず思う。","insight":"重要なことにはリスクが伴います。怖さをなくすのではなく、何を守り何を引き受けるかを決めて進むことが覚悟です。","source":"『独行道』"},{"day":138,"original":"There is a rabble among the gentry as well as the commonalty; a sort of plebeian heads whose fancy moves with the same wheel as these men—in the same level with mechanics, though their fortunes do sometimes gild their infirmities and their purses compound for their follies.","person":"トーマス・ブラウン","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 358（トーマス・ブラウン名義で収録）"},{"day":139,"original":"Certain books seem to be written, not that we might learn from them, but in order that we might see how much the author knows.","person":"ゲーテ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 195（ゲーテ名義で収録）"},{"day":140,"original":"It is only necessary to grow old in order to become more indulgent. I see no fault committed that I have not been myself inclined to.","person":"ゲーテ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 464（ゲーテ名義で収録）"},{"day":141,"original":"","person":"宮本武蔵","theme":"自立","gist":"仏神は貴し、仏神をたのまず。","insight":"自分で決めるほど責任も増えます。小さなことから自分で判断し、その結果を引き受ける経験が自信につながります。","source":"『独行道』"},{"day":142,"original":"When thou utterest not a word thou hast laid thy hand upon it; when thou hast uttered it, it hath laid its hand on thee.","person":"サアディ","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 180（サアディ名義で収録）"},{"day":143,"original":"True modesty and true pride are much the same thing. Both consist in setting a just value on ourselves—neither more nor less.","person":"ウィリアム・ハズリット","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 159（ウィリアム・ハズリット名義で収録）"},{"day":144,"original":"Whosoever hath not knowledge, and benevolence, and piety knoweth nothing of reality, and dwelleth only in semblance.","person":"サアディ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 546（サアディ名義で収録）"},{"day":145,"original":"","person":"宮本武蔵","theme":"継続","gist":"千日の稽古を鍛とし、万日の稽古を錬とす。","insight":"大きな努力を一度するより、小さくても続ける方が強いことがあります。毎日無理なくできる量にして積み重ねましょう。","source":"『五輪書』"},{"day":146,"original":"We are accustomed to see men deride what they do not understand, and snarl at the good and beautiful because it lies beyond their sympathies.","person":"ゲーテ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 521（ゲーテ名義で収録）"},{"day":147,"original":"There are many who talk on from ignorance rather than from knowledge, and who find the former an inexhaustible fund of conversation.","person":"ウィリアム・ハズリット","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 301（ウィリアム・ハズリット名義で収録）"},{"day":148,"original":"","person":"新渡戸稲造","theme":"文化","gist":"武士道はその表徴たる桜花と同じく、日本の土地に固有の花である。","insight":"昔の価値観をそのまま受け入れるのではなく、何が今にも通じ、何を変えるべきか考える材料として読むと古典は生きてきます。","source":"『武士道』"},{"day":149,"original":"Dost thou desire that thine own heart should not suffer, redeem thou the sufferer from the bonds of misery.","person":"サアディ","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 4（サアディ名義で収録）"},{"day":150,"original":"I have observed that as long as a man lives and exerts himself he can always find food and raiment, though, it may be, not of the choicest description.","person":"ゲーテ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 134（ゲーテ名義で収録）"},{"day":151,"original":"It is well that there is no one without a fault, for he would not have a friend in the world: he would seem to belong to a different species.","person":"ウィリアム・ハズリット","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 269（ウィリアム・ハズリット名義で収録）"},{"day":152,"original":"","person":"新渡戸稲造","theme":"誠実","gist":"義は武士の掟中最も厳格なる教訓である。","insight":"誰も見ていない時にも自分が納得できる行動を選ぶ。それが長い目で見た信用と自信につながります。","source":"『武士道』"},{"day":153,"original":"I put no account on him who esteems himself just as the popular breath may chance to raise him.","person":"ゲーテ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 76（ゲーテ名義で収録）"},{"day":154,"original":"No one hath come into the world for a continuance save him who leaveth behind him a good name.[11]","person":"サアディ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 289（サアディ名義で収録）"},{"day":155,"original":"In no wise ask about the faults of others, for he who reporteth the faults of others will report thine also.","person":"フェルドウスィー","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 20（フェルドウスィー名義で収録）"},{"day":156,"original":"","person":"新渡戸稲造","theme":"勇気","gist":"勇気は義のために行われるのでなければ徳の中に数えられない。","insight":"勇気は怖くないことではなく、必要なことなら怖くても動くことです。まず失敗しても戻せる小さな一歩から試してみましょう。","source":"『武士道』"},{"day":157,"original":"Reason is captive in the hands of the passions, as a weak man in the hands of an artful woman.","person":"サアディ","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 14（サアディ名義で収録）"},{"day":158,"original":"If thy garments be clean and thy heart be foul, thou needest no key to the door of hell.","person":"サアディ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 62（サアディ名義で収録）"},{"day":159,"original":"","person":"新渡戸稲造","theme":"人間関係","gist":"礼は他人の感情に対する同情的な顧慮である。","insight":"自分を大切にすることと、相手を尊重することは両立します。自分の個性を守るなら、相手の違いも同じように認めたいものです。","source":"『武士道』"},{"day":160,"original":"He who does not think too much of himself is much more esteemed than he imagines.","person":"ゲーテ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 282（ゲーテ名義で収録）"},{"day":161,"original":"Happy the man who early learns the difference between his wishes and his powers.","person":"ゲーテ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 293（ゲーテ名義で収録）"},{"day":162,"original":"We should know mankind better if we were not so anxious to resemble one another.","person":"ゲーテ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 369（ゲーテ名義で収録）"},{"day":163,"original":"","person":"新渡戸稲造","theme":"誠実","gist":"誠なくして礼なし。","insight":"誰も見ていない時にも自分が納得できる行動を選ぶ。それが長い目で見た信用と自信につながります。","source":"『武士道』の趣旨"},{"day":164,"original":"All confidence is dangerous unless it is complete; there are few circumstances in which it is not better either to hide all or to tell all.","person":"ラ・ブリュイエール","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 268（ラ・ブリュイエール名義で収録）"},{"day":165,"original":"A day of fortune is like a harvest-day, we must be busy when the corn is ripe.","person":"ゲーテ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 276（ゲーテ名義で収録）"},{"day":166,"original":"Hast thou not perfect excellence, ’tis best To keep thy tongue in silence, for ’tis this Which shames a man; as lightness does attest The nut is empty, nor of value is.","person":"サアディ","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 444（サアディ名義で収録）"},{"day":167,"original":"","person":"松下幸之助","theme":"行動","gist":"道をひらくためには、まず歩まねばならぬ。","insight":"考え続けるだけでは道は開きません。完璧な準備を待たず、今日できる最小の一歩を実際にやることが次につながります。","source":"『道をひらく』「道」／PHP研究所"},{"day":168,"original":"Keep thy heart afar from sorrow, and be not anxious about the trouble which is not yet come.","person":"フェルドウスィー","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 61（フェルドウスィー名義で収録）"},{"day":169,"original":"We in reality only know when we doubt a little. With knowledge comes doubt.","person":"ゲーテ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 7（ゲーテ名義で収録）"},{"day":170,"original":"","person":"松下幸之助","theme":"目標","gist":"志を立てよう。","insight":"目標が大きすぎると動けなくなります。今日できる行動まで小さくして、まず一つ終わらせると目標が現実に近づきます。","source":"『道をひらく』「志を立てよう」／PHP研究所"},{"day":171,"original":"Lament not Fortune’s mutability, And seize her fickle favours ere they flee; If others never mourned departed bliss, How should a turn of Fortune come to thee?","person":"ウマル・ハイヤーム","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 552（ウマル・ハイヤーム名義で収録）"},{"day":172,"original":"Trust not thy secret to a confidant, for he too will have his associates and friends; and it will spread abroad through the whole city, and men will call thee weak-headed.","person":"フェルドウスィー","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 505（フェルドウスィー名義で収録）"},{"day":173,"original":"Affairs succeed by patience, and he that is hasty falleth headlong.","person":"サアディ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 42（サアディ名義で収録）"},{"day":174,"original":"","person":"松下幸之助","theme":"挑戦","gist":"志あるところ、老いも若きも道は必ずひらける。","insight":"失敗を避けるだけでは新しい経験も得られません。取り返せる失敗なら、早めに試して学ぶ方が長い目では前進になります。","source":"『道をひらく』／PHP研究所"},{"day":175,"original":"No man of high and generous spirit is ever willing to indulge in flattery; the good may feel affection for others, but will not flatter them.","person":"アリストテレス","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 250（アリストテレス名義で収録）"},{"day":176,"original":"When morning silvers the dark firmament, Why shrills the bird of dawning his lament? It is to show in dawn’s bright looking-glass How of thy careless life a night is spent.","person":"ウマル・ハイヤーム","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 139（ウマル・ハイヤーム名義で収録）"},{"day":177,"original":"There is no remembrance which time doth not obliterate, nor pain which death doth not put an end to.","person":"ミゲル・デ・セルバンテス","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 325（ミゲル・デ・セルバンテス名義で収録）"},{"day":178,"original":"","person":"松下幸之助","theme":"判断","gist":"雨が降れば傘をさす。","insight":"迷った時は、事実・感情・予想を分けて考えてみましょう。思い込みを事実として扱わないだけでも判断の質は上がります。","source":"松下幸之助.com／PHP研究所"},{"day":179,"original":"The best way to make ourselves agreeable to others is by seeming to think them so. If we appear fully sensible of their good qualities they will not complain of the want of them in us.","person":"ウィリアム・ハズリット","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 258（ウィリアム・ハズリット名義で収録）"},{"day":180,"original":"Though you may yourself abound in treasure, teach your son some handicraft; for a heavy purse of gold and silver may run to waste, but the purse of the artisan’s industry can never get empty.","person":"サアディ","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 451（サアディ名義で収録）"},{"day":181,"original":"","person":"松下幸之助","theme":"幸福","gist":"自分の幸せは自分でつくれ。","insight":"幸福を将来の大きな出来事だけに預けず、今日自分で作れる小さな楽しみを一つ持つと、普通の日の価値が上がります。","source":"松下幸之助.com／PHP研究所"},{"day":182,"original":"The woman who is resolved to be respected can make herself be so even amidst an army of soldiers.","person":"ミゲル・デ・セルバンテス","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 164（ミゲル・デ・セルバンテス名義で収録）"},{"day":183,"original":"Beauty in a modest woman is like fire at a distance, or like a sharp sword: neither doth the one burn nor the other wound him that comes not too near them.","person":"ミゲル・デ・セルバンテス","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 295（ミゲル・デ・セルバンテス名義で収録）"},{"day":184,"original":"We are more sociable and get on better with people by the heart than the intellect.","person":"ラ・ブリュイエール","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 296（ラ・ブリュイエール名義で収録）"},{"day":185,"original":"","person":"松下幸之助","theme":"可能性","gist":"道は無限にある。","insight":"今見えている道が唯一とは限りません。行き詰まった時は『目的は同じまま、方法だけ変えられないか』と考えてみましょう。","source":"松下幸之助.com／PHP研究所"},{"day":186,"original":"The greater part of mankind employ their first years to make their last miserable.","person":"ラ・ブリュイエール","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 480（ラ・ブリュイエール名義で収録）"},{"day":187,"original":"Toil and pleasure, in their natures opposite, are yet linked together in a kind of necessary connection.","person":"リウィウス","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 349（リウィウス名義で収録）"},{"day":188,"original":"","person":"松下幸之助","theme":"心","gist":"素直な心になりましょう。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"松下幸之助が重視した「素直な心」／PHP研究所"},{"day":189,"original":"Most men, even the most accomplished, are of limited faculties; every one sets a value on certain qualities in himself and others: these alone he is willing to favour, these alone will he have cultivated.","person":"ゲーテ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 120（ゲーテ名義で収録）"},{"day":190,"original":"The rays of happiness, like those of light, are colourless when unbroken.","person":"ヘンリー・ワズワース・ロングフェロー","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 58（ヘンリー・ワズワース・ロングフェロー名義で収録）"},{"day":191,"original":"Nothing is so oppressive as a secret; it is difficult for ladies to keep it long, and I know even in this matter a good number of men who are women.","person":"ラ・フォンテーヌ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 99（ラ・フォンテーヌ名義で収録）"},{"day":192,"original":"","person":"松下幸之助","theme":"成長","gist":"日に新た。","insight":"昨日よりほんの少し良くすることを続けると、半年後には大きな差になります。結果より、今日の改善点を一つ決めるのが実践的です。","source":"松下幸之助「日に新た」／PHP研究所"},{"day":193,"original":"The man who is in the highest state of prosperity, and who thinks his fortune is most secure, knows not if it will remain unchanged till the evening.","person":"デモステネス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 224（デモステネス名義で収録）"},{"day":194,"original":"Assume in adversity a countenance of prosperity, and in prosperity moderate thy temper.","person":"リウィウス","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 175（リウィウス名義で収録）"},{"day":195,"original":"Education and morals will be found almost the whole that goes to make a good man.","person":"アリストテレス","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 348（アリストテレス名義で収録）"},{"day":196,"original":"","person":"松下幸之助","theme":"仕事・社会","gist":"繁栄によって平和と幸福を。","insight":"仕事は自分の利益だけでなく、誰かの役に立つことで長く続きます。自分の仕事が誰の何を良くしているか考えてみましょう。","source":"PHP研究所創設理念"},{"day":197,"original":"Great and unexpected successes are often the cause of foolish rushing into acts of extravagance.","person":"デモステネス","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 53（デモステネス名義で収録）"},{"day":198,"original":"Every man stamps his value on himself. The price we challenge for ourselves is given us. Man is made great or little by his own will.","person":"フリードリヒ・シラー","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 328（フリードリヒ・シラー名義で収録）"},{"day":199,"original":"","person":"松下幸之助","theme":"困難","gist":"心配またよし。","insight":"困難そのものは歓迎できなくても、そこで身につく知恵は次に使えます。『この経験から何を持ち帰るか』を一つ決めてみましょう。","source":"『道をひらく』／PHP研究所"},{"day":200,"original":"Children form a bond of union than which the human heart finds none more enduring.","person":"リウィウス","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 379（リウィウス名義で収録）"},{"day":201,"original":"Let him take heart who does advance, even in the smallest degree.","person":"プラトン","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 487（プラトン名義で収録）"},{"day":202,"original":"Man differs from other animals particularly in this, that he is imitative, and acquires his rudiments of knowledge in this way; besides, the delight in imitation is universal.","person":"アリストテレス","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 404（アリストテレス名義で収録）"},{"day":203,"original":"","person":"本田宗一郎","theme":"困難","gist":"困った時、苦しい時の知恵が尊い。","insight":"困難そのものは歓迎できなくても、そこで身につく知恵は次に使えます。『この経験から何を持ち帰るか』を一つ決めてみましょう。","source":"Honda公式「挑戦する心」"},{"day":204,"original":"Wickedness, by whomsoever committed, is odious, but most of all in men of learning; for learning is the weapon with which Satan is combated, and when a man is made captive with arms in his hand his shame is more excessive.","person":"サアディ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 469（サアディ名義で収録）"},{"day":205,"original":"Men are so simple, and yield so much to necessity, that he who will deceive may always find him that will lend himself to be deceived.","person":"ニッコロ・マキャヴェッリ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 243（ニッコロ・マキャヴェッリ名義で収録）"},{"day":206,"original":"The sage who engages in controversy with ignorant people must not expect to be treated with honour; and if a fool should overpower a philosopher by his loquacity it is not to be wondered at, for a common stone will break a jewel.","person":"サアディ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 584（サアディ名義で収録）"},{"day":207,"original":"","person":"本田宗一郎","theme":"成長","gist":"少しずつでもよい、日々前進して欲しい。","insight":"昨日よりほんの少し良くすることを続けると、半年後には大きな差になります。結果より、今日の改善点を一つ決めるのが実践的です。","source":"Honda公式「挑戦する心」"},{"day":208,"original":"Men’s minds are generally ingenious in palliating guilt in themselves.","person":"リウィウス","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 467（リウィウス名義で収録）"},{"day":209,"original":"It is the natural disposition of all men to listen with pleasure to abuse and slander of their neighbour, and to hear with impatience those who utter praises of themselves.","person":"デモステネス","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 412（デモステネス名義で収録）"},{"day":210,"original":"","person":"本田宗一郎","theme":"成長","gist":"停滞は相対的には退歩である。","insight":"昨日よりほんの少し良くすることを続けると、半年後には大きな差になります。結果より、今日の改善点を一つ決めるのが実践的です。","source":"Honda公式「挑戦する心」"},{"day":211,"original":"The beauty of some women has days and seasons, depending upon accidents which diminish or increase it; nay, the very passions of the mind naturally improve or impair it, and very often utterly destroy it.","person":"ミゲル・デ・セルバンテス","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 565（ミゲル・デ・セルバンテス名義で収録）"},{"day":212,"original":"There is no greater grief in misery than to turn our thoughts back to happier times.[1]","person":"ダンテ・アリギエーリ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 6（ダンテ・アリギエーリ名義で収録）"},{"day":213,"original":"Perfect ignorance is quiet, perfect knowledge is quiet; not so the transition from the former to the latter.","person":"トーマス・カーライル","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 355（トーマス・カーライル名義で収録）"},{"day":214,"original":"","person":"本田宗一郎","theme":"失敗","gist":"失敗もいい。","insight":"失敗は結果であって人格の評価ではありません。原因を一つ特定し、次回のやり方を一つ変えれば、失敗はデータになります。","source":"Honda公式「挑戦する心」"},{"day":215,"original":"It is impossible for those who are engaged in low and grovelling pursuits to entertain noble and generous sentiments. Their thoughts must always necessarily be somewhat similar to their employments.","person":"デモステネス","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 203（デモステネス名義で収録）"},{"day":216,"original":"It is not flesh and blood, it is the heart, that makes fathers and sons.","person":"フリードリヒ・シラー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 519（フリードリヒ・シラー名義で収録）"},{"day":217,"original":"The first forty years of our life give the text, the next thirty furnish the commentary upon it, which enables us rightly to understand the true meaning and connection of the text with its moral and its beauties.","person":"アルトゥル・ショーペンハウアー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 144（アルトゥル・ショーペンハウアー名義で収録）"},{"day":218,"original":"","person":"本田宗一郎","theme":"成長","gist":"人間は刺激されないと発展しない。","insight":"昨日よりほんの少し良くすることを続けると、半年後には大きな差になります。結果より、今日の改善点を一つ決めるのが実践的です。","source":"Honda公式「挑戦する心」"},{"day":219,"original":"An indiscreet man is more hurtful than an ill-natured one; for as the latter will only attack his enemies, and those he wishes ill to, the other injures indifferently both his friends and foes.","person":"ジョゼフ・アディソン","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 85（ジョゼフ・アディソン名義で収録）"},{"day":220,"original":"To exert his power in doing good is man’s most glorious task.","person":"ソポクレス","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 110（ソポクレス名義で収録）"},{"day":221,"original":"","person":"本田宗一郎","theme":"失敗","gist":"成功は99％の失敗に支えられた1％。","insight":"失敗は結果であって人格の評価ではありません。原因を一つ特定し、次回のやり方を一つ変えれば、失敗はデータになります。","source":"Honda Report 2025で創業者の言葉として紹介"},{"day":222,"original":"To those who err in judgment, not in will, anger is gentle.","person":"ソポクレス","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 64（ソポクレス名義で収録）"},{"day":223,"original":"Whosoever lends a greedy ear to a slanderous report is either himself of a radically bad disposition or a mere child in sense.","person":"メナンドロス","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 560（メナンドロス名義で収録）"},{"day":224,"original":"The friendship of the bad is like the shade of some precipitous bank with crumbling sides, which, falling, buries him who is beneath.","person":"バーラヴィ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 24（バーラヴィ名義で収録）"},{"day":225,"original":"","person":"本田宗一郎","theme":"挑戦","gist":"チャレンジして失敗を恐れるよりも、何もしないことを恐れろ。","insight":"失敗を避けるだけでは新しい経験も得られません。取り返せる失敗なら、早めに試して学ぶ方が長い目では前進になります。","source":"Honda Report 2025で創業者の言葉として紹介"},{"day":226,"original":"The natural hostility of beasts is laid aside when flying from pursuers; so also when danger is impending the enmity of rivals is ended.","person":"バーラヴィ","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 274（バーラヴィ名義で収録）"},{"day":227,"original":"He that holds fast the golden mean, And lives contentedly between The little and the great, Feels not the wants that pinch the poor, Nor plagues that haunt the rich man’s door, Embittering all his state.","person":"ホラティウス","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 21（ホラティウス名義で収録）"},{"day":228,"original":"There are three things to beware of through life: when a man is young, let him beware of his appetites; when he is middle-aged, of his passions; and when old, of covetousness, especially.","person":"コウシ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 155（コウシ名義で収録）"},{"day":229,"original":"","person":"本田宗一郎","theme":"未来","gist":"過去と現在をよく知って、未来はどうであろうという想像をする。","insight":"過去を知るのは後悔するためではなく、未来の判断材料にするためです。過去・現在・次の一手をつなげて考えてみましょう。","source":"Honda公式「挑戦する心」"},{"day":230,"original":"Men are of three different capacities: one understands intuitively; another understands so far as it is explained; and a third understands neither of himself nor by explanation. The first is excellent, the second, commendable, and the third, altogether useless.","person":"ニッコロ・マキャヴェッリ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 32（ニッコロ・マキャヴェッリ名義で収録）"},{"day":231,"original":"A good man may fall, but he falls like a ball [and rebounds]; the ignoble man falls like a lump of clay.","person":"バルトリハリ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的
