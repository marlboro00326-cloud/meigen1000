veral hours after the winds are laid.","person":"Addison","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 402"},{"day":193,"source_no":516,"original":"It is curious to note the old sea-margins of human thought. Each subsiding century reveals some new mystery; we build where monsters used to hide themselves.","person":"Longfellow","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 516"},{"day":194,"source_no":79,"original":"The best preacher is the heart; the best teacher is time; the best book is the world; the best friend is God.","person":"Talmud","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 79"},{"day":195,"source_no":113,"original":"Time is the most important thing in human life, for what is pleasure after the departure of time? and the most consolatory, since pain, when pain has passed, is nothing. Time is the wheel-track in which we roll on towards eternity, conducting us to the Incomprehensible. In its progress there is a ripening power, and it ripens us the more, and the more powerfully, when we duly estimate it. Listen to its voice, do not waste it, but regard it as the highest finite good, in which all finite things are resolved.","person":"Von Humboldt","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 113"},{"day":196,"source_no":325,"original":"There is no remembrance which time doth not obliterate, nor pain which death doth not put an end to.","person":"Cervantes","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 325"},{"day":197,"source_no":360,"original":"Our time is like our money; when we change a guinea the shillings escape as things of small account; when we break a day by idleness in the morning, the rest of the hours lose their importance in our eyes.","person":"Sir Walter Scott","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 360"},{"day":198,"source_no":349,"original":"Toil and pleasure, in their natures opposite, are yet linked together in a kind of necessary connection.","person":"Livy","theme":"満足・幸福","gist":"足りないものだけでなく、すでにあるものを見る。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 349"},{"day":199,"source_no":51,"original":"The gem cannot be polished without friction, nor man perfected without trials.","person":"Chinese","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 51"},{"day":200,"source_no":202,"original":"While the slightest inconveniences of the great are magnified into calamities, while tragedy mouths out their sufferings in all the strains of eloquence, the miseries of the poor are entirely disregarded; and yet some of the lower ranks of people undergo more real hardships in one day than those of a more exalted station suffer in their whole lives.","person":"Goldsmith","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 202"},{"day":201,"source_no":246,"original":"Those noble men who falsehood dread In wealth and glory ever grow, As flames with greater brightness glow With oil in ceaseless flow when fed. But like to flames with water drenched, Which, faintly flickering, die away, So liars day by day decay, Till all their lustre soon is quenched.","person":"Sanskrit","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 246"},{"day":202,"source_no":532,"original":"Virtue beameth from a generous spirit as light from the moon, or as brilliancy from Jupiter.","person":"Nizāmī","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 532"},{"day":203,"source_no":589,"original":"Single is every living creature born, Single he passes to another world, Single he eats the fruit of evil deeds, Single, the fruit of good; and when he leaves His body, like a log or heap of clay, Upon the ground, his kinsmen walk away: Virtue alone stays by him at the tomb, And bears him through the dreary, trackless gloom.","person":"Manu","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 589"},{"day":204,"source_no":236,"original":"Weak men gain their object when allied with strong associates: the brook reaches the ocean by the river’s aid.","person":"Māgha","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 236"},{"day":205,"source_no":77,"original":"He who seeks wealth sacrifices his own pleasure, and, like him who carries burdens for others, bears the load of anxiety.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 77"},{"day":206,"source_no":148,"original":"Riches disclose in a man’s character the bad qualities formerly concealed in his poverty.","person":"Arabic","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 148"},{"day":207,"source_no":210,"original":"He who has wealth has friends; he who has wealth has relations; he who has wealth is a hero among the people; he who has wealth is even a sage.","person":"Hitopadesa","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 210"},{"day":208,"source_no":267,"original":"What avails your wealth, if it makes you arrogant to the poor?","person":"Arabic","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 267"},{"day":209,"source_no":400,"original":"As one might nurse a tiny flame, The able and far-seeing man, E’en with the smallest capital, Can raise himself to wealth.","person":"Buddhist","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 400"},{"day":210,"source_no":440,"original":"When the man of a naturally good propensity has much wealth it injures his advancement in wisdom; when a worthless man has much wealth it increases his faults.","person":"Chinese","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 440"},{"day":211,"source_no":171,"original":"If you wish to know how much preferable wisdom is to gold, then observe: if you change gold you get silver for it, but your gold is gone; but if you exchange one sort of wisdom for another, you obtain fresh knowledge, and at the same time keep what you possessed before.","person":"Talmud","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 171"},{"day":212,"source_no":482,"original":"Wisdom alone is the true and unalloyed coin for which we ought to exchange all things, for this and with this everything is bought and sold—fortitude, temperance, and justice; in a word, true virtue subsists with wisdom.","person":"Plato","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 482"},{"day":213,"source_no":584,"original":"The sage who engages in controversy with ignorant people must not expect to be treated with honour; and if a fool should overpower a philosopher by his loquacity it is not to be wondered at, for a common stone will break a jewel.","person":"Sa’dī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 584"},{"day":214,"source_no":228,"original":"If your foot slip, you may recover your balance, but if your tongue slip, you cannot recall your words.","person":"Telugu","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 228"},{"day":215,"source_no":558,"original":"No man is the wiser for his learning. It may administer matter to work in, or objects to work upon, but wit and wisdom are born with a man.","person":"Selden","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 558"},{"day":216,"source_no":454,"original":"Knowledge produces mildness of speech; mildness of speech, a good character; a good character, wealth; wealth, if virtuous actions attend it, happiness.","person":"Hitopadesa","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 454"},{"day":217,"source_no":310,"original":"A hundred long leagues is no distance for him who would quench the thirst of covetousness; but a contented mind has no solicitude for grasping wealth.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 310"},{"day":218,"source_no":288,"original":"The good man shuns evil and follows good; he keeps secret that which ought to be hidden; he makes his virtues manifest to all; he does not forsake one in adversity; he gives in season: such are the marks of a worthy friend.","person":"Bhartrihari","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 288"},{"day":219,"source_no":407,"original":"If a man says that it is right to give every one his due, and therefore thinks within his own mind that injury is due from a just man to his enemies but kindness to his friends, he was not wise who said so, for he spoke not the truth, for in no case has it appeared to be just to injure any one.[21]","person":"Plato","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 407"},{"day":220,"source_no":570,"original":"Such deeds as thou with fear and grief Wouldst, on a sick-bed laid, recall, In youth and health eschew them all, Remembering life is frail and brief.","person":"Mahābhārata","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 570"},{"day":221,"source_no":514,"original":"The mere reality of life would be inconceivably poor without the charm of fancy, which brings in its bosom as many vain fears as idle hopes, but lends much oftener to the illusions it calls up a gay flattering hue than one which inspires terror.","person":"Von Humboldt","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 514"},{"day":222,"source_no":508,"original":"With knowledge, say, what other wealth Can vie, which neither thieves by stealth Can take, nor kinsmen make their prey, Which, lavished, never wastes away.","person":"Sanskrit","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 508"},{"day":223,"source_no":499,"original":"Outward perfection without inward goodness sets but the blacker dye on the mind’s deformity.","person":"R. Chamberlain","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 499"},{"day":224,"source_no":484,"original":"’Tis those who reverence the old That are the men versed in the Faith; Worthy of praise while in this life, And happy in the life to come.","person":"Buddhist","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 484"},{"day":225,"source_no":460,"original":"By the fall of water-drops the pot is filled: such is the increase of riches, of knowledge, and of virtue.","person":"Hitopadesa","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 460"},{"day":226,"source_no":459,"original":"Heed not the flatterer’s fulsome talk, He from thee hopes some trifle to obtain; Thou wilt, shouldst thou his wishes baulk, Ten hundred times as much of censure gain.","person":"Sa’dī","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 459"},{"day":227,"source_no":457,"original":"Good words, good deeds, and beautiful expressions A wise man ever culls from every quarter, E’en as a gleaner gathers ears of corn.","person":"Mahābhārata","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 457"},{"day":228,"source_no":424,"original":"Idleness is a great enemy to mankind. There is no friend like energy, for, if you cultivate that, it will never fail.","person":"Bhartrihari","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 424"},{"day":229,"source_no":411,"original":"The wicked have no stability, for they do not remain in consistency with themselves; they continue friends only for a short time, rejoicing in each other’s wickedness.","person":"Aristotle","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 411"},{"day":230,"source_no":353,"original":"There is no pleasure of life sprouting like a tree from one root but there is some pain joined to it; and again nature brings good out of evil.","person":"Menander","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 353"},{"day":231,"source_no":340,"original":"He that rectifies a crooked stick bends it the contrary way, so must he that would reform a vice learn to affect its mere contrary, and in time he shall see the springing blossoms of a happy restoration.","person":"R. Chamberlain","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 340"},{"day":232,"source_no":332,"original":"Truth from the mouth of an honest man and severity from a good-natured man have a double effect.","person":"Hazlitt","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 332"},{"day":233,"source_no":293,"original":"Happy the man who early learns the difference between his wishes and his powers.","person":"Goethe","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 293"},{"day":234,"source_no":222,"original":"The thing we want eludes our grasp, Some other thing is given; sometimes Our wish is gained, and gifts unsought Are ours; these all are God’s own work.","person":"Hindu Poetess","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 222"},{"day":235,"source_no":204,"original":"The interval is immense between corporeal qualifications and sciences: the body in a moment is extinct, but knowledge endureth to the end of time.","person":"Hitopadesa","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 204"},{"day":236,"source_no":169,"original":"Every man thinks with himself, I am well, I am wise, and laughs at others; and ’tis a general fault amongst them all, that which our forefathers approved—diet, apparel, humours, customs, manners—we deride and reject in our time as absurd.","person":"Burton","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 169"},{"day":237,"source_no":131,"original":"A wise man takes a step at a time; he establishes one foot before he takes up the other: an old place should not be forsaken recklessly.","person":"Sanskrit","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 131"},{"day":238,"source_no":91,"original":"A stranger who is kind is a kinsman; an unkind kinsman is a stranger.","person":"Hitopadesa","theme":"怒り・感情","gist":"怒りや不安は自然だが、行動の主導権は渡さない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 91"},{"day":239,"source_no":74,"original":"The round of a passionate man’s life is in contracting debts in his passion which his virtue obliges him to pay. He spends his time in outrage and acknowledgment, injury and reparation.","person":"Johnson","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 74"},{"day":240,"source_no":45,"original":"Both white and black acknowledge women’s sway, So much the better and the wiser too, Deeming it most convenient to obey, Or possibly they might their folly rue.[6]","person":"Persian","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 45"},{"day":241,"source_no":44,"original":"Unsullied poverty is always happy, while impure wealth brings with it many sorrows.","person":"Chinese","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 44"},{"day":242,"source_no":35,"original":"Alas, for him who is gone and hath done no good work! The trumpet of march has sounded, and his load was not bound on.","person":"Persian","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 35"},{"day":243,"source_no":34,"original":"Worldly fame and pleasure are destructive to the virtue of the mind; anxious thoughts and apprehensions are injurious to the health of the body.","person":"Chinese","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"頑張ることと休むことは対立しません。回復する時間まで含めて予定に入れる方が、長く安定して動けます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 34"},{"day":244,"source_no":27,"original":"Let a man’s talents or virtues be what they may, we feel satisfaction in his society only as he is satisfied in himself. We cannot enjoy the good qualities of a friend if he seems to be none the better for them.","person":"Hazlitt","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 27"},{"day":245,"source_no":25,"original":"His action no applause invites Who simply good with good repays; He only justly merits praise Who wrongful deeds with kind requites.[3]","person":"Panchatantra","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 25"},{"day":246,"source_no":2,"original":"If passion gaineth the mastery over reason, the wise will not count thee amongst men.","person":"Firdausī","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 2"},{"day":247,"source_no":587,"original":"Treat no one with disdain; with patience bear Reviling language; with an angry man Be never angry; blessings give for curses.[31]","person":"Manu","theme":"忍耐・継続","gist":"小さな継続が、後から大きな差になる。","insight":"継続のコツは、意志を強くすることより、続けやすい大きさにすることです。毎日10分でも、半年続けば大きな量になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 587"},{"day":248,"source_no":586,"original":"A feverish display of over-zeal, At the first outset, is an obstacle To all success; water, however cold, Will penetrate the ground by slow degrees.","person":"Hitopadesa","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 586"},{"day":249,"source_no":585,"original":"Success is like a lovely woman, wooed by many men, but folded in the arms of him alone who, free from over-zeal, firmly persists and calmly perseveres.","person":"Bhāravi","theme":"忍耐・継続","gist":"小さな継続が、後から大きな差になる。","insight":"途中で止まる日があっても、そこで全部をやめる必要はありません。翌日に戻れる仕組みを作る方が、完璧を目指すより強い習慣になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 585"},{"day":250,"source_no":577,"original":"The constant man loses not his virtue in misfortune. A torch may point towards the ground, but its flame will still point upwards.","person":"Bhartrihari","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 577"},{"day":251,"source_no":576,"original":"No one ought to despond in adverse circumstances, for they may turn out to be the cause of good to us.[30]","person":"Menander","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 576"},{"day":252,"source_no":574,"original":"In all companies there are more fools than wise men, and the greater part always gets the better of the wiser.","person":"Rabelais","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 574"},{"day":253,"source_no":566,"original":"No joy in nature is so sublimely affecting as the joy of a mother at the good fortune of a child.","person":"Richter","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 566"},{"day":254,"source_no":562,"original":"A lively blockhead in company is a public benefit. Silence or dulness by the side of folly looks like wisdom.","person":"Hazlitt","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 562"},{"day":255,"source_no":561,"original":"A foolish man in wealth and authority is like a weak-timbered house with a too-ponderous roof.","person":"R. Chamberlain","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 561"},{"day":256,"source_no":553,"original":"Harsh reproof is like a violent storm, soon washed down the channel; but friendly admonitions, like a small shower, pierce deep, and bring forth better reformation.","person":"R. Chamberlain","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 553"},{"day":257,"source_no":551,"original":"Vulgar prejudices are those which arise out of accident, ignorance, or authority; natural prejudices are those which arise out of the constitution of the human mind itself.","person":"Hazlitt","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 551"},{"day":258,"source_no":549,"original":"The greatest hatred, like the greatest virtue and the worst dogs, is quiet.","person":"Richter","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 549"},{"day":259,"source_no":546,"original":"Whosoever hath not knowledge, and benevolence, and piety knoweth nothing of reality, and dwelleth only in semblance.","person":"Sa’dī","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 546"},{"day":260,"source_no":541,"original":"The fool who knows his foolishness is wise so far, at least; but a fool who thinks himself wise, he is called a fool indeed.","person":"Dhammapada","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 541"},{"day":261,"source_no":540,"original":"The mother of the useful arts is necessity, that of the fine arts is luxury; for father the former have intellect, the latter, genius, which itself is a kind of luxury.","person":"Schopenhauer","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 540"},{"day":262,"source_no":533,"original":"The worth of a horse is known by its speed, the value of oxen by their carrying power, the worth of a cow by its milk-giving capacity, and that of a wise man by his speech.","person":"Burmese","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 533"},{"day":263,"source_no":523,"original":"Happy the man who lives at home, making it his business to regulate his desires.","person":"La Fontaine","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 523"},{"day":264,"source_no":521,"original":"We are accustomed to see men deride what they do not understand, and snarl at the good and beautiful because it lies beyond their sympathies.","person":"Goethe","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 521"},{"day":265,"source_no":520,"original":"Discontent is like ink poured into water, which fills the whole fountain full of blackness. It casts a cloud over the mind, and renders it more occupied about the evil which disquiets it than about the means of removing it.","person":"Feltham","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 520"},{"day":266,"source_no":518,"original":"Reprove not in their wrath incensèd men, Good counsel comes clean out of season then; But when his fury is appeased and past, He will conceive his fault and mend at last: When he is cool and calm, then utter it; No man gives physic in the midst o’ th’ fit.","person":"Randolph","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 518"},{"day":267,"source_no":512,"original":"Everything that is acknowledges the blessing of existence. Shalt not thou, by a similar acknowledgment, be happy? If thou pay due attention to sounds, thou shalt hear the praise of the Creator celebrated by the whole creation.","person":"Nakhshabī","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 512"},{"day":268,"source_no":505,"original":"Trust not thy secret to a confidant, for he too will have his associates and friends; and it will spread abroad through the whole city, and men will call thee weak-headed.","person":"Firdausī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 505"},{"day":269,"source_no":500,"original":"As a solid rock is not shaken by the wind, so wise men falter not amidst blame or praise.","person":"Dhammapada","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 500"},{"day":270,"source_no":494,"original":"When men will not be reasoned out of a vanity, they must be ridiculed out of it.","person":"L’Estrange","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 494"},{"day":271,"source_no":493,"original":"The man who has not anything to boast of but his illustrious ancestors is like a potato—the only good belonging to him is underground.","person":"Sir Thos. Overbury","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 493"},{"day":272,"source_no":489,"original":"If thou desirest ease in this life, keep thy secrets undisclosed, like the modest rosebud. Take warning from that lovely flower, which, by expanding its hitherto hidden beauties when in full bloom, gives its leaves and its happiness to the winds.","person":"Persian","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 489"},{"day":273,"source_no":483,"original":"If thou intendest to do a good act, do it quickly, and then thou wilt excite gratitude; a favour if it be slow in being conferred causes ingratitude.","person":"Ausonius","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"短期的にはごまかした方が得に見える場面もありますが、長期では信用の差が大きくなります。誠実さは時間をかけて効いてくる資産です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 483"},{"day":274,"source_no":480,"original":"The greater part of mankind employ their first years to make their last miserable.","person":"La Bruyère","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 480"},{"day":275,"source_no":473,"original":"Do nothing rashly; want of circumspection is the chief cause of failure and disaster. Fortune, wise lover of the wise, selects him for her lord who ere he acts reflects.","person":"Bhāravi","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 473"},{"day":276,"source_no":470,"original":"He that will give himself to all manner of ways to get money may be rich; so he that lets fly all he knows or thinks may by chance be satirically witty. Honesty sometimes keeps a man from growing rich, and civility from being witty.","person":"Selden","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 470"},{"day":277,"source_no":467,"original":"Men’s minds are generally ingenious in palliating guilt in themselves.","person":"Livy","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 467"},{"day":278,"source_no":466,"original":"A wise man should never resolve upon anything, at least, never let the world know his resolution, for if he cannot reach that he is ashamed.[26]","person":"Selden","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 466"},{"day":279,"source_no":464,"original":"It is only necessary to grow old in order to become more indulgent. I see no fault committed that I have not been myself inclined to.","person":"Goethe","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 464"},{"day":280,"source_no":442,"original":"To consider, Is this man of our own or an alien? is a mark of little-minded persons; but the whole earth is of kin to the generous-hearted.[24]","person":"Panchatantra","theme":"判断・慎重さ","gist":"迷った時は、感情と事実を分けて考える。","insight":"迷った時は、感情・事実・予想を分けて書いてみると整理しやすくなります。思い込みを事実のように扱わないことが良い判断につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 442"},{"day":281,"source_no":441,"original":"In youth a man is deluded by other ideas than those which delude him in middle life, and again in his decay he embraces other ideas.","person":"Mahābhārata","theme":"健康・生活","gist":"生活を良くする時は、まず無理のない習慣から。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 441"},{"day":282,"source_no":437,"original":"Experience has always shown, and reason shows, that affairs which depend on many seldom succeed.","person":"Guicciardini","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 437"},{"day":283,"source_no":423,"original":"When the scale of sensuality bears down that of reason, the baseness of our nature conducts us to most preposterous conclusions.","person":"R. Chamberlain","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 423"},{"day":284,"source_no":419,"original":"We have more faith in a well-written romance while we are reading it than in common history. The vividness of the representations in the one case more than counterbalances the mere knowledge of the truth of facts in the other.","person":"Hazlitt","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 419"},{"day":285,"source_no":417,"original":"No fathers and mothers think their own children ugly, and this self-deceit is yet stronger with respect to the offspring of the mind.","person":"Cervantes","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 417"},{"day":286,"source_no":416,"original":"The man with hoary head is not revered as aged by the gods, but only he who has true knowledge; he, though young, is old.","person":"Manu","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 416"},{"day":287,"source_no":413,"original":"A man ought not to return evil for evil, as many think, since at no time ought we to do an injury to our neighbour.[22]","person":"Plato","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 413"},{"day":288,"source_no":412,"original":"It is the natural disposition of all men to listen with pleasure to abuse and slander of their neighbour, and to hear with impatience those who utter praises of themselves.","person":"Demosthenes","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 412"},{"day":289,"source_no":410,"original":"Empty is the house of a childless man; as empty is the mind of a bachelor; empty are all quarters of the world to an ignorant man; but poverty is total emptiness.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 410"},{"day":290,"source_no":404,"original":"Man differs from other animals particularly in this, that he is imitative, and acquires his rudiments of knowledge in this way; besides, the delight in imitation is universal.","person":"Aristotle","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 404"},{"day":291,"source_no":401,"original":"By a husband wealth is accumulated; by a wife is its preservation.","person":"Burmese","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 401"},{"day":292,"source_no":399,"original":"The value of three things is justly appreciated by all classes of men: youth, by the old; health, by the diseased; and wealth, by the needy.","person":"Omar Khayyām","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 399"},{"day":293,"source_no":396,"original":"He alone is poor who does not possess knowledge.","person":"Talmud","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 396"},{"day":294,"source_no":374,"original":"The man who cannot blush, and who has no feelings of fear, has reached the acme of impudence.","person":"Menander","theme":"怒り・感情","gist":"怒りや不安は自然だが、行動の主導権は渡さない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 374"},{"day":295,"source_no":371,"original":"Whoever has the seed of virtue and honour implanted in his breast will drop a sympathising tear on the woes of his neighbour.","person":"Nakhshabī","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 371"},{"day":296,"source_no":369,"original":"We should know mankind better if we were not so anxious to resemble one another.","person":"Goethe","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 369"},{"day":297,"source_no":364,"original":"In all the world there is no vice Less prone t’excess than avarice; It neither cares for food nor clothing: Nature’s content with little, that with nothing.","person":"Butler","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 364"},{"day":298,"source_no":362,"original":"Wit and wisdom differ. Wit is upon the sudden turn, wisdom is in bringing about ends.","person":"Selden","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 362"},{"day":299,"source_no":357,"original":"Fair words without good deeds to a man in misery are like a saddle of gold clapped upon a galled horse.","person":"Chamberlain","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 357"},{"day":300,"source_no":352,"original":"In the sandal-tree are serpents, in the water lotus flowers, but crocodiles also; even virtues are marred by the vicious—in all enjoyments there is something which impairs our happiness.","person":"Hitopadesa","theme":"満足・幸福","gist":"足りないものだけでなく、すでにあるものを見る。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 352"},{"day":301,"source_no":345,"original":"Time, which gnaws and diminishes all things else, augments and increases benefits, because a noble action of liberality done to a man of reason doth grow continually by his generously thinking of it and remembering it.","person":"Rabelais","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 345"},{"day":302,"source_no":321,"original":"A bad man is as much pleased as a good man is distressed to speak ill of others.","person":"Mahābhārata","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 321"},{"day":303,"source_no":318,"original":"Pride not thyself on thy religious works, Give to the poor, but talk not of thy gifts: By pride religious merit melts away, The merit of thy alms, by ostentation.","person":"Manu","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 318"},{"day":304,"source_no":312,"original":"A benefit given to the good is like characters engraven on a stone; a benefit given to the evil is like a line drawn on water.","person":"Buddhist","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 312"},{"day":305,"source_no":304,"original":"Do not consider any vice as trivial, and therefore practise it; do not consider any virtue as unimportant, and therefore neglect it.","person":"Chinese","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 304"},{"day":306,"source_no":301,"original":"There are many who talk on from ignorance rather than from knowledge, and who find the former an inexhaustible fund of conversation.","person":"Hazlitt","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 301"},{"day":307,"source_no":297,"original":"A good man may fall, but he falls like a ball [and rebounds]; the ignoble man falls like a lump of clay.","person":"Bhartrihari","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 297"},{"day":308,"source_no":289,"original":"No one hath come into the world for a continuance save him who leaveth behind him a good name.[11]","person":"Sa’dī","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 289"},{"day":309,"source_no":278,"original":"A subtle-witted man is like an arrow, which, rending little surface, enters deeply, but they whose minds are dull resemble stones dashing with clumsy force, but never piercing.","person":"Māgha","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 278"},{"day":310,"source_no":277,"original":"The fame of good men’s actions seldom goes beyond their own doors, but their evil deeds are carried a thousand miles’ distance.","person":"Chinese","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 277"},{"day":311,"source_no":274,"original":"The natural hostility of beasts is laid aside when flying from pursuers; so also when danger is impending the enmity of rivals is ended.","person":"Bhāravi","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"感情を抑え込むのではなく、『今、自分は怒っている』と認識するだけでも一歩引いて見られます。感情と行動を分ける練習です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 274"},{"day":312,"source_no":257,"original":"By rousing himself, by earnestness, by restraint and control the wise man may make for himself an island which no flood can overwhelm.","person":"Dhammapada","theme":"忍耐・継続","gist":"結果がすぐ出なくても、正しい方向なら積み重ねる。","insight":"途中で止まる日があっても、そこで全部をやめる必要はありません。翌日に戻れる仕組みを作る方が、完璧を目指すより強い習慣になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 257"},{"day":313,"source_no":250,"original":"No man of high and generous spirit is ever willing to indulge in flattery; the good may feel affection for others, but will not flatter them.","person":"Aristotle","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 250"},{"day":314,"source_no":237,"original":"A swan is out of place among crows, a lion among bulls, a horse among asses, and a wise man among fools.","person":"Burmese","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 237"},{"day":315,"source_no":232,"original":"The wife of bad conduct—constantly pleased with quarrelling—she is known by wise men to be cruel Old Age in the form of a wife.","person":"Panchatantra","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 232"},{"day":316,"source_no":231,"original":"A man cannot possess anything that is better than a good wife, or anything that is worse than a bad one.","person":"Simonides","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 231"},{"day":317,"source_no":230,"original":"Women are ever masters when they like, And cozen with their kindness; they have spells Superior to the wand of the magicians; And from their lips the words of wisdom fall, Like softest music on the listening ear.","person":"Firdausī","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 230"},{"day":318,"source_no":227,"original":"He who is full of faith and modesty, who shrinks from sin, and is full of learning, who is diligent, unremiss, and full of understanding—he, being replete with these seven things, is esteemed a wise man.","person":"Burmese","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 227"},{"day":319,"source_no":223,"original":"If a man conquer in battle a thousand times a thousand men, and if another conquer himself, he is the greater of conquerors.[10]","person":"Dhammapada","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 223"},{"day":320,"source_no":213,"original":"Most men the good they have despise, And blessings which they have not prize: In winter, wish for summer’s glow, In summer, long for winter’s snow.","person":"Sanskrit","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 213"},{"day":321,"source_no":206,"original":"Be modest and simple in your deportment, and treat with indifference whatever lies between virtue and vice. Love the human race; obey God.","person":"Marcus Aurelius","theme":"怒り・感情","gist":"怒りや不安は自然だが、行動の主導権は渡さない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 206"},{"day":322,"source_no":199,"original":"The angel grows up in divine knowledge, the brute, in savage ignorance, and the son of man stands hesitating between the two.","person":"Persian","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 199"},{"day":323,"source_no":195,"original":"Certain books seem to be written, not that we might learn from them, but in order that we might see how much the author knows.","person":"Goethe","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 195"},{"day":324,"source_no":181,"original":"To the tongue which bringeth thee words without reason, the answer that best beseemeth thee is—silence.","person":"Nizāmī","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 181"},{"day":325,"source_no":179,"original":"Hearts are like tapers, which at beauteous eyes Kindle a flame of love that never dies; And beauty is a flame, where hearts, like moths, Offer themselves a burning sacrifice.","person":"Omar Khayyām","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 179"},{"day":326,"source_no":177,"original":"Be cautious in your intercourse with the great; they seldom confer obligations on their inferiors but from interested motives. Friendly they appear as long as it serves their turn, but they will render no assistance in time of actual need.","person":"Talmud","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 177"},{"day":327,"source_no":170,"original":"Repeated sin destroys the understanding And he whose reason is impaired repeats His sins. The constant practising of virtue Strengthens the mental faculties, and he Whose judgment stronger grows acts always right.","person":"Mahābhārata","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 170"},{"day":328,"source_no":167,"original":"Use law and physic only for necessity. They that use them otherwise abuse themselves into weak bodies and light purses. They are good remedies, bad businesses, and worse recreations.","person":"Quarles","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 167"},{"day":329,"source_no":166,"original":"It is an old observation that wise men grow usually wiser as they grow older, and fools more foolish.","person":"Wieland","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 166"},{"day":330,"source_no":161,"original":"A foolish husband fears his wife; a prudent wife obeys her husband.","person":"Chinese","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 161"},{"day":331,"source_no":156,"original":"He who has given satisfaction to the best of his time has lived for ages.","person":"Schiller","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 156"},{"day":332,"source_no":141,"original":"In the body restraint is good; good is restraint in speech; in thought restraint is good: good is restraint in all things.","person":"Dhammapada","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 141"},{"day":333,"source_no":139,"original":"When morning silvers the dark firmament, Why shrills the bird of dawning his lament? It is to show in dawn’s bright looking-glass How of thy careless life a night is spent.","person":"Omar Khayyām","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 139"},{"day":334,"source_no":138,"original":"In this world, however little happiness may have been our portion, yet have we no desire to die. Whether he can speak of life as cheerful and delicate, or as full of pain, anxiety, and sorrow, never yet have I seen one who wished to die.","person":"Firdausī","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 138"},{"day":335,"source_no":108,"original":"By six qualities may a fool be known: anger, without cause; speech, without profit; change, without motive; inquiry, without an object; trust in a stranger; and incapacity to discriminate between friend and foe.","person":"Arabic","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 108"},{"day":336,"source_no":102,"original":"It is difficult to personate and act a part long, for where truth is not at the bottom Nature will always be endeavouring to return, and will peep out and betray herself one time or other.","person":"Tillotson","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 102"},{"day":337,"source_no":100,"original":"All kinds of beauty do not inspire love: there is a kind of it which pleases only the sight, but does not captivate the affections.","person":"Cervantes","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 100"},{"day":338,"source_no":99,"original":"Nothing is so oppressive as a secret; it is difficult for ladies to keep it long, and I know even in this matter a good number of men who are women.","person":"La Fontaine","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 99"},{"day":339,"source_no":97,"original":"It is our follies that make our lives uncomfortable. Our errors of opinion, our cowardly fear of the world’s worthless censure, and our eagerness after unnecessary gold have hampered the way of virtue, and made it far more difficult than, in itself, it is.","person":"Feltham","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 97"},{"day":340,"source_no":89,"original":"A good man’s intellect is piercing, yet inflicts no wound; his actions are deliberate, yet bold; his heart is warm, but never burns; his speech is eloquent, yet ever true.","person":"Māgha","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 89"},{"day":341,"source_no":84,"original":"Let thy words between two foes be such that if they were to become friends thou shouldst not be ashamed.","person":"Sa’dī","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 84"},{"day":342,"source_no":72,"original":"The greatest men sometimes overshoot themselves, but then their very mistakes are so many lessons of instruction.","person":"Tom Browne","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 72"},{"day":343,"source_no":67,"original":"A wise man adapts himself to circumstances, as water shapes itself to the vessel that contains it.","person":"Chinese","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 67"},{"day":344,"source_no":64,"original":"To those who err in judgment, not in will, anger is gentle.","person":"Sophocles","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"感情を抑え込むのではなく、『今、自分は怒っている』と認識するだけでも一歩引いて見られます。感情と行動を分ける練習です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 64"},{"day":345,"source_no":63,"original":"We ought never to mock the wretched, for who can be sure of being always happy?","person":"La Fontaine","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 63"},{"day":346,"source_no":59,"original":"There are three things which, in great quantity, are bad, and, in little, very good: leaven, salt, and liberality.","person":"Talmud","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 59"},{"day":347,"source_no":53,"original":"Great and unexpected successes are often the cause of foolish rushing into acts of extravagance.","person":"Demosthenes","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 53"},{"day":348,"source_no":38,"original":"Through avarice a man loses his understanding, and by his thirst for wealth he gives pain to the inhabitants of both worlds.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 38"},{"day":349,"source_no":29,"original":"He is not dead who departs this life with high fame; dead is he, though living, whose brow is branded with infamy.","person":"Tieck","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 29"},{"day":350,"source_no":13,"original":"Those who wish well towards their friends disdain to please them with words which are not true.","person":"Bhāravi","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 13"},{"day":351,"source_no":11,"original":"Every moment that a man may be in want of employment, than such I hold him to be far better who is forced to labour for nothing.","person":"Afghan","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 11"},{"day":352,"source_no":527,"original":"It is commonly a dangerous thing for a man to have more sense than his neighbours. Socrates paid for his superiority with his life; and if Aristotle saved his skin, accused as he was of heresy by the chief priest Eurymedon, it was because he took to his heels in time.","person":"Wieland","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 527"},{"day":353,"source_no":481,"original":"I hate the miser, whose unsocial breast Locks from the world his useless stores. Wealth by the bounteous only is enjoyed, Whose treasures, in diffusive good employed, The rich return of fame and friends procure, And ’gainst a sad reverse a safe retreat secure.","person":"Pindar","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 481"},{"day":354,"source_no":575,"original":"Talents are best nurtured in solitude; character is best formed in the stormy billows of the world.","person":"Goethe","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 575"},{"day":355,"source_no":572,"original":"Sit not down to the table before thy stomach is empty, and rise before thou hast filled it.","person":"Arabic","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 572"},{"day":356,"source_no":571,"original":"A man should not keep company with one whose character, family, and abode are unknown.","person":"Panchatantra","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 571"},{"day":357,"source_no":569,"original":"Those who cause dissensions in order to injure other people are preparing pitfalls for their own ruin.","person":"Chinese","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 569"},{"day":358,"source_no":567,"original":"Want and sorrow are the gifts which folly earns for itself.","person":"Schubert","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 567"},{"day":359,"source_no":565,"original":"The beauty of some women has days and seasons, depending upon accidents which diminish or increase it; nay, the very passions of the mind naturally improve or impair it, and very often utterly destroy it.","person":"Cervantes","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 565"},{"day":360,"source_no":563,"original":"Eminent positions make eminent men greater and little men less.","person":"La Bruyère","theme":"健康・生活","gist":"生活を良くする時は、まず無理のない習慣から。","insight":"頑張ることと休むことは対立しません。回復する時間まで含めて予定に入れる方が、長く安定して動けます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 563"},{"day":361,"source_no":560,"original":"Whosoever lends a greedy ear to a slanderous report is either himself of a radically bad disposition or a mere child in sense.","person":"Menander","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 560"},{"day":362,"source_no":557,"original":"All such distinctions as tend to set the orders of the state at a distance from each other are equally subversive of liberty and concord.","person":"Livy","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 557"},{"day":363,"source_no":555,"original":"All wit and fancy, like a diamond, The more exact and curious ’tis ground, Is forced for every carat to abate As much of value as it wants in weight.","person":"Butler","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 555"},{"day":364,"source_no":554,"original":"There are braying men in the world as well as braying asses; for what’s loud and senseless talking, huffing, and swearing any other than a more fashionable way of braying?","person":"L’Estrange","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 554"},{"day":365,"source_no":548,"original":"Modesty is attended with profit, arrogance brings on destruction.","person":"Chinese","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 548"}];

function dayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  return Math.min(365, Math.max(1, Math.floor((now-start)/86400000)));
}

let pos = dayOfYear()-1;
let favs = new Set(JSON.parse(localStorage.getItem("verified365Favs") || "[]"));

function render() {
  const q=quotes[pos];
  document.getElementById("counter").textContent=(pos+1)+" / 365";
  document.getElementById("theme").textContent=q.theme;
  document.getElementById("original").textContent="“"+q.original+"”";
  document.getElementById("person").textContent="— "+q.person;
  document.getElementById("source").textContent="出典確認："+q.source;
  document.getElementById("gist").textContent="日本語の要点： "+q.gist;
  document.getElementById("insight").textContent=q.insight;
  document.getElementById("favorite").textContent=(favs.has(q.day)?"♥":"♡")+" お気に入り";
}

document.getElementById("today").onclick=()=>{pos=dayOfYear()-1;render()};
document.getElementById("next").onclick=()=>{pos=(pos+1)%365;render()};
document.getElementById("random").onclick=()=>{pos=Math.floor(Math.random()*365);render()};

document.getElementById("favorite").onclick=()=>{
  const id=quotes[pos].day;
  favs.has(id)?favs.delete(id):favs.add(id);
  localStorage.setItem("verified365Favs",JSON.stringify([...favs]));
  render();
};

document.getElementById("showFavs").onclick=()=>{
  const box=document.getElementById("favItems");
  box.innerHTML="";
  const arr=quotes.filter(q=>favs.has(q.day));
  if(!arr.length) box.textContent="まだお気に入りはありません。";
  arr.forEach(q=>{
    const d=document.createElement("div");
    d.className="fav-item";
    const t=document.createElement("div");
    t.textContent="“"+q.original+"”";
    const s=document.createElement("small");
    s.textContent="— "+q.person+" / "+q.gist;
    d.appendChild(t); d.appendChild(s); box.appendChild(d);
  });
  document.getElementById("favList").classList.add("open");
};
document.getElementById("closeFavs").onclick=()=>document.getElementById("favList").classList.remove("open");

document.getElementById("share").onclick=async()=>{
  const q=quotes[pos];
  const t="“"+q.original+"”\n— "+q.person+"\n\n"+q.gist+"\n\n💡 "+q.insight+"\n\n"+q.source;
  if(navigator.share) { try { await navigator.share({title:"毎日に効く名言365",text:t}); } catch(e) {} }
  else { try { await navigator.clipboard.writeText(t); alert("コピーしました"); } catch(e) {} }
};
render();
</script>
