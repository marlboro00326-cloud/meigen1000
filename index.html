","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 380"},{"day":291,"original":"All that we are is made up of our thoughts; it is founded on our thoughts, it is made up of our thoughts. If a man speak or act with a pure thought, happiness will follow him, like a shadow that never leaves him.","person":"Dhammapada","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 114"},{"day":292,"original":"It is very hard for the mind to disengage itself from a subject on which it has been long employed. The thoughts will be rising of themselves from time to time, though we have given them no encouragement, as the tossings and fluctuations of the sea continue several hours after the winds are laid.","person":"Addison","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 402"},{"day":293,"original":"It is curious to note the old sea-margins of human thought. Each subsiding century reveals some new mystery; we build where monsters used to hide themselves.","person":"Longfellow","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 516"},{"day":294,"original":"The best preacher is the heart; the best teacher is time; the best book is the world; the best friend is God.","person":"Talmud","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 79"},{"day":295,"original":"Time is the most important thing in human life, for what is pleasure after the departure of time? and the most consolatory, since pain, when pain has passed, is nothing. Time is the wheel-track in which we roll on towards eternity, conducting us to the Incomprehensible. In its progress there is a ripening power, and it ripens us the more, and the more powerfully, when we duly estimate it. Listen to its voice, do not waste it, but regard it as the highest finite good, in which all finite things are resolved.","person":"Von Humboldt","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 113"},{"day":296,"original":"There is no remembrance which time doth not obliterate, nor pain which death doth not put an end to.","person":"Cervantes","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 325"},{"day":297,"original":"Our time is like our money; when we change a guinea the shillings escape as things of small account; when we break a day by idleness in the morning, the rest of the hours lose their importance in our eyes.","person":"Sir Walter Scott","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 360"},{"day":298,"original":"Toil and pleasure, in their natures opposite, are yet linked together in a kind of necessary connection.","person":"Livy","theme":"満足・幸福","gist":"足りないものだけでなく、すでにあるものを見る。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 349"},{"day":299,"original":"The gem cannot be polished without friction, nor man perfected without trials.","person":"Chinese","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 51"},{"day":300,"original":"While the slightest inconveniences of the great are magnified into calamities, while tragedy mouths out their sufferings in all the strains of eloquence, the miseries of the poor are entirely disregarded; and yet some of the lower ranks of people undergo more real hardships in one day than those of a more exalted station suffer in their whole lives.","person":"Goldsmith","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 202"},{"day":301,"original":"Those noble men who falsehood dread In wealth and glory ever grow, As flames with greater brightness glow With oil in ceaseless flow when fed. But like to flames with water drenched, Which, faintly flickering, die away, So liars day by day decay, Till all their lustre soon is quenched.","person":"Sanskrit","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 246"},{"day":302,"original":"Virtue beameth from a generous spirit as light from the moon, or as brilliancy from Jupiter.","person":"Nizāmī","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 532"},{"day":303,"original":"Single is every living creature born, Single he passes to another world, Single he eats the fruit of evil deeds, Single, the fruit of good; and when he leaves His body, like a log or heap of clay, Upon the ground, his kinsmen walk away: Virtue alone stays by him at the tomb, And bears him through the dreary, trackless gloom.","person":"Manu","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 589"},{"day":304,"original":"Weak men gain their object when allied with strong associates: the brook reaches the ocean by the river’s aid.","person":"Māgha","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 236"},{"day":305,"original":"He who seeks wealth sacrifices his own pleasure, and, like him who carries burdens for others, bears the load of anxiety.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 77"},{"day":306,"original":"Riches disclose in a man’s character the bad qualities formerly concealed in his poverty.","person":"Arabic","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 148"},{"day":307,"original":"He who has wealth has friends; he who has wealth has relations; he who has wealth is a hero among the people; he who has wealth is even a sage.","person":"Hitopadesa","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 210"},{"day":308,"original":"What avails your wealth, if it makes you arrogant to the poor?","person":"Arabic","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 267"},{"day":309,"original":"As one might nurse a tiny flame, The able and far-seeing man, E’en with the smallest capital, Can raise himself to wealth.","person":"Buddhist","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 400"},{"day":310,"original":"When the man of a naturally good propensity has much wealth it injures his advancement in wisdom; when a worthless man has much wealth it increases his faults.","person":"Chinese","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 440"},{"day":311,"original":"If you wish to know how much preferable wisdom is to gold, then observe: if you change gold you get silver for it, but your gold is gone; but if you exchange one sort of wisdom for another, you obtain fresh knowledge, and at the same time keep what you possessed before.","person":"Talmud","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 171"},{"day":312,"original":"Wisdom alone is the true and unalloyed coin for which we ought to exchange all things, for this and with this everything is bought and sold—fortitude, temperance, and justice; in a word, true virtue subsists with wisdom.","person":"Plato","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 482"},{"day":313,"original":"The sage who engages in controversy with ignorant people must not expect to be treated with honour; and if a fool should overpower a philosopher by his loquacity it is not to be wondered at, for a common stone will break a jewel.","person":"Sa’dī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 584"},{"day":314,"original":"If your foot slip, you may recover your balance, but if your tongue slip, you cannot recall your words.","person":"Telugu","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 228"},{"day":315,"original":"No man is the wiser for his learning. It may administer matter to work in, or objects to work upon, but wit and wisdom are born with a man.","person":"Selden","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 558"},{"day":316,"original":"Knowledge produces mildness of speech; mildness of speech, a good character; a good character, wealth; wealth, if virtuous actions attend it, happiness.","person":"Hitopadesa","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 454"},{"day":317,"original":"A hundred long leagues is no distance for him who would quench the thirst of covetousness; but a contented mind has no solicitude for grasping wealth.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 310"},{"day":318,"original":"The good man shuns evil and follows good; he keeps secret that which ought to be hidden; he makes his virtues manifest to all; he does not forsake one in adversity; he gives in season: such are the marks of a worthy friend.","person":"Bhartrihari","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 288"},{"day":319,"original":"If a man says that it is right to give every one his due, and therefore thinks within his own mind that injury is due from a just man to his enemies but kindness to his friends, he was not wise who said so, for he spoke not the truth, for in no case has it appeared to be just to injure any one.[21]","person":"Plato","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 407"},{"day":320,"original":"Such deeds as thou with fear and grief Wouldst, on a sick-bed laid, recall, In youth and health eschew them all, Remembering life is frail and brief.","person":"Mahābhārata","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 570"},{"day":321,"original":"The mere reality of life would be inconceivably poor without the charm of fancy, which brings in its bosom as many vain fears as idle hopes, but lends much oftener to the illusions it calls up a gay flattering hue than one which inspires terror.","person":"Von Humboldt","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 514"},{"day":322,"original":"With knowledge, say, what other wealth Can vie, which neither thieves by stealth Can take, nor kinsmen make their prey, Which, lavished, never wastes away.","person":"Sanskrit","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 508"},{"day":323,"original":"Outward perfection without inward goodness sets but the blacker dye on the mind’s deformity.","person":"R. Chamberlain","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 499"},{"day":324,"original":"’Tis those who reverence the old That are the men versed in the Faith; Worthy of praise while in this life, And happy in the life to come.","person":"Buddhist","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 484"},{"day":325,"original":"By the fall of water-drops the pot is filled: such is the increase of riches, of knowledge, and of virtue.","person":"Hitopadesa","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 460"},{"day":326,"original":"Heed not the flatterer’s fulsome talk, He from thee hopes some trifle to obtain; Thou wilt, shouldst thou his wishes baulk, Ten hundred times as much of censure gain.","person":"Sa’dī","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 459"},{"day":327,"original":"Good words, good deeds, and beautiful expressions A wise man ever culls from every quarter, E’en as a gleaner gathers ears of corn.","person":"Mahābhārata","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 457"},{"day":328,"original":"Idleness is a great enemy to mankind. There is no friend like energy, for, if you cultivate that, it will never fail.","person":"Bhartrihari","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 424"},{"day":329,"original":"The wicked have no stability, for they do not remain in consistency with themselves; they continue friends only for a short time, rejoicing in each other’s wickedness.","person":"Aristotle","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 411"},{"day":330,"original":"There is no pleasure of life sprouting like a tree from one root but there is some pain joined to it; and again nature brings good out of evil.","person":"Menander","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 353"},{"day":331,"original":"He that rectifies a crooked stick bends it the contrary way, so must he that would reform a vice learn to affect its mere contrary, and in time he shall see the springing blossoms of a happy restoration.","person":"R. Chamberlain","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 340"},{"day":332,"original":"Truth from the mouth of an honest man and severity from a good-natured man have a double effect.","person":"Hazlitt","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 332"},{"day":333,"original":"Happy the man who early learns the difference between his wishes and his powers.","person":"Goethe","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 293"},{"day":334,"original":"The thing we want eludes our grasp, Some other thing is given; sometimes Our wish is gained, and gifts unsought Are ours; these all are God’s own work.","person":"Hindu Poetess","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 222"},{"day":335,"original":"The interval is immense between corporeal qualifications and sciences: the body in a moment is extinct, but knowledge endureth to the end of time.","person":"Hitopadesa","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 204"},{"day":336,"original":"Every man thinks with himself, I am well, I am wise, and laughs at others; and ’tis a general fault amongst them all, that which our forefathers approved—diet, apparel, humours, customs, manners—we deride and reject in our time as absurd.","person":"Burton","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 169"},{"day":337,"original":"A wise man takes a step at a time; he establishes one foot before he takes up the other: an old place should not be forsaken recklessly.","person":"Sanskrit","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 131"},{"day":338,"original":"A stranger who is kind is a kinsman; an unkind kinsman is a stranger.","person":"Hitopadesa","theme":"怒り・感情","gist":"怒りや不安は自然だが、行動の主導権は渡さない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 91"},{"day":339,"original":"The round of a passionate man’s life is in contracting debts in his passion which his virtue obliges him to pay. He spends his time in outrage and acknowledgment, injury and reparation.","person":"Johnson","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 74"},{"day":340,"original":"Both white and black acknowledge women’s sway, So much the better and the wiser too, Deeming it most convenient to obey, Or possibly they might their folly rue.[6]","person":"Persian","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 45"},{"day":341,"original":"Unsullied poverty is always happy, while impure wealth brings with it many sorrows.","person":"Chinese","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 44"},{"day":342,"original":"Alas, for him who is gone and hath done no good work! The trumpet of march has sounded, and his load was not bound on.","person":"Persian","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 35"},{"day":343,"original":"Worldly fame and pleasure are destructive to the virtue of the mind; anxious thoughts and apprehensions are injurious to the health of the body.","person":"Chinese","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"頑張ることと休むことは対立しません。回復する時間まで含めて予定に入れる方が、長く安定して動けます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 34"},{"day":344,"original":"Let a man’s talents or virtues be what they may, we feel satisfaction in his society only as he is satisfied in himself. We cannot enjoy the good qualities of a friend if he seems to be none the better for them.","person":"Hazlitt","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 27"},{"day":345,"original":"His action no applause invites Who simply good with good repays; He only justly merits praise Who wrongful deeds with kind requites.[3]","person":"Panchatantra","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 25"},{"day":346,"original":"If passion gaineth the mastery over reason, the wise will not count thee amongst men.","person":"Firdausī","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 2"},{"day":347,"original":"Treat no one with disdain; with patience bear Reviling language; with an angry man Be never angry; blessings give for curses.[31]","person":"Manu","theme":"忍耐・継続","gist":"小さな継続が、後から大きな差になる。","insight":"継続のコツは、意志を強くすることより、続けやすい大きさにすることです。毎日10分でも、半年続けば大きな量になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 587"},{"day":348,"original":"A feverish display of over-zeal, At the first outset, is an obstacle To all success; water, however cold, Will penetrate the ground by slow degrees.","person":"Hitopadesa","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 586"},{"day":349,"original":"Success is like a lovely woman, wooed by many men, but folded in the arms of him alone who, free from over-zeal, firmly persists and calmly perseveres.","person":"Bhāravi","theme":"忍耐・継続","gist":"小さな継続が、後から大きな差になる。","insight":"途中で止まる日があっても、そこで全部をやめる必要はありません。翌日に戻れる仕組みを作る方が、完璧を目指すより強い習慣になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 585"},{"day":350,"original":"The constant man loses not his virtue in misfortune. A torch may point towards the ground, but its flame will still point upwards.","person":"Bhartrihari","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 577"},{"day":351,"original":"No one ought to despond in adverse circumstances, for they may turn out to be the cause of good to us.[30]","person":"Menander","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 576"},{"day":352,"original":"In all companies there are more fools than wise men, and the greater part always gets the better of the wiser.","person":"Rabelais","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 574"},{"day":353,"original":"No joy in nature is so sublimely affecting as the joy of a mother at the good fortune of a child.","person":"Richter","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 566"},{"day":354,"original":"A lively blockhead in company is a public benefit. Silence or dulness by the side of folly looks like wisdom.","person":"Hazlitt","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 562"},{"day":355,"original":"A foolish man in wealth and authority is like a weak-timbered house with a too-ponderous roof.","person":"R. Chamberlain","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 561"},{"day":356,"original":"Harsh reproof is like a violent storm, soon washed down the channel; but friendly admonitions, like a small shower, pierce deep, and bring forth better reformation.","person":"R. Chamberlain","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 553"},{"day":357,"original":"Vulgar prejudices are those which arise out of accident, ignorance, or authority; natural prejudices are those which arise out of the constitution of the human mind itself.","person":"Hazlitt","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 551"},{"day":358,"original":"The greatest hatred, like the greatest virtue and the worst dogs, is quiet.","person":"Richter","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 549"},{"day":359,"original":"Whosoever hath not knowledge, and benevolence, and piety knoweth nothing of reality, and dwelleth only in semblance.","person":"Sa’dī","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 546"},{"day":360,"original":"The fool who knows his foolishness is wise so far, at least; but a fool who thinks himself wise, he is called a fool indeed.","person":"Dhammapada","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 541"},{"day":361,"original":"The mother of the useful arts is necessity, that of the fine arts is luxury; for father the former have intellect, the latter, genius, which itself is a kind of luxury.","person":"Schopenhauer","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 540"},{"day":362,"original":"The worth of a horse is known by its speed, the value of oxen by their carrying power, the worth of a cow by its milk-giving capacity, and that of a wise man by his speech.","person":"Burmese","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 533"},{"day":363,"original":"Happy the man who lives at home, making it his business to regulate his desires.","person":"La Fontaine","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 523"},{"day":364,"original":"We are accustomed to see men deride what they do not understand, and snarl at the good and beautiful because it lies beyond their sympathies.","person":"Goethe","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 521"},{"day":365,"original":"Discontent is like ink poured into water, which fills the whole fountain full of blackness. It casts a cloud over the mind, and renders it more occupied about the evil which disquiets it than about the means of removing it.","person":"Feltham","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 520"}];
function doy(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.min(365,Math.max(1,Math.floor((n-s)/86400000)))}
let pos=doy()-1,favs=new Set(JSON.parse(localStorage.getItem("meigen365jp100Favs")||"[]"));
function render(){const q=quotes[pos],isJP=!q.original;counter.textContent=(pos+1)+" / 365";theme.textContent=q.theme||"人生";original.style.display=isJP?"none":"block";original.textContent=isJP?"":"“"+q.original+"”";jp.textContent=(q.gist||"")+"（"+q.person+"）";source.textContent="出典："+q.source;insight.textContent=q.insight;fav.textContent=(favs.has(q.day)?"♥":"♡")+" お気に入り";}
today.onclick=()=>{pos=doy()-1;render()};next.onclick=()=>{pos=(pos+1)%365;render()};random.onclick=()=>{pos=Math.floor(Math.random()*365);render()};fav.onclick=()=>{const id=quotes[pos].day;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("meigen365jp100Favs",JSON.stringify([...favs]));render()};share.onclick=async()=>{const q=quotes[pos],t=(q.original?"“"+q.original+"”\n":"")+(q.gist||"")+"（"+q.person+"）\n出典："+q.source+"\n\n💡 "+q.insight;if(navigator.share)try{await navigator.share({text:t})}catch(e){}};render();
</script></body></html>
