な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 297（バルトリハリ名義で収録）"},{"day":232,"original":"","person":"稲盛和夫","theme":"仕事","gist":"人生・仕事の結果＝考え方×熱意×能力。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"稲盛和夫オフィシャルサイト"},{"day":233,"original":"He who labours diligently need never despair. We can accomplish every thing by diligence and labour.","person":"メナンドロス","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 189（メナンドロス名義で収録）"},{"day":234,"original":"In sooth, it is a shame to choose rather to be still borrowing in all places, from everybody, than to work and win.","person":"フランソワ・ラブレー","theme":"努力・行動","gist":"考えるだけで終わらせず、実際の行動と努力を積み重ねる。","insight":"大きな目標ほど、今日できる小さな行動に分けることが重要です。5分でも一つでも、実際に始めることで次の一歩が軽くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 429（フランソワ・ラブレー名義で収録）"},{"day":235,"original":"A woman will not throw away a garland, though soiled, which her lover gave: not in the object lies a present’s worth, but in the love which it was meant to mark.","person":"バーラヴィ","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 80（バーラヴィ名義で収録）"},{"day":236,"original":"","person":"稲盛和夫","theme":"心","gist":"考え方次第で人生や仕事の結果は180度変わってくる。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"稲盛和夫オフィシャルサイト"},{"day":237,"original":"In all companies there are more fools than wise men, and the greater part always gets the better of the wiser.","person":"フランソワ・ラブレー","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 574（フランソワ・ラブレー名義で収録）"},{"day":238,"original":"The man who cannot blush, and who has no feelings of fear, has reached the acme of impudence.","person":"メナンドロス","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 374（メナンドロス名義で収録）"},{"day":239,"original":"The enemies which rise within the body, hard to be overcome—thy evil passions—should manfully be fought: he who conquers these is equal to the conquerors of worlds.","person":"バーラヴィ","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 1（バーラヴィ名義で収録）"},{"day":240,"original":"","person":"稲盛和夫","theme":"判断","gist":"人間として何が正しいのか。","insight":"迷った時は、事実・感情・予想を分けて考えてみましょう。思い込みを事実として扱わないだけでも判断の質は上がります。","source":"稲盛和夫オフィシャルサイトで示される判断基準"},{"day":241,"original":"Virtue beameth from a generous spirit as light from the moon, or as brilliancy from Jupiter.","person":"ニザーミー","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 532（ニザーミー名義で収録）"},{"day":242,"original":"He is not dead who departs this life with high fame; dead is he, though living, whose brow is branded with infamy.","person":"ルートヴィヒ・ティーク","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 29（ルートヴィヒ・ティーク名義で収録）"},{"day":243,"original":"","person":"稲盛和夫","theme":"人間関係","gist":"愛と誠と調和の心をベースとする。","insight":"自分を大切にすることと、相手を尊重することは両立します。自分の個性を守るなら、相手の違いも同じように認めたいものです。","source":"稲盛和夫オフィシャルサイト"},{"day":244,"original":"The man who every sacred science knows, Yet has not strength to keep in check the foes That rise within him, mars his Fortune’s fame, And brings her by his feebleness to shame.","person":"バーラヴィ","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 280（バーラヴィ名義で収録）"},{"day":245,"original":"There is nothing more beautiful than cheerfulness in an old face, and among country people it is always a sign of a well-regulated life.","person":"ジャン・パウル","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 391（ジャン・パウル名義で収録）"},{"day":246,"original":"Superstition is the religion of feeble minds; and they must be tolerated in an admixture of it in some trifling or enthusiastic shape or other; else you will deprive weak minds of a resource found necessary to the strongest.","person":"エドマンド・バーク","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 356（エドマンド・バーク名義で収録）"},{"day":247,"original":"","person":"稲盛和夫","theme":"人生","gist":"純粋な心で人生を歩む。","insight":"人生全体の答えを一度に出す必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わります。","source":"稲盛和夫オフィシャルサイト"},{"day":248,"original":"Trees loaded with fruit are bent down; the clouds when charged with fresh rain hang down near the earth: even so good men are not uplifted through prosperity. Such is the natural character of the liberal.","person":"バルトリハリ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 93（バルトリハリ名義で収録）"},{"day":249,"original":"A wise man should never resolve upon anything, at least, never let the world know his resolution, for if he cannot reach that he is ashamed.[26]","person":"ジョン・セルデン","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 466（ジョン・セルデン名義で収録）"},{"day":250,"original":"Plans that are wise and prudent in themselves are rendered vain when the execution of them is carried on negligently and with imprudence.","person":"フランチェスコ・グイッチャルディーニ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 327（フランチェスコ・グイッチャルディーニ名義で収録）"},{"day":251,"original":"","person":"稲盛和夫","theme":"判断","gist":"動機善なりや、私心なかりしか。","insight":"迷った時は、事実・感情・予想を分けて考えてみましょう。思い込みを事実として扱わないだけでも判断の質は上がります。","source":"稲盛和夫の経営哲学として公式サイト等で紹介"},{"day":252,"original":"The manner of giving shows the character of the giver more than the gift itself. There is a princely manner of giving and accepting.","person":"ヨハン・カスパー・ラヴァーター","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 354（ヨハン・カスパー・ラヴァーター名義で収録）"},{"day":253,"original":"If thou be rich, strive to command thy money, lest it command thee.","person":"フランシス・クォールズ","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 573（フランシス・クォールズ名義で収録）"},{"day":254,"original":"","person":"稲盛和夫","theme":"努力","gist":"誰にも負けない努力をする。","insight":"この言葉を今日の生活に置き換え、実際にできる小さな行動を一つ決めてみましょう。言葉は行動に変えた時に自分のものになります。","source":"京セラフィロソフィ／稲盛和夫"},{"day":255,"original":"Books are pleasant, but if by being over-studious we impair our health and spoil our good humour, two of the best things we have, let us give it over. I, for my part, am one of those who think no fruit derived from them can recompense so great a loss.","person":"ミシェル・ド・モンテーニュ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 252（ミシェル・ド・モンテーニュ名義で収録）"},{"day":256,"original":"If you only knew the evils which others suffer, you would willingly submit to those which you now bear.","person":"フィレモン","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 378（フィレモン名義で収録）"},{"day":257,"original":"In this thing one man is superior to another, that he is better able to bear adversity and prosperity.","person":"フィレモン","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 57（フィレモン名義で収録）"},{"day":258,"original":"","person":"稲盛和夫","theme":"心","gist":"常に明るく前向きに。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"稲盛和夫の哲学として公式資料で紹介"},{"day":259,"original":"Wit and wisdom differ. Wit is upon the sudden turn, wisdom is in bringing about ends.","person":"ジョン・セルデン","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 362（ジョン・セルデン名義で収録）"},{"day":260,"original":"Experience has always shown, and reason shows, that affairs which depend on many seldom succeed.","person":"フランチェスコ・グイッチャルディーニ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 437（フランチェスコ・グイッチャルディーニ名義で収録）"},{"day":261,"original":"","person":"井深大","theme":"仕事","gist":"自由闊達にして愉快なる理想工場の建設。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"東京通信工業株式会社設立趣意書／Sony公式"},{"day":262,"original":"The greatest hatred, like the greatest virtue and the worst dogs, is quiet.","person":"ジャン・パウル","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 549（ジャン・パウル名義で収録）"},{"day":263,"original":"Man, though he be gray-headed when he comes back, soon gets a young wife. But a woman’s time is short within which she can expect to obtain a husband. If she allows it to slip away, no one cares to marry her. She sits at home, speculating on the probability of her marriage.","person":"アリストパネス","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 178（アリストパネス名義で収録）"},{"day":264,"original":"It is an old observation that wise men grow usually wiser as they grow older, and fools more foolish.","person":"クリストフ・マルティン・ヴィーラント","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 166（クリストフ・マルティン・ヴィーラント名義で収録）"},{"day":265,"original":"","person":"井深大","theme":"創造","gist":"常識と非常識がぶつかったときに、イノベーションが産まれる。","insight":"新しいものは、常識を疑うところから生まれることがあります。『本当にこのやり方しかないか』を一度問い直してみましょう。","source":"Sony公式「ソニー語録」"},{"day":266,"original":"It is easy to lose important opportunities, and difficult to regain them; therefore when they present themselves it is the more necessary to make every effort to retain them.","person":"フランチェスコ・グイッチャルディーニ","theme":"時間","gist":"時間や機会は戻らない。今できることを大切にする。","insight":"時間はお金のように取り戻せません。何となく使っている時間を少しだけ、本当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 420（フランチェスコ・グイッチャルディーニ名義で収録）"},{"day":267,"original":"There is such a grateful tickling in the mind of man in being commended that even when we know the praises which are bestowed on us are not our due, we are not angry with the author’s insincerity.","person":"オーウェン・フェルサム","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 323（オーウェン・フェルサム名義で収録）"},{"day":268,"original":"All affectation is the vain and ridiculous attempt of poverty to appear rich.","person":"ヨハン・カスパー・ラヴァーター","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 87（ヨハン・カスパー・ラヴァーター名義で収録）"},{"day":269,"original":"","person":"井深大","theme":"目標","gist":"まず強い目標を立てる。","insight":"目標が大きすぎると動けなくなります。今日できる行動まで小さくして、まず一つ終わらせると目標が現実に近づきます。","source":"Sony公式「ソニー語録」"},{"day":270,"original":"If thou intendest to do a good act, do it quickly, and then thou wilt excite gratitude; a favour if it be slow in being conferred causes ingratitude.","person":"アウソニウス","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 483（アウソニウス名義で収録）"},{"day":271,"original":"The life of man is the incessant walk of nature, wherein every moment is a step towards death. Even our growing to perfection is a progress to decay. Every thought we have is a sand running out of the glass of life.","person":"オーウェン・フェルサム","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 133（オーウェン・フェルサム名義で収録）"},{"day":272,"original":"","person":"井深大","theme":"仕事","gist":"これからは〈心〉と〈意識〉を考えたものづくりの時代だ。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"Sony公式「ソニー語録」"},{"day":273,"original":"Contentment consisteth not in heaping more fuel, but in taking away some fire.","person":"トーマス・フラー","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 101（トーマス・フラー名義で収録）"},{"day":274,"original":"We magnify the wealthy man, though his parts be never so poor. The poor man we despise, be he never so well qualified. Gold is the coverlet of imperfections. It is the fool’s curtain, which hides all his defects from the world.","person":"オーウェン・フェルサム","theme":"お金・豊かさ","gist":"豊かさを持ち物の量だけで測らず、お金との付き合い方を考える。","insight":"収入や資産は大切ですが、欲望が増え続けると満足は遠ざかります。自分にとっての『十分』を考えておくと判断が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 427（オーウェン・フェルサム名義で収録）"},{"day":275,"original":"If our inward griefs were written on our brows, how many who are envied now would be pitied. It would seem that they had their deadliest foe in their own breast, and their whole happiness would be reduced to mere seeming.","person":"ピエトロ・メタスタージオ","theme":"感情","gist":"感情は自然なものだが、その瞬間の感情に行動を支配させない。","insight":"怒りや不安を感じること自体は悪くありません。ただ、その感情で大きな判断をしないよう、一度立ち止まる余白を持ちたいものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 300（ピエトロ・メタスタージオ名義で収録）"},{"day":276,"original":"","person":"井深大","theme":"挑戦","gist":"人のやらないことをやる。","insight":"失敗を避けるだけでは新しい経験も得られません。取り返せる失敗なら、早めに試して学ぶ方が長い目では前進になります。","source":"井深大の創業精神としてSonyの歴史資料で紹介"},{"day":277,"original":"Beside the streamlet seated, mark how life glides on: That sign, how swift each moment goes, to me’s enough. Behold this world’s delights, and view its various pains: If not to you, the joy it shows to me’s enough.","person":"ハーフェズ","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 365（ハーフェズ名義で収録）"},{"day":278,"original":"Everything that is acknowledges the blessing of existence. Shalt not thou, by a similar acknowledgment, be happy? If thou pay due attention to sounds, thou shalt hear the praise of the Creator celebrated by the whole creation.","person":"ナフシャビー","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 512（ナフシャビー名義で収録）"},{"day":279,"original":"We may be as good as we please, if we please to be good.","person":"アイザック・バロー","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 73（アイザック・バロー名義で収録）"},{"day":280,"original":"","person":"盛田昭夫","theme":"挑戦","gist":"生意気な人たちの挑戦的な姿勢が、ソニーの原動力です。","insight":"失敗を避けるだけでは新しい経験も得られません。取り返せる失敗なら、早めに試して学ぶ方が長い目では前進になります。","source":"Sony公式「ソニー語録」"},{"day":281,"original":"Reprove not in their wrath incensèd men, Good counsel comes clean out of season then; But when his fury is appeased and past, He will conceive his fault and mend at last: When he is cool and calm, then utter it; No man gives physic in the midst o’ th’ fit.","person":"トーマス・ランドルフ","theme":"誠実・人格","gist":"目先の得より、自分が納得できる誠実な行動を選ぶ。","insight":"誰も見ていない時にも、自分が後から納得できる行動を選ぶ。その積み重ねが長期的な信用と自信につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 518（トーマス・ランドルフ名義で収録）"},{"day":282,"original":"We blame equally him who is too proud to put a proper value on his own merit and him who prizes too highly his spurious worth.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 242（ゲーテ名義で収録）"},{"day":283,"original":"","person":"盛田昭夫","theme":"人生","gist":"人生は一度しかないんだ。","insight":"人生全体の答えを一度に出す必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わります。","source":"Sony公式「ソニー語録」"},{"day":284,"original":"If thou art a man, speak not much about thine own manliness, for not every champion driveth the ball to the goal.","person":"サアディ","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 248（サアディ名義で収録）"},{"day":285,"original":"The old lose one of the greatest privileges of man, for they are no longer judged by their contemporaries.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 439（ゲーテ名義で収録）"},{"day":286,"original":"The loss of a much-prized treasure is only half felt when we have not regarded its tenure as secure.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 216（ゲーテ名義で収録）"},{"day":287,"original":"","person":"盛田昭夫","theme":"心","gist":"みんなネアカでがんばろう。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"Sony公式「ソニー語録」"},{"day":288,"original":"Talents are best nurtured in solitude; character is best formed in the stormy billows of the world.","person":"ゲーテ","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 575（ゲーテ名義で収録）"},{"day":289,"original":"Be thou generous, and gentle, and forgiving; as God hath scattered upon thee, scatter thou upon others.","person":"サアディ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 140（サアディ名義で収録）"},{"day":290,"original":"It is not enough to know; we must apply what we know. It is not enough to will; we must also act.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 397（ゲーテ名義で収録）"},{"day":291,"original":"","person":"盛田昭夫","theme":"仕事","gist":"自分の能力を発揮できる仕事を選ぶべきだ。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"盛田昭夫の人材観としてSony資料で紹介"},{"day":292,"original":"Two persons die remorseful: he who possessed and enjoyed not, and he who knew but did not practise.","person":"サアディ","theme":"幸福・満足","gist":"足りないものだけでなく、今すでにあるものの価値にも気づく。","insight":"幸福を特別な出来事だけに求めると、普通の日が空白になります。食事、睡眠、会話など小さな良さを意識することも大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 220（サアディ名義で収録）"},{"day":293,"original":"Purpose without power is mere weakness and deception; and power without purpose is mere fatuity.","person":"サアディ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 146（サアディ名義で収録）"},{"day":294,"original":"","person":"豊田佐吉・豊田喜一郎","theme":"創造","gist":"研究と創造に心を致し、常に時流に先んずべし。","insight":"新しいものは、常識を疑うところから生まれることがあります。『本当にこのやり方しかないか』を一度問い直してみましょう。","source":"「豊田綱領」／Toyota公式75年史"},{"day":295,"original":"When a base fellow cannot vie with another in merit he will attack him with malicious slander.","person":"サアディ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 69（サアディ名義で収録）"},{"day":296,"original":"Men of genius are often dull and inert in society, as the blazing meteor when it descends to earth is only a stone.","person":"ヘンリー・ワズワース・ロングフェロー","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 534（ヘンリー・ワズワース・ロングフェロー名義で収録）"},{"day":297,"original":"We are never so much disposed to quarrel with others as when we are dissatisfied with ourselves.","person":"ウィリアム・ハズリット","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 46（ウィリアム・ハズリット名義で収録）"},{"day":298,"original":"","person":"豊田佐吉・豊田喜一郎","theme":"生活","gist":"華美を戒め、質実剛健たるべし。","insight":"派手さより、長く続く安定を大切にする考え方です。買い物や生活習慣でも、見栄より実用を基準にすると迷いが減ります。","source":"「豊田綱領」／Toyota公式75年史"},{"day":299,"original":"Every bird has its decoy, and every man is led and misled in his own peculiar way.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 322（ゲーテ名義で収録）"},{"day":300,"original":"Watch over thy expenditure, for he who through vain glory spendeth uselessly what he hath on empty follies, will receive neither return nor praise from anyone.","person":"フェルドウスィー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 247（フェルドウスィー名義で収録）"},{"day":301,"original":"We rather confess our moral errors, faults, and crimes than our ignorance.","person":"ゲーテ","theme":"学び・知恵","gist":"知ったつもりにならず、学び続けて判断力を磨く。","insight":"分からないことを認めるのは弱さではありません。一つ調べ、一つ試してみることで、知識が実際に使える知恵へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 198（ゲーテ名義で収録）"},{"day":302,"original":"","person":"豊田佐吉・豊田喜一郎","theme":"感謝","gist":"報恩感謝の生活を為すべし。","insight":"当たり前になっているものほど価値を忘れます。今日一つだけ、助けてもらっている人や環境を言葉にしてみましょう。","source":"「豊田綱領」／Toyota公式75年史"},{"day":303,"original":"I do remember stopping by the way, To watch a potter thumping his wet clay; And with its all-obliterated tongue It murmured, “Gently, brother, gently, pray!”","person":"ウマル・ハイヤーム","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 377（ウマル・ハイヤーム名義で収録）"},{"day":304,"original":"With many readers brilliancy of style passes for affluence of thought: they mistake buttercups in the grass for immeasurable gold mines under the ground.","person":"ヘンリー・ワズワース・ロングフェロー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 284（ヘンリー・ワズワース・ロングフェロー名義で収録）"},{"day":305,"original":"","person":"豊田佐吉・豊田喜一郎","theme":"品質","gist":"充分営業的試験をなし、その成績充分にあがらざる間は、決して販売すべきものにあらず。","insight":"早く出すことと雑に出すことは別です。最低限守る品質基準を決めてから世に出すと、後の信用を守れます。","source":"豊田佐吉の言葉／Toyota公式75年史"},{"day":306,"original":"He is happiest, be he king or peasant, who finds peace in his home.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 253（ゲーテ名義で収録）"},{"day":307,"original":"The man who talketh much and never acteth will not be held in reputation by anyone.","person":"フェルドウスィー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 182（フェルドウスィー名義で収録）"},{"day":308,"original":"Being continually in people’s sight, by the satiety which it creates, diminishes the reverence felt for great characters.","person":"リウィウス","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 255（リウィウス名義で収録）"},{"day":309,"original":"","person":"豊田佐吉・豊田喜一郎","theme":"挑戦","gist":"日本の真の工業の独立をはからんとすれば、この迫力を養はなくてはなりません。","insight":"失敗を避けるだけでは新しい経験も得られません。取り返せる失敗なら、早めに試して学ぶ方が長い目では前進になります。","source":"豊田喜一郎／Toyota公式75年史"},{"day":310,"original":"It is curious to note the old sea-margins of human thought. Each subsiding century reveals some new mystery; we build where monsters used to hide themselves.","person":"ヘンリー・ワズワース・ロングフェロー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 516（ヘンリー・ワズワース・ロングフェロー名義で収録）"},{"day":311,"original":"The greatest difficulties lie where we are not looking for them.","person":"ゲーテ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良く ies, or we shall do nothing with grace. A clown, whatever he may do, will never pass for a gentleman.","person":"ラ・フォンテーヌ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 17（ラ・フォンテーヌ名義で収録）"},{"day":319,"original":"Simplicity of character is the natural result of profound thought.","person":"ウィリアム・ハズリット","theme":"自分を知る","gist":"他人を評価する前に、自分自身の癖や弱点にも目を向ける。","insight":"失敗した時に相手や環境だけを原因にせず、自分側で改善できる点を一つ探してみると、経験が成長へ変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 435（ウィリアム・ハズリット名義で収録）"},{"day":320,"original":"","person":"藤澤武夫","theme":"成長","gist":"人間の成長というものをこの期間において得たことは、大変な大利益である。","insight":"昨日よりほんの少し良くすることを続けると、半年後には大きな差になります。結果より、今日の改善点を一つ決めるのが実践的です。","source":"Honda公式「挑戦する心」"},{"day":321,"original":"This body is a tent which for a space Does the pure soul with kingly presence grace; When he departs, comes the tent-pitcher, Death, Strikes it, and moves to a new halting-place.","person":"ウマル・ハイヤーム","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 272（ウマル・ハイヤーム名義で収録）"},{"day":322,"original":"We must oblige everybody as much as we can; we have often need of assistance from those inferior to ourselves.","person":"ラ・フォンテーヌ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 426（ラ・フォンテーヌ名義で収録）"},{"day":323,"original":"Pagodas are, like mosques, true houses of prayer; ’Tis prayer that church bells waft upon the air; Kaaba and temple, rosary and cross, All are but divers tongues of world-wide prayer.","person":"ウマル・ハイヤーム","theme":"言葉・会話","gist":"言葉は慎重に選び、必要な時には黙ることも大切にする。","insight":"一度口にした言葉は完全には戻せません。感情が強い時ほど、返答や送信の前に少し時間を置く習慣が役立ちます。","source":"W. A. Clouston『Book of 生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 65（プラトン名義で収録）"},{"day":331,"original":"","person":"岡本太郎","theme":"自分らしさ","gist":"自分の中に毒を持て。","insight":"周囲の意見を参考にしつつ、最後は自分で考える。他人の人生をコピーせず、自分が納得できる基準を持つことが大切です。","source":"岡本太郎『自分の中に毒を持て』"},{"day":332,"original":"Eminent positions make eminent men greater and little men less.","person":"ラ・ブリュイエール","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 563（ラ・ブリュイエール名義で収録）"},{"day":333,"original":"The heaven that rolls around cries aloud to you while it displays its eternal beauties, and yet your eyes are fixed upon the earth alone.","person":"ダンテ・アリギエーリ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 48（ダンテ・アリギエーリ名義で収録）"},{"day":334,"original":"","person":"岡本太郎","theme":"挑戦","gist":"危険だ、という道は必ず、自分の行きたい道なのだ。","insight":"失敗を避けるだけでは新しい経験も得られません。取り返せる失敗なら、早めに試して学ぶ方が長い目では前進になります。","source":"岡本太郎『自分の中に毒を持て』"},{"day":335,"original":"Happy the man who lives at home, making it his business to regulate his desires.","person":"ラ・フォンテーヌ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 523（ラ・フォンテーヌ名義で収録）"},{"day":336,"original":"We ought never to mock the wretched, for who can be sure of being always happy?","person":"ラ・フォンテーヌ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 63（ラ・フォンテーヌ名義で収録）"},{"day":337,"original":"Worldly fame is but a breath of wind, that blows now this way, now that, and changes name as it changes sides.","person":"ダンテ・アリギエーリ o cause laughter, if it is not occasioned by pain.","person":"アリストテレス","theme":"逆境","gist":"苦しい時ほど、状況から学び、次にできることへ目を向ける。","insight":"つらい出来事を無理に肯定する必要はありません。ただ、『この経験から次に使えるものは何か』を一つ探すと、経験を前進の材料にできます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 292（アリストテレス名義で収録）"},{"day":344,"original":"Human experience, like the stern-lights of a ship at sea, illumines only the path which we have passed over.","person":"サミュエル・テイラー・コールリッジ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 36（サミュエル・テイラー・コールリッジ名義で収録）"},{"day":345,"original":"","person":"黒澤明","theme":"創造","gist":"何かを創るということは、自分の中にあるものを探すことだ。","insight":"新しいものは、常識を疑うところから生まれることがあります。『本当にこのやり方しかないか』を一度問い直してみましょう。","source":"黒澤明の創作観として関連資料で紹介"},{"day":346,"original":"It is difficult to understand men, but still harder to know them thoroughly.","person":"フリードリヒ・シラー","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 33（フリードリヒ・シラー名義で収録）"},{"day":347,"original":"To be envied is a nobler fate than to be pitied.","person":"ピンダロス","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 124（ピンダロス名義で収録）"},{"day":348,"original":"Can anything be more absurd than that the nearer we are to our journey’s end, we should lay in the more provision for it?","person":"キケロ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 382（キケロ名義で収録）"},{"day":349,"original":"","person":"小林一三","theme":"仕事","gist":"下足番を命じられたら、日本一の下足番になってみろ。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"小林一三の言葉として阪急文化関連資料等 当に大切なことへ移すと生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 387（メナンドロス名義で収録）"},{"day":356,"original":"","person":"土光敏夫","theme":"生活","gist":"個人は質素に、社会は豊かに。","insight":"派手さより、長く続く安定を大切にする考え方です。買い物や生活習慣でも、見栄より実用を基準にすると迷いが減ります。","source":"土光敏夫の理念として広く紹介"},{"day":357,"original":"The guilty man may escape, but he cannot be sure of doing so.","person":"エピクロス","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 386（エピクロス名義で収録）"},{"day":358,"original":"The undertaking of a careless man succeeds not, though he use the right expedients: a clever hunter, though well placed in ambush, kills not his quarry if he falls asleep.","person":"バーラヴィ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 313（バーラヴィ名義で収録）"},{"day":359,"original":"The more weakness the more falsehood; strength goes straight: every cannon ball that has in it hollows and holes goes crooked.","person":"ジャン・パウル","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 341（ジャン・パウル名義で収録）"},{"day":360,"original":"","person":"安藤百福","theme":"仕事・社会","gist":"食足世平。","insight":"仕事は自分の利益だけでなく、誰かの役に立つことで長く続きます。自分の仕事が誰の何を良くしているか考えてみましょう。","source":"日清食品創業者・安藤百福の理念"},{"day":361,"original":"Flattery may be considered as a mode of companionship, degrading but profitable to him who flatters.","person":"テオフラストス","theme":"人間関係","gist":"人との関係は、日々の思いやりと行動によって育てる。","insight":"相手を完全に変えることはできません。自分の伝え方や距離の取り方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 528（テオフラストス名義で収録）"},{"day":362,"original":"The sun opens the lotuses, the moon illumines the beds of water-lilies, the cloud pours forth its water unasked: even so the liberal of their own accord are occupied in benefiting others.","person":"バルトリハリ","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 241（バルトリハリ名義で収録）"},{"day":363,"original":"It is a common remark that men talk most who think least; just as frogs cease their quacking when a light is brought to the water-side.","person":"ジャン・パウル","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 359（ジャン・パウル名義で収録）"},{"day":364,"original":"","person":"安藤百福","theme":"創造","gist":"食創為世。","insight":"新しいものは、常識を疑うところから生まれることがあります。『本当にこのやり方しかないか』を一度問い直してみましょう。","source":"安藤百福の理念／日清食品"},{"day":365,"original":"Grossness is not difficult to define: it is obtrusive and objectionable pleasantry.","person":"テオフラストス","theme":"人生","gist":"人生を一度に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を今日決める必要はありません。今日の選択を一つだけ良くすることを続けると、長い目では方向が変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 303（テオフラストス名義で収録）"}];
function doy(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.min(365,Math.max(1,Math.floor((n-s)/86400000)))}
let pos=doy()-1,favs=new Set(JSON.parse(localStorage.getItem("meigen365precisionFavs")||"[]"));
function render(){const q=quotes[pos],isJP=!q.original;counter.textContent=(pos+1)+" / 365";theme.textContent=q.theme||"人生";original.style.display=isJP?"none":"block";original.textContent=isJP?"":"“"+q.original+"”";jp.textContent=(q.gist||"")+"（"+q.person+"）";source.textContent="出典："+q.source;insight.textContent=q.insight;fav.textContent=(favs.has(q.day)?"♥":"♡")+" お気に入り";}
today.onclick=()=>{pos=doy()-1;render()};next.onclick=()=>{pos=(pos+1)%365;render()};random.onclick=()=>{pos=Math.floor(Math.random()*365);render()};fav.onclick=()=>{const id=quotes[pos].day;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("meigen365precisionFavs",JSON.stringify([...favs]));render()};share.onclick=async()=>{const q=quotes[pos],t=(q.original?"“"+q.original+"”\n":"")+(q.gist||"")+"（"+q.person+"）\n出典："+q.source+"\n\n💡 "+q.insight;if(navigator.share)try{await navigator.share({text:t})}catch(e){}};render();
</script></body></html>
