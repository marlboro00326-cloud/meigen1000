</main><script>
const quotes=[{"day":1,"original":"","person":"福澤諭吉","theme":"学び・自立","gist":"天は人の上に人を造らず人の下に人を造らずと云へり。","insight":"人に頼らないことではなく、自分で考えて選べる力を持つことが自立です。その土台として学びを続ける、という読み方ができます。","source":"『学問のすゝめ』初編"},{"day":2,"original":"","person":"福澤諭吉","theme":"学び","gist":"賢人と愚人との別は学ぶと学ばざるとに由て出来るものなり。","insight":"学びは知識を増やすだけでなく、選択肢を増やします。分からないことがあった日は、一つ調べて昨日より少し前へ進めば十分です。","source":"『学問のすゝめ』初編"},{"day":3,"original":"","person":"福澤諭吉","theme":"自立","gist":"一身独立して一国独立す。","insight":"自分で決めるほど責任も増えます。小さなことから自分で判断し、その結果を引き受ける経験が自信につながります。","source":"『学問のすゝめ』"},{"day":4,"original":"","person":"福澤諭吉","theme":"自由・責任","gist":"自由と我儘との界は、他人の妨げを為すと為さざるとの間にあり。","insight":"自由は何をしてもよいという意味ではありません。自分の自由と相手の自由が両立する境界を意識すると、人間関係も安定します。","source":"『学問のすゝめ』"},{"day":5,"original":"","person":"福澤諭吉","theme":"学び","gist":"学問の本趣意は読書にのみ非ずして精神の働きに在り。","insight":"学びは知識を増やすだけでなく、選択肢を増やします。分からないことがあった日は、一つ調べて昨日より少し前へ進めば十分です。","source":"『学問のすゝめ』"},{"day":6,"original":"","person":"福澤諭吉","theme":"自立","gist":"独立の気力なき者は必ず人に依頼す。","insight":"自分で決めるほど責任も増えます。小さなことから自分で判断し、その結果を引き受ける経験が自信につながります。","source":"『学問のすゝめ』"},{"day":7,"original":"","person":"福澤諭吉","theme":"時間","gist":"人の一生は誠に僅の事なり。","insight":"この言葉を今日の生活に置き換え、実際にできる小さな行動を一つ決めてみましょう。言葉は行動に変えた時に自分のものになります。","source":"『福翁百話』"},{"day":8,"original":"","person":"福澤諭吉","theme":"人間関係","gist":"世の中で一番美しいことは、すべての物に愛情を持つことです。","insight":"自分を大切にすることと、相手を尊重することは両立します。自分の個性を守るなら、相手の違いも同じように認めたいものです。","source":"福澤諭吉の言葉として慶應関係資料等で紹介"},{"day":9,"original":"","person":"渋沢栄一","theme":"仕事・お金","gist":"論語と算盤は甚だ遠くして甚だ近いもの。","insight":"利益だけでも理想だけでも仕事は続きません。正しい方法で価値を生み、その結果として利益を得るという順番を意識したい言葉です。","source":"『論語と算盤』処世と信条"},{"day":10,"original":"","person":"渋沢栄一","theme":"仕事・お金","gist":"富を成す根源は仁義道徳、正しい道理の富でなければならぬ。","insight":"利益だけでも理想だけでも仕事は続きません。正しい方法で価値を生み、その結果として利益を得るという順番を意識したい言葉です。","source":"『論語と算盤』処世と信条"},{"day":11,"original":"","person":"渋沢栄一","theme":"仕事","gist":"士魂商才。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"『論語と算盤』処世と信条"},{"day":12,"original":"","person":"渋沢栄一","theme":"信用","gist":"信用は実に資本であって商売繁昌の根底である。","insight":"信用は一度に作れません。約束を守る、返信する、誤りを認めるといった小さな行動の積み重ねが後で大きな力になります。","source":"『論語と算盤』"},{"day":13,"original":"","person":"渋沢栄一","theme":"心","gist":"成敗に関わらず、精神を常に満足させねばならぬ。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"『論語と算盤』"},{"day":14,"original":"","person":"渋沢栄一","theme":"心","gist":"得意時代だからとて気を緩さず、失意時代だからとて落胆せず。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"『論語と算盤』得意時代と失意時代"},{"day":15,"original":"","person":"渋沢栄一","theme":"希望","gist":"道理ある希望を持つのがよい。","insight":"根拠のない楽観ではなく、まだできることがあると考えて動くことが希望です。問題を一つ小さく分けてみましょう。","source":"『論語と算盤』"},{"day":16,"original":"","person":"渋沢栄一","theme":"仕事","gist":"事業には信用が第一である。","insight":"仕事では考え方を実際の行動に落とすことが重要です。今日の仕事で一つだけ質を上げられるところを探してみましょう。","source":"『論語と算盤』の趣旨"},{"day":17,"original":"","person":"西郷隆盛","theme":"誠実","gist":"敬天愛人。","insight":"誰も見ていない時にも自分が納得できる行動を選ぶ。それが長い目で見た信用と自信につながります。","source":"『南洲翁遺訓』に伝わる思想"},{"day":18,"original":"","person":"西郷隆盛","theme":"心","gist":"人を相手にせず、天を相手にせよ。","insight":"外の出来事を全部変えることはできませんが、自分の受け止め方と次の行動は選べます。感情が強い時ほど少し間を置くと判断しやすくなります。","source":"『南洲翁遺訓』"},{"day":19,"original":"","person":"西郷隆盛","theme":"自分を知る","gist":"己れを愛するは善からぬことの第一也。","insight":"他人の欠点より自分の癖は見えにくいものです。失敗した時、自分側で直せる点を一つ探すと経験が成長に変わります。","source":"『南洲翁遺訓』"},{"day":20,"original":"","person":"西郷隆盛","theme":"仕事・責任","gist":"些とも私を挟みては済まぬもの也。","insight":"立場が上がるほど、自分の好みと組織にとって良い判断を分ける必要があります。私情を一度外して考える習慣が役立ちます。","source":"『南洲翁遺訓』第一条"},{"day":21,"original":"","person":"西郷隆盛","theme":"判断","gist":"心を公平に操り、正道を踏み。","insight":"迷った時は、事実・感情・予想を分けて考えてみましょう。思い込みを事実として扱わないだけでも判断の質は上がります。","source":"『南洲翁遺訓』第一条"},{"day":22,"original":"","person":"西郷隆盛","theme":"準備","gist":"事に当り思慮の乏しきを憂ふること勿れ。","insight":"本番で急に良い判断をするのは難しいものです。大切なことほど事前に考え、失敗した場合の次の手まで用意すると落ち着いて動けます。","source":"『南洲翁遺訓』追加"},{"day":23,"original":"","person":"吉田松陰","theme":"目標","gist":"夢なき者に理想なし。","insight":"目標が大きすぎると動けなくなります。今日 ","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 8"},{"day":102,"original":"In the height of thy prosperity expect adversity, but fear it not. If it come not, thou art the more sweetly possessed of the happiness thou hast, and the more strongly confirmed. If it come, thou art the more gently dispossessed of the happiness thou hadst, and the more firmly prepared.","person":"Quarles","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 30"},{"day":103,"original":"In this thing one man is superior to another, that he is better able to bear adversity and prosperity.","person":"Philemon","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 57"},{"day":104,"original":"Circumspection in calamity; mercy in greatness; good speeches in assemblies; fortitude in adversity: these are the self-attained perfections of great souls.","person":"Hitopadesa","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 78"},{"day":105,"original":"Assume in adversity a countenance of prosperity, and in prosperity moderate thy temper.","person":"Livy","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 175"},{"day":106,"original":"The worse the ill that fate on noble souls Inflicts, the more their firmness; and they arm Their spirits with adamant to meet the blow.","person":"Hindu Drama","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 184"},{"day":107,"original":"Opportunities lose not, for all delay is madness; ’Mid bitter sorrow patience show, for ’tis the key of gladness.","person":"Turkish","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 185"},{"day":108,"original":"As gold is tried by the furnace, and the baser metal shown, so the hollow-hearted friend is known by adversity.","person":"Metastasio","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 330"},{"day":109,"original":"The lake no longer water holds— Off fly the fowls, the lilies stay: If friends are friends when wealth is gone, The lily’s constancy they share.","person":"Hindu Poetess","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 366"},{"day":110,"original":"Seest thou good days? Prepare for evil times. No summer but hath its winter. He never reaped comfort in adversity that sowed not in prosperity.","person":"Quarles","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 393"},{"day":111,"original":"Friendship throws a greater lustre on prosperity, while it lightens adversity by sharing in its griefs and troubles.","person":"Cicero","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 477"},{"day":112,"original":"As drops of bitter medicine, though minute, may have a salutary force, so words, though few and painful, uttered seasonably, may rouse the prostrate energies of those who meet misfortune with despondency.","person":"Bhāravi","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 82"},{"day":113,"original":"The man who listens not to the words of affectionate friends will give joy in the time of distress to his enemies.","person":"Hitopadesa","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 172"},{"day":114,"original":"To address a judicious remark to a thoughtless man is a mere threshing of chaff.","person":"Hitopadesa","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 193"},{"day":115,"original":"Skill in advising others is easily attained by men; but to practise righteousness themselves is what only a few can succeed in doing.","person":"Hitopadesa","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 443"},{"day":116,"original":"Anger that has no limit causes terror, and unseasonable kindness does away with respect. Be not so severe as to cause disgust, nor so lenient as to make people presume.","person":"Sa’dī","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 117"},{"day":117,"original":"As rain breaks through an ill-thatched house, passion breaks through an unreflecting mind.","person":"Dhammapada","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"感情を抑え込むのではなく、『今、自分は怒っている』と認識するだけでも一歩引いて見られます。感情と行動を分ける練習です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 119"},{"day":118,"original":"If thou desirest that the pure in heart should praise thee, lay aside anger; be not a man of many words; and parade not thy virtues in the face of others.","person":"Firdausī","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 130"},{"day":119,"original":"Do not anxiously expect what is not yet come; do not vainly regret what is already past.","person":"Chinese","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 298"},{"day":120,"original":"Set about whatever you intend to do; the beginning is half the battle.","person":"Ausonius","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 383"},{"day":121,"original":"Scratch yourself with your own nails; always do your own business, and when you intend asking for a service, go to a person who can appreciate your merit.","person":"Arabic","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 564"},{"day":122,"original":"Vociferation and calmness of character seldom meet in the same person.","person":"Lavater","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 361"},{"day":123,"original":"Never does a man portray his own character more vividly than in his manner of portraying another.","person":"Richter","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 160"},{"day":124,"original":"The man who neither gives in charity nor enjoys his wealth, which every day increases, breathes, indeed, like the bellows of a smith, but cannot be said to live.","person":"Hitopadesa","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 94"},{"day":125,"original":"Whoever brings cheerfulness to his work, and is ever active, dashes through the world’s labours.","person":"Tieck","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 302"},{"day":126,"original":"There is nothing more beautiful than cheerfulness in an old face, and among country people it is always a sign of a well-regulated life.","person":"Richter","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 391"},{"day":127,"original":"All confidence is dangerous unless it is complete; there are few circumstances in which it is not better either to hide all or to tell all.","person":"La Bruyère","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 268"},{"day":128,"original":"I asked an experienced elder who had profited by his knowledge of the world, “What course should I pursue to obtain prosperity?” He replied, “Contentment—if you are able, practise contentment.”","person":"Selman","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 10"},{"day":129,"original":"Health is the greatest gift, contentedness the best riches.","person":"Dhammapada","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 52"},{"day":130,"original":"Contentment consisteth not in heaping more fuel, but in taking away some fire.","person":"Fuller","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 101"},{"day":131,"original":"There are no riches like the sweetness of content, nor poverty comparable to the want of patience.","person":"R. Chamberlain","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 135"},{"day":132,"original":"The fountain of content must spring up in the mind, and he who has so little knowledge of human nature as to seek happiness by changing anything but his own disposition will waste his life in fruitless efforts, and multiply the griefs which he purposes to remove.","person":"Johnson","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 334"},{"day":133,"original":"Men are not rich or poor according to what they possess but to what they desire. The only rich man is he that with content enjoys a competence.","person":"R. Chamberlain","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 471"},{"day":134,"original":"It is resignation and contentment that are best calculated to lead us safely through life. Whoever has not sufficient power to endure privations, and even suffering, can never feel that he is armour-proof against painful emotions; nay, he must attribute to himself, or at least to the morbid sensitiveness of his nature, every disagreeable feeling he may suffer.","person":"Von Humboldt","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 538"},{"day":135,"original":"In conversation humour is more than wit, easiness, more than knowledge; few desire to learn, or to think they need it; all desire to be pleased, or, if not, to be easy.","person":"Sir W. Temple","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 71"},{"day":136,"original":"He who labours diligently need never despair. We can accomplish every thing by diligence and labour.","person":"Menander","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 189"},{"day":137,"original":"There is nothing more operative than sedulity and diligence. A man would wonder at the mighty things which have been done by degrees and gentle augmentations. Diligence and moderation are the best steps whereby to climb to any excellence, nay, it is rare that there is any other other way.","person":"Feltham","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 428"},{"day":138,"original":"We in reality only know when we doubt a little. With knowledge comes doubt.","person":"Goethe","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 7"},{"day":139,"original":"Education and morals will be found almost the whole that goes to make a good man.","person":"Aristotle","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 348"},{"day":140,"original":"That energy which veils itself in mildness is most effective of its object.","person":"Māgha","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 95"},{"day":141,"original":"Whate’er the work a man performs, The most effective aid to its completion— The most prolific source of true success— Is energy, without despondency.","person":"Ramāyāna","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 149"},{"day":142,"original":"To be envied is a nobler fate than to be pitied.","person":"Pindar","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 124"},{"day":143,"original":"In some dispositions there is such an envious kind of pride that they cannot endure that any but themselves should be set forth as excellent; so that when they hear one justly praised they will either openly detract from his virtues; or, if those virtues be, like a clear and shining light, eminent and distinguished, so that he cannot be safely traduced by the tongue, they will then raise a suspicion against him by a mysterious silence, as if there were something remaining to be told which overclouded even his brightest glory.","person":"Feltham","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 168"},{"day":144,"original":"One man envies the success in life of another, and hates him in secret; nor is he willing to give him good advice when he is consulted, except it be by some wonderful effort of good feeling, and there are, alas, few such men in the world. A real friend, on the other hand, exults in his friend’s happiness, rejoices in all his joys, and is ready to afford him the best advice.","person":"Herodotus","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 271"},{"day":145,"original":"Very distasteful is excessive fame To the sour palate of the envious mind, Who hears with grief his neighbours good by name, And hates the fortune that he ne’er shall find.","person":"Pindar","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 343"},{"day":146,"original":"It is the usual consolation of the envious, if they cannot maintain their superiority, to represent those by whom they are surpassed as inferior to some one else.","person":"Plutarch","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 375"},{"day":147,"original":"Envy is a vice that would pose a man to tell what it should be liked for. Other vices we assume for that we falsely suppose they bring us either pleasure, profit, or honour. But in envy who is it can find any of these? Instead of pleasure, we vex and gall ourselves. Like cankered brass, it only eats itself, nay, discolours and renders it noisome. When some one told Agis that those of his neighbour’s family did envy him, “Why, then,” says he, “they have a double vexation—one, with their own evil, the other, at my prosperity.”","person":"Feltham","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 525"},{"day":148,"original":"Human experience, like the stern-lights of a ship at sea, illumines only the path which we have passed over.","person":"Coleridge","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 36"},{"day":149,"original":"In no wise ask about the faults of others, for he who reporteth the faults of others will report thine also.","person":"Firdausī","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 20"},{"day":150,"original":"Men soon the faults of others learn, A few their virtues, too, find out; But is there one—I have a doubt— Who can his own defects discern?","person":"Sanskrit","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 39"},{"day":151,"original":"Mention not a blemish which is thy own in detraction of a neighbour.","person":"Talmud","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 41"},{"day":152,"original":"We rather confess our moral errors, faults, and crimes than our ignorance.","person":"Goethe","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 198"},{"day":153,"original":"An evil-minded man is quick to see His neighbour’s faults, though small as mustard seed; But when he turns his eyes towards his own, Though large as _bilva_ fruit, he none descries.","person":"Mahābhārata","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 219"},{"day":154,"original":"It is well that there is no one without a fault, for he would not have a friend in the world: he would seem to belong to a different species.","person":"Hazlitt","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 269"},{"day":155,"original":"The faults of others are easily perceived, but those of oneself are difficult to perceive; a man winnows his neighbour’s faults like chaff, but his own fault he hides as a cheat hides the false dice from the gamester.","person":"Dhammapada","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 347"},{"day":156,"original":"Hath any wronged thee, be bravely revenged. Slight it, and the work’s begun; forgive it, and ’tis finished. He is below himself that is not above an injury.","person":"Quarles","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 329"},{"day":157,"original":"A more glorious victory cannot be gained over another man than this, that when the injury began on his part the kindness should begin on ours.","person":"Tillotson","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 344"},{"day":158,"original":"Good fortune is a benefit to the wise, but a curse to the foolish.","person":"Chinese","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 56"},{"day":159,"original":"It is a proverbial expression that every man is the maker of his own fortune, and we usually regard it as implying that every man by his folly or wisdom prepares good or evil for himself. But we may view it in another light, namely, that we may so accommodate ourselves to the dispositions of Providence as to be happy in our lot, whatever may be its privations.","person":"Von Humboldt","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"感情を抑え込むのではなく、『今、自分は怒っている』と認識するだけでも一歩引いて見られます。感情と行動を分ける練習です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 173"},{"day":160,"original":"I have often thought that the cause of men’s good or ill fortune depends on whether they make their actions fit with the times. A man having prospered by one mode of acting can never be persuaded that it may be well for him to act differently, whence it is that a man’s Fortune varies, because she changes her times and he does not his ways.","person":"Machiavelli","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 233"},{"day":161,"original":"The potter forms what he pleases with soft clay, so a man accomplishes his works by his own act.","person":"Hitopadesa","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 249"},{"day":162,"original":"Man is supreme lord and master Of his own ruin and disaster, Controls his fate, but nothing less In ordering his own happiness: For all his care and providence Is too feeble a defence To render it secure and certain Against the injuries of Fortune; And oft, in spite of all his wit, Is lost by one unlucky hit, And ruined with a circumstance, And mere punctilio of a chance.","person":"Butler","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 262"},{"day":163,"original":"A day of fortune is like a harvest-day, we must be busy when the corn is ripe.","person":"Goethe","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 276"},{"day":164,"original":"There is nothing keeps longer than a middling fortune, and nothing melts away sooner than a great one. Poverty treads upon the heels of great and unexpected riches.","person":"La Bruyère","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 536"},{"day":165,"original":"Lament not Fortune’s mutability, And seize her fickle favours ere they flee; If others never mourned departed bliss, How should a turn of Fortune come to thee?","person":"Omar Khayyām","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 552"},{"day":166,"original":"The son who delights his father by his good actions; the wife who seeks only her husband’s good; the friend who is the same in prosperity and adversity—these three things are the reward of virtue.","person":"Bhartrihari","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 16"},{"day":167,"original":"There is not half so much danger in the desperate sword of a known foe as in the smooth insinuations of a pretended friend.","person":"R. Chamberlain","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 98"},{"day":168,"original":"Be very circumspect in the choice of thy company. In the society of thy equals thou shalt enjoy more pleasure; in the society of thy superiors thou shalt find more profit. To be the best of the company is the way to grow worse; the best means to grow better is to be the worst there.","person":"Quarles","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 174"},{"day":169,"original":"It is not easy to stop the fire when the water is at a distance; friends at hand are better than relations afar off.","person":"Chinese","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 432"},{"day":170,"original":"In poverty and other misfortunes of life men think friends to be their only refuge. The young they keep out of mischief, to the old they are a comfort and aid in their weakness, and those in the prime of life they incite to noble deeds.","person":"Aristotle","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 458"},{"day":171,"original":"There is nothing more becoming a wise man than to make choice of friends, for by them thou shalt be judged what thou art. Let them therefore be wise and virtuous, and none of those that follow thee for gain; but make election rather of thy betters than thy inferiors; shunning always such as are poor and needy, for if thou givest twenty gifts and refuse to do the like but once, all that thou hast done will be lost, and such men will become thy mortal enemies.","person":"Sir W. Raleigh, to his Son","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 478"},{"day":172,"original":"An absent friend gives us friendly company when we are well assured of his happiness.","person":"Goethe","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 496"},{"day":173,"original":"Eschew that friend, if thou art wise, who consorts with thy enemies.","person":"Sa’dī","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 544"},{"day":174,"original":"If thou shouldst find thy friend in the wrong reprove him secretly, but in the presence of company praise him.","person":"Arabic","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 547"},{"day":175,"original":"E’en as a traveller, meeting with the shade Of some o’erhanging tree, awhile reposes, Then leaves its shelter to pursue his way, So men meet friends, then part with them for ever.","person":"Hitopadesa","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 588"},{"day":176,"original":"The friendship of the bad is like the shade of some precipitous bank with crumbling sides, which, falling, buries him who is beneath.","person":"Bhāravi","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 24"},{"day":177,"original":"If the friendship of the good be interrupted, their minds admit of no long change; as when the stalks of a lotus are broken the filaments within them are more visibly cemented.","person":"Hitopadesa","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 116"},{"day":178,"original":"The friendships formed between good and evil men differ. The friendship of the good, at first faint like the morning light, continually increases; the friendship of the evil at the very beginning is like the light of midday, and dies away like the light of evening.[13]","person":"Bhartrihari","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 309"},{"day":179,"original":"Were all thy fond endeavours vain To chase away the sufferer’s smart, Still hover near, lest absence pain His lonely heart. For friendship’s tones have kindlier power Than odorous fruit, or nectared bowl, To soothe, in sorrow’s languid hour, The sinking soul.","person":"Sa’dī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 346"},{"day":180,"original":"Frugality should ever be practised, but not excessive parsimony.","person":"Hitopadesa","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 316"},{"day":181,"original":"Be thou generous, and gentle, and forgiving; as God hath scattered upon thee, scatter thou upon others.","person":"Sa’dī","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 140"},{"day":182,"original":"To exert his power in doing good is man’s most glorious task.","person":"Sophocles","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 110"},{"day":183,"original":"’Tis not for gain, for fame, from fear That righteous men injustice shun, And virtuous men hold virtue dear: An inward voice they seem to hear, Which tells them duty must be done.","person":"Mahābhārata","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 136"},{"day":184,"original":"As far and wide the vernal breeze Sweet odours waft from blooming trees, So, too, the grateful savour spreads To distant lands of virtuous deeds.","person":"Sanskrit","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 137"},{"day":185,"original":"Good actions lead to success, as good medicines to a cure: a healthy man is joyful, and a diligent man attains learning; a just man gains the reward of his virtue.","person":"Hitopadesa","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 145"},{"day":186,"original":"Just as the track of birds that cleave the air Is not discovered, nor yet the path of fish That skim the water, so the course of those Who do good actions is not always seen.","person":"Mahābhārata","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 209"},{"day":187,"original":"We may be as good as we please, if we please to be good.","person":"Barrow","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"短期的にはごまかした方が得に見える場面もありますが、長期では信用の差が大きくなります。誠実さは時間をかけて効いてくる資産です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 73"},{"day":188,"original":"Increase in goodness as long as thou art here, that, when thou departest, in that thou mayest still be joyful. According to our words and deeds in this life will be the remembrance of us in the world.","person":"Firdausī","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 153"},{"day":189,"original":"Whosoever does not persecute them that persecute him; whosoever takes an offence in silence; he who does good because of love; he who is cheerful under his sufferings—these are the friends of God, and of them the Scripture says, “They shall shine forth like the sun at noontide.”","person":"Talmud","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 238"},{"day":190,"original":"He who receives a favour must retain a recollection of it for all time to come; but he who confers should at once forget it, if he is not to show a sordid and ungenerous spirit. To remind a man of a kindness conferred on him, and to talk of it, is little different from a reproach.","person":"Demosthenes","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 317"},{"day":191,"original":"The rays of happiness, like those of light, are colourless when unbroken.","person":"Longfellow","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 58"},{"day":192,"original":"Wrapt up in error is the human mind, And human bliss is ever insecure; Know we what fortune yet remains behind? Know we how long the present shall endure?","person":"Pindar","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 66"},{"day":193,"original":"If a man be not so happy as he desires, let this be his comfort—he is not so wretched as he deserves.","person":"R. Chamberlain","theme":"満足・幸福","gist":"足りないものだけでなく、すでにあるものを見る。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 70"},{"day":194,"original":"The man of affluence is not in fact more happy than the possessor of a bare competency, unless, in addition to his wealth, the end of his life be fortunate. We often see misery dwelling in the midst of splendour, whilst real happiness is found in humbler stations.","person":"Herodotus","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 187"},{"day":195,"original":"He is happiest, be he king or peasant, who finds peace in his home.","person":"Goethe","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 253"},{"day":196,"original":"The noble-minded dedicate themselves to the promotion of the happiness of others—even of those who injure them. True happiness consists in making happy.","person":"Bhāravi","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 311"},{"day":197,"original":"Pleasure, most often delusive, may be born of delusion. Pleasure, herself a sorceress, may pitch her tents on enchanted ground. But happiness (or, to use a more accurate and comprehensive term, solid well-being) can be built on virtue alone, and must of necessity have truth for its foundation.","person":"Coleridge","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 337"},{"day":198,"original":"Real and solid happiness springs from moderation.","person":"Goethe","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 363"},{"day":199,"original":"Let us be well persuaded that everyone of us possesses happiness in proportion to his virtue and wisdom, and according as he acts in obedience to their suggestion.","person":"Aristotle","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 367"},{"day":200,"original":"What is the most profitable? Fellowship with the good. What is the worst thing in the world? The society of evil men. What is the greatest loss? Failure in one’s duty. Where is the greatest peace? In truth and righteousness. Who is the hero? The man who subdues his senses. Who is the best beloved? The faithful wife. What is wealth? Knowledge. What is the most perfect happiness? Staying at home.","person":"Bhartrihari","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 406"},{"day":201,"original":"Humility is a virtue all preach, none practise, and yet everybody is content to hear. The master thinks it good doctrine for his servant, the laity for the clergy, and the clergy for the laity.","person":"Selden","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 150"},{"day":202,"original":"I never yet found pride in a noble nature nor humility in an unworthy mind.","person":"Feltham","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 157"},{"day":203,"original":"Not to attend at the door of the wealthy, and not to use the voice of petition—these constitute the best life of a man.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 581"},{"day":204,"original":"The man of first rate excellence is virtuous in spite of instruction; he of the middle class is so after instruction; the lowest order of men are vicious in spite of instruction.","person":"Chinese","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 580"},{"day":205,"original":"To form a judgment intuitively is the privilege of few; authority and example lead the rest of the world. They see with the eyes of others, they hear with the ears of others. Therefore it is very easy to think as all the world now think; but to think as all the world will think thirty years hence is not in the power of every one.","person":"Schopenhauer","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 259"},{"day":206,"original":"Dost thou desire that thine own heart should not suffer, redeem thou the sufferer from the bonds of misery.","person":"Sa’dī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 4"},{"day":207,"original":"To friends and eke to foes true kindness show; No kindly heart unkindly deeds will do; Harshness will alienate a bosom friend. And kindness reconcile a deadly foe.","person":"Omar Khayyām","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 5"},{"day":208,"original":"Let none with scorn a suppliant meet, Or from the door untended spurn A dog; an outcast kindly treat; And so thou shalt be blest in turn.","person":"Mahābhārata","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 54"},{"day":209,"original":"The good to others kindness show, And from them no return exact; The best and greatest men, they know, Thus ever nobly love to act.[7]","person":"Mahābhārata","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 92"},{"day":210,"original":"The pure in heart, who fear to sin, The good, kindly in word and deed— These are the beings in the world Whose nature should be called divine.","person":"Buddhist","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 129"},{"day":211,"original":"To bad as well as good, to all, A generous man compassion shows; On earth no mortal lives, he knows, Who does not oft through weakness fall.","person":"Rāmāyana","theme":"怒り・感情","gist":"怒りや不安は自然だが、行動の主導権は渡さない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 305"},{"day":212,"original":"The good extend their loving care To men, however mean or vile; E’en base Chándálas’[12] dwellings share Th’ impartial sunbeam’s silver smile.","person":"Hitopadesa","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 306"},{"day":213,"original":"Knowledge is destroyed by associating with the base; with equals equality is gained, and with the distinguished, distinction.","person":"Hitopadesa","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 3"},{"day":214,"original":"A man who has learnt little grows old like an ox: his flesh grows, but his knowledge does not grow.","person":"Dhammapada","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 43"},{"day":215,"original":"Choose knowledge, if thou desirest a blessing from the Universal Provider; for the ignorant man cannot raise himself above the earth, and it is by knowledge that thou must render thy soul praiseworthy.","person":"Firdausī","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 55"},{"day":216,"original":"He that is ambitious of fame destroys it. He that increaseth not his knowledge diminishes it. He that uses the crown of learning as an instrument of gain will pass away.","person":"Talmud","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 201"},{"day":217,"original":"If thou lackest knowledge, what hast thou then acquired? Hast thou acquired knowledge, what else dost thou want?","person":"Talmud","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 205"},{"day":218,"original":"Knowledge acquired by a man of low degree places him on a level with a prince, as a small river attains the irremeable ocean; and his fortune is then exalted.","person":"Hitopadesa","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 218"},{"day":219,"original":"Amongst all possessions knowledge appears pre-eminent. The wise call it supreme riches, because it can never be lost, has no price, and can at no time be destroyed.","person":"Hitopadesa","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 225"},{"day":220,"original":"Adorn thy mind with knowledge, for knowledge maketh thy worth.","person":"Firdausī","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 286"},{"day":221,"original":"Let a man accept with confidence valuable knowledge even from a person of low degree, good instruction regarding duty even from a humble man, and a jewel of a wife even from an ignoble family.","person":"Manu","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 307"},{"day":222,"original":"Perfect ignorance is quiet, perfect knowledge is quiet; not so the transition from the former to the latter.","person":"Carlyle","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 355"},{"day":223,"original":"He who toils with pain will eat with pleasure.","person":"Chinese","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 275"},{"day":224,"original":"In sooth, it is a shame to choose rather to be still borrowing in all places, from everybody, than to work and win.","person":"Rabelais","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 429"},{"day":225,"original":"Rather skin a carcass for pay in the public streets than be idly dependent on charity.","person":"Talmud","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 453"},{"day":226,"original":"In learning, age and youth go for nothing; the best informed take the precedence.","person":"Chinese","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 40"},{"day":227,"original":"A man eminent in learning has not even a little virtue if he fears to practise it. What precious things can be shown to a blind man when he holds a lamp in his hand?","person":"Hitopadesa","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 143"},{"day":228,"original":"Learning dissipates many doubts, and causes things otherwise invisible to be seen, and is the eye of everyone who is not absolutely blind.","person":"Hitopadesa","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 342"},{"day":229,"original":"Liberality attended with mild language; learning without pride; valour united with mercy; wealth accompanied with a generous contempt of it—these four qualities are with difficulty acquired.","person":"Hitopadesa","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 449"},{"day":230,"original":"Learning is like Scanderbeg’s sword, either good or bad according to him who hath it: an excellent weapon, if well used; otherwise, like a sharp razor in the hand of a child.","person":"R. Chamberlain","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 479"},{"day":231,"original":"He who has more learning than goodness is like a tree with many branches and few roots, which the first wind throws down; whilst he whose works are greater than his knowledge is like a tree with many roots and fewer branches, which all the winds of heaven cannot uproot.","person":"Talmud","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 491"},{"day":232,"original":"A man of little learning deems that little a great deal; a frog, never having seen the ocean, considers its well a great sea.","person":"Burmese","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 504"},{"day":233,"original":"Women’s wealth is beauty, learning, that of men.","person":"Burmese","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 509"},{"day":234,"original":"Consider, and you will find that almost all the transactions of the time of Vespasian differed little from those of the present day. You there find marrying and giving in marriage, educating children, sickness, death, war, joyous holidays, traffic, agriculture, flatterers, insolent pride, suspicions, laying of plots, longing for the death of others, newsmongers, lovers, misers, men canvassing for consulship—yet all these passed away, and are nowhere.","person":"M. Aurelius","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 23"},{"day":235,"original":"There are three whose life is no life: he who lives at another’s table; he whose wife domineers over him; and he who suffers bodily affliction.","person":"Talmud","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 83"},{"day":236,"original":"He only does not live in vain Who all the means within his reach Employs—his wealth, his thought, his speech— T’advance the weal of other men.","person":"Sanskrit","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 125"},{"day":237,"original":"The life of man is the incessant walk of nature, wherein every moment is a step towards death. Even our growing to perfection is a progress to decay. Every thought we have is a sand running out of the glass of life.","person":"Feltham","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 133"},{"day":238,"original":"The first forty years of our life give the text, the next thirty furnish the commentary upon it, which enables us rightly to understand the true meaning and connection of the text with its moral and its beauties.","person":"Schopenhauer","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 144"},{"day":239,"original":"Whilom, ere youth’s conceit had waned, methought Answers to all life’s problems I had wrought; But now, grown old and wise, too late I see My life is spent, and all my lore is nought.","person":"Omar Khayyām","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 235"},{"day":240,"original":"Men hail the rising sun with glee, They love his setting glow to see, But fail to mark that every day In fragments bears their life away. All Nature’s face delight to view, As changing seasons come anew; None sees how each revolving year Abridges swiftly man’s career.","person":"Ramāyāna","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 287"},{"day":241,"original":"Look not mournfully into the Past. It comes not back again. Wisely improve the Present. It is thine. Go forth to meet the shadowy Future, without fear, and with a manly heart.","person":"Longfellow","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 326"},{"day":242,"original":"Beside the streamlet seated, mark how life glides on: That sign, how swift each moment goes, to me’s enough. Behold this world’s delights, and view its various pains: If not to you, the joy it shows to me’s enough.","person":"Hāfiz","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 365"},{"day":243,"original":"We deliberate about the parcels of life, but not about life itself, and so we arrive all unawares at its different epochs, and have the trouble of beginning all again. And so finally it is that we do not walk as men confidently towards death, but let death come suddenly upon us.","person":"Seneca","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 461"},{"day":244,"original":"Hark! here the sound of lute so sweet, And there the voice of wailing loud; Here scholars grave in conclave meet, There howls the brawling drunken crowd; Here, charming maidens full of glee, There, tottering, withered dames we see. Such light! Such shade! I cannot tell, If here we live in heaven or hell.","person":"Bhartrihari","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 502"},{"day":245,"original":"All love, at first, like generous wine, Ferments and frets until ’tis fine; But when ’tis settled on the lee, And from th’ impurer matter free, Becomes the richer still the older, And proves the pleasanter the colder.","person":"Butler","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 314"},{"day":246,"original":"In all that belongs to man you cannot find a greater wonder than memory. What a treasury of all things! What a record! What a journal of all! As if provident Nature, because she would have man circumspect, had furnished him with an account-book, to carry always with him. Yet it neither burthens nor takes up room.","person":"Feltham","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 414"},{"day":247,"original":"Depend not on another, rather lean Upon thyself; trust to thine own exertions: Subjection to another’s will gives pain; True happiness consists in self-reliance.","person":"Manu","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 115"},{"day":248,"original":"The shadows of the mind are like those of the body. In the morning of life they all lie behind us, at noon we trample them under foot, and in the evening they stretch long, broad, and deepening before us.","person":"Longfellow","theme":"健康・生活","gist":"生活を良くする時は、まず無理のない習慣から。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 226"},{"day":249,"original":"A vacant mind is open to all suggestions, as the hollow mountain returns all sounds.","person":"Chinese","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 229"},{"day":250,"original":"The mind alike, Vigorous or weak, is capable of culture, But still bears fruit according to its nature. ’Tis not the teacher’s skill that rears the scholar: The sparkling gem gives back the glorious radiance It drinks from other light, but the dull earth Absorbs the blaze, and yields no gleam again.","person":"Bhavabhūti","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 270"},{"day":251,"original":"It is good to tame the mind, which is difficult to hold in, and flighty, rushing wheresoever it listeth: a tamed mind brings blessings.","person":"Dhammapada","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 279"},{"day":252,"original":"Love of money is the disease which renders us most pitiful and grovelling, and love of pleasure is that which renders us most despicable.","person":"Longinus","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 188"},{"day":253,"original":"Lost money is bewailed with deeper sighs Than friends, or kindred, and with louder cries.","person":"Juvenal","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 190"},{"day":254,"original":"All property which comes to hand by means of violence, or infamy, or baseness, however large it may be, is tainted and unblest. On the other hand, whatever is obtained by honest profit, small though it be, brings a blessing with it.[17]","person":"Akhlak-i-Jalālī","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 368"},{"day":255,"original":"If thou be rich, strive to command thy money, lest it command thee.","person":"Quarles","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 573"},{"day":256,"original":"It is easy to lose important opportunities, and difficult to regain them; therefore when they present themselves it is the more necessary to make every effort to retain them.","person":"Guicciardini","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 420"},{"day":257,"original":"Affairs succeed by patience, and he that is hasty falleth headlong.","person":"Sa’dī","theme":"忍耐・継続","gist":"一度の頑張りより、続けられる形を作る。","insight":"継続のコツは、意志を強くすることより、続けやすい大きさにすることです。毎日10分でも、半年続けば大きな量になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 42"},{"day":258,"original":"Be patient, if thou wouldst thy ends accomplish; for like patience is there no appliance effective of success, producing certainly abundant fruit of actions, never damped by failure, conquering all impediments.","person":"Bhāravi","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 118"},{"day":259,"original":"Bootless grief hurts a man’s self, but patience makes a jest of an injury.","person":"R. Chamberlain","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 207"},{"day":260,"original":"Patience is the chiefest fruit of study; a man that strives to make himself different from other men by much reading gains this chiefest good, that in all fortunes he hath something to entertain and comfort himself withal.","person":"Selden","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 476"},{"day":261,"original":"Plans that are wise and prudent in themselves are rendered vain when the execution of them is carried on negligently and with imprudence.","person":"Guicciardini","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 327"},{"day":262,"original":"Let him take heart who does advance, even in the smallest degree.","person":"Plato","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 487"},{"day":263,"original":"Trees loaded with fruit are bent down; the clouds when charged with fresh rain hang down near the earth: even so good men are not uplifted through prosperity. Such is the natural character of the liberal.","person":"Bhartrihari","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 93"},{"day":264,"original":"The man who is in the highest state of prosperity, and who thinks his fortune is most secure, knows not if it will remain unchanged till the evening.","person":"Demosthenes","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 224"},{"day":265,"original":"Enjoy thou the prosperity of others, Although thyself unprosperous; noble men Take pleasure in their neighbours’ happiness.","person":"Mahābhārata","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 350"},{"day":266,"original":"Reason is captive in the hands of the passions, as a weak man in the hands of an artful woman.","person":"Sa’dī","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 14"},{"day":267,"original":"The way to subject all things to thyself is to subject thyself to reason; thou shalt govern many if reason govern thee. Wouldst thou be a monarch of a little world, command thyself.","person":"Quarles","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 299"},{"day":268,"original":"Those who are guided by reason are generally successful in their plans; those who are rash and precipitate seldom enjoy the favour of the gods.","person":"Herodotus","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 559"},{"day":269,"original":"Those men are wise who do not desire the unattainable, who do not love to mourn over what is lost, and are not overwhelmed by calamities.","person":"Mahābhārata","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 486"},{"day":270,"original":"The foolish undertake a trifling act, and soon desist, discouraged; wise men engage in mighty works, and persevere.","person":"Māgha","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 12"},{"day":271,"original":"There is nothing in this world which a resolute man, who exerts himself, cannot attain.","person":"Somadeva","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 263"},{"day":272,"original":"The man who every sacred science knows, Yet has not strength to keep in check the foes That rise within him, mars his Fortune’s fame, And brings her by his feebleness to shame.","person":"Bhāravi","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 280"},{"day":273,"original":"No man learns to know his inmost nature by introspection, for he rates himself sometimes too low, and often too high, by his own measurement. Man knows himself only by comparing himself with other men; it is life that touches his genuine worth.","person":"Goethe","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 152"},{"day":274,"original":"How can we learn to know ourselves? By reflection, never, but by our actions. Attempt to do your duty, and you will immediately find what is in you.","person":"Goethe","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 261"},{"day":275,"original":"Nothing is more becoming a man than silence. It is not the preaching but the practice which ought to be considered as the more important. A profusion of words is sure to lead to error.","person":"Talmud","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 22"},{"day":276,"original":"When thou utterest not a word thou hast laid thy hand upon it; when thou hast uttered it, it hath laid its hand on thee.","person":"Sa’dī","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 180"},{"day":277,"original":"Obstinate silence implies either a mean opinion of ourselves, or a contempt for our company; and it is the more provoking, as others do not know to which of these causes to attribute it—whether humility or pride.","person":"Hazlitt","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 244"},{"day":278,"original":"If with a stranger thou discourse, first learn, By strictest observation, to discern If he be wiser than thyself, if so, Be dumb, and rather choose by him to know; But if thyself perchance the wiser be, Then do thou speak, that he may learn by thee.","person":"Randolph","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 254"},{"day":279,"original":"Give not thy tongue too great a liberty, lest it take thee prisoner. A word unspoken is like thy sword in thy scabbard; if vented, the sword is in another’s hand.[23] If thou desire to be held wise, be so wise as to hold thy tongue.","person":"Quarles","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 438"},{"day":280,"original":"Hast thou not perfect excellence, ’tis best To keep thy tongue in silence, for ’tis this Which shames a man; as lightness does attest The nut is empty, nor of value is.","person":"Sa’dī","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 444"},{"day":281,"original":"Even a blockhead may respect inspire, So long as he is suitably attired; A fool may gain esteem among the wise, So long as he has sense to hold his tongue.","person":"Hitopadesa","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 465"},{"day":282,"original":"First think, and if thy thoughts approve thy will, Then speak, and after, what thou speak’st fulfil.","person":"Randolph","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 474"},{"day":283,"original":"Listen, if you would learn; be silent, if you would be safe.","person":"Arabic","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 556"},{"day":284,"original":"Simplicity of character is the natural result of profound thought.","person":"Hazlitt","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 435"},{"day":285,"original":"A truly great man never puts away the simplicity of a child.[27]","person":"Chinese","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 488"},{"day":286,"original":"In character, in manners, in style, in all things, the supreme excellence is simplicity.","person":"Longfellow","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 568"},{"day":287,"original":"Two sources of success are known: wisdom and effort; make them both thine own, if thou wouldst haply rise.","person":"Māgha","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 183"},{"day":288,"original":"A man should never despise himself, for brilliant success never attends on the man who is contemned by himself.","person":"Mahābhārata","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 578"},{"day":289,"original":"Comprehensive talkers are apt to be tiresome when we are not athirst for information; but, to be quite fair, we must admit that superior reticence is a good deal due to lack of matter. Speech is often barren, but silence also does not necessarily brood over a full nest. Your still fowl, blinking at you without remark, may all the while be sitting on one addled nest-egg; and, when it takes to cackling, will have nothing to announce but that addled delusion.","person":"George Eliot","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 583"},{"day":290,"original":"The sweetest pleasures soonest cloy, And its best flavour temperance gives to joy.","person":"Juvenal
