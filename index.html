let order=[...Array(quotes.length).keys()];
let pos=Math.floor(Math.random()*quotes.length);
let favs=new Set(JSON.parse(localStorage.getItem("quoteFavs")||"[]"));
function current(){return quotes[order[pos]]}
function render(){
 const q=current();
 document.getElementById("quote").textContent=q.text;
 document.getElementById("person").textContent="— "+q.person;
 document.getElementById("cat").textContent=q.category+" ・ 要旨";
 document.getElementById("count").textContent=(pos+1)+" / "+quotes.length;
 document.getElementById("heart").textContent=favs.has(q.id)?"♥":"♡";
 
}
document.getElementById("next").onclick=()=>{pos=(pos+1)%quotes.length;render()};
document.getElementById("random").onclick=()=>{pos=Math.floor(Math.random()*quotes.length);render()};
document.getElementById("heart").onclick=()=>{let id=current().id;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("quoteFavs",JSON.stringify([...favs]));render()};
document.getElementById("share").onclick=async()=>{
 let q=current(), t="「"+q.text+"」\n— "+q.person+"（要旨）";
 if(navigator.share){try{await navigator.share({title:"1000の言葉",text:t})}catch(e){}}
 else{await navigator.clipboard.writeText(t);alert("コピーしました")}
};
document.getElementById("favorites").onclick=()=>{
 let box=document.getElementById("favItems"); box.innerHTML="";
 let arr=quotes.filter(q=>favs.has(q.id));
 box.innerHTML=arr.length?"":"まだお気に入りはありません。";
 arr.forEach(q=>{let d=document.createElement("div");d.className="item";d.innerHTML="<span></span><b></b>";d.querySelector("span").textContent=q.text;d.querySelector("b").textContent="— "+q.person;box.appendChild(d)});
 document.getElementById("list").classList.remove("hidden");
};
document.getElementById("close").onclick=()=>document.getElementById("list").classList.add("hidden");
render();
</script>
