</main><script>
const quotes=[{"id":1,"person":"フランクリン・D・ルーズベルト","text":"恐れるべき唯一のものは、恐れそのものである。","source":"1933年 第1回大統領就任演説"},{"id":2,"person":"フランクリン・D・ルーズベルト","text":"幸福は、所有するお金だけにあるのではない。","source":"1933年 第1回大統領就任演説"},{"id":3,"person":"フランクリン・D・ルーズベルト","text":"行動を、今すぐ行動を。","source":"1933年 第1回大統領就任演説"},{"id":4,"person":"フランクリン・D・ルーズベルト","text":"まず第一にすべきことを、まず行った。","source":"1937年 第2回大統領就任演説"},{"id":5,"person":"フランクリン・D・ルーズベルト","text":"民主主義の未来に絶望する必要はない。","source":"1941年 第3回大統領就任演説"},{"id":6,"person":"フランクリン・D・ルーズベルト","text":"言論と表現の自由を、世界のあらゆる場所に。","source":"1941年 四つの自由 演説"},{"id":7,"person":"フランクリン・D・ルーズベルト","text":"欠乏からの自由を、世界のあらゆる場所に。","source":"1941年 四つの自由 演説"},{"id":8,"person":"フランクリン・D・ルーズベルト","text":"恐怖からの自由を、世界のあらゆる場所に。","source":"1941年 四つの自由 演説"},{"id":9,"person":"ジョン・F・ケネディ","text":"国があなたに何をしてくれるかではなく、あなたが国に何をできるかを問おう。","source":"1961年 大統領就任演説"},{"id":10,"person":"ジョン・F・ケネディ","text":"人類共通の敵は、専制、貧困、病気、そして戦争そのものである。","source":"1961年 大統領就任演説"},{"id":11,"person":"ジョン・F・ケネディ","text":"恐れから交渉してはならない。だが、交渉することを恐れてもならない。","source":"1961年 大統領就任演説"},{"id":12,"person":"ジョン・F・ケネディ","text":"たいまつは新しい世代のアメリカ人へと渡された。","source":"1961年 大統領就任演説"},{"id":13,"person":"ジョン・F・ケネディ","text":"共に、人間の自由のために何ができるかを問おう。","source":"1961年 大統領就任演説"},{"id":14,"person":"エイブラハム・リンカーン","text":"人民の、人民による、人民のための政治を。","source":"1863年 ゲティスバーグ演説"},{"id":15,"person":"エイブラハム・リンカーン","text":"この国は、自由の新たな誕生を迎えなければならない。","source":"1863年 ゲティスバーグ演説"},{"id":16,"person":"エイブラハム・リンカーン","text":"誰にも悪意を抱かず、すべての人に慈愛を。","source":"1865年 第2回大統領就任演説"},{"id":17,"person":"エイブラハム・リンカーン","text":"正しいと神が示すものを見極める確固たる心を持とう。","source":"1865年 第2回大統領就任演説"},{"id":18,"person":"エイブラハム・リンカーン","text":"我々は敵ではなく、友人である。","source":"1861年 第1回大統領就任演説"},{"id":19,"person":"エイブラハム・リンカーン","text":"友情の絆を断ち切ってはならない。","source":"1861年 第1回大統領就任演説"},{"id":20,"person":"ジョージ・ワシントン","text":"政府の基礎は、人々の純粋で不変の原則に置かれるべきだ。","source":"1789年 第1回大統領就任演説"},{"id":21,"person":"ジョージ・ワシントン","text":"自由の聖なる火と共和政の運命は深く結びついている。","source":"1789年 第1回大統領就任演説"},{"id":22,"person":"トーマス・ジェファーソン","text":"我々は皆、共和主義者であり、連邦主義者である。","source":"1801年 第1回大統領就任演説"},{"id":23,"person":"トーマス・ジェファーソン","text":"誤りも、理性が自由に戦える場所では許容されうる。","source":"1801年 第1回大統領就任演説"},{"id":24,"person":"トーマス・ジェファーソン","text":"すべての人に平等で公正な正義を。","source":"1801年 第1回大統領就任演説"},{"id":25,"person":"トーマス・ジェファーソン","text":"平和、通商、そしてすべての国との誠実な友情を。","source":"1801年 第1回大統領就任演説"},{"id":26,"person":"セオドア・ルーズベルト","text":"多くを与えられた者には、多くが求められる。","source":"1905年 大統領就任演説"},{"id":27,"person":"セオドア・ルーズベルト","text":"人生は大きな特権であると同時に、大きな責任でもある。","source":"1905年 大統領就任演説"},{"id":28,"person":"ウッドロウ・ウィルソン","text":"これは回顧の時ではない。","source":"1917年 第2回大統領就任演説"},{"id":29,"person":"ウッドロウ・ウィルソン","text":"今こそ現在と近い未来について語る時である。","source":"1917年 第2回大統領就任演説"},{"id":30,"person":"カルビン・クーリッジ","text":"我々は過去の経験から学ばなければならない。","source":"1925年 大統領就任演説"},{"id":31,"person":"ハーバート・フーバー","text":"進歩は恐れからではなく、信念から生まれる。","source":"1929年 大統領就任演説"},{"id":32,"person":"ハリー・S・トルーマン","text":"民主主義は、人間が善良で理性的に生きられるという信念に基づく。","source":"1949年 大統領就任演説"},{"id":33,"person":"ドワイト・D・アイゼンハワー","text":"自由には、自由な人々の協力が必要である。","source":"1953年 第1回大統領就任演説"},{"id":34,"person":"ドワイト・D・アイゼンハワー","text":"平和への希望を失ってはならない。","source":"1957年 第2回大統領就任演説"},{"id":35,"person":"リンドン・B・ジョンソン","text":"正義には勇気が必要である。","source":"1965年 大統領就任演説"},{"id":36,"person":"リチャード・ニクソン","text":"歴史の一瞬一瞬は、かけがえのない時間である。","source":"1969年 第1回大統領就任演説"},{"id":37,"person":"リチャード・ニクソン","text":"残る暗闇を呪うのではなく、光を集めよう。","source":"1969年 第1回大統領就任演説"},{"id":38,"person":"リチャード・ニクソン","text":"我々の運命は星ではなく、この地球上にある。","source":"1969年 第1回大統領就任演説"},{"id":39,"person":"リチャード・ニクソン","text":"絶望ではなく、機会をつかもう。","source":"1969年 第1回大統領就任演説"},{"id":40,"person":"ジミー・カーター","text":"変わりゆく時代に適応しながら、変わらぬ原則を守らなければならない。","source":"1977年 大統領就任演説で恩師Julia Colemanの言葉を引用"},{"id":41,"person":"ジミー・カーター","text":"新しい精神を生み出せるのは、国民だけである。","source":"1977年 大統領就任演説"},{"id":42,"person":"ロナルド・レーガン","text":"政府は問題の解決策ではない。政府こそ問題なのだ。","source":"1981年 第1回大統領就任演説"},{"id":43,"person":"ロナルド・レーガン","text":"我々は今日から、新たに始める。","source":"1981年 第1回大統領就任演説"},{"id":44,"person":"ロナルド・レーガン","text":"自由は、選ばれた少数だけの特権ではない。","source":"1985年 第2回大統領就任演説"},{"id":45,"person":"ジョージ・H・W・ブッシュ","text":"自由は機能する。","source":"1989年 大統領就任演説"},{"id":46,"person":"ジョージ・H・W・ブッシュ","text":"自由は正しい。","source":"1989年 大統領就任演説"},{"id":47,"person":"ジョージ・H・W・ブッシュ","text":"重要なことでは団結を、すべてのことでは寛容を。","source":"1989年 大統領就任演説で引用"},{"id":48,"person":"ビル・クリントン","text":"我々の民主主義を永遠に若々しく保たなければならない。","source":"1997年 第2回大統領就任演説"},{"id":49,"person":"ビル・クリントン","text":"新しい世紀の挑戦へ目を上げよう。","source":"1997年 第2回大統領就任演説"},{"id":50,"person":"ジョージ・W・ブッシュ","text":"誰も取るに足らない人間として生まれてくるわけではない。","source":"2001年 第1回大統領就任演説"},{"id":51,"person":"ジョージ・W・ブッシュ","text":"自由と民主主義への信念は、人類に生まれつき備わる希望である。","source":"2001年 第1回大統領就任演説"},{"id":52,"person":"バラク・オバマ","text":"我々を結びつけるのは、自由と平等という理念への忠誠である。","source":"2013年 第2回大統領就任演説"},{"id":53,"person":"バラク・オバマ","text":"我々の旅はまだ終わっていない。","source":"2013年 第2回大統領就任演説"},{"id":54,"person":"バラク・オバマ","text":"歴史が教えるのは、変化は避けられないということだ。","source":"2009年 第1回大統領就任演説"},{"id":55,"person":"ベンジャミン・フランクリン","text":"準備に失敗することは、失敗する準備をすることだ。","source":"フランクリンに伝統的に帰される言葉"},{"id":56,"person":"ベンジャミン・フランクリン","text":"時は金なり。","source":"Advice to a Young Tradesman, 1748"},{"id":57,"person":"ベンジャミン・フランクリン","text":"知識への投資は、最高の利息を生む。","source":"Poor Richard系の格言として伝承"},{"id":58,"person":"パトリック・ヘンリー","text":"自由を与えよ、さもなくば死を。","source":"1775年 バージニア会議演説"},{"id":59,"person":"ネイサン・ヘイル","text":"祖国のために捧げる命が一つしかないことが残念だ。","source":"1776年 処刑前の言葉として伝承"},{"id":60,"person":"デカルト","text":"我思う、ゆえに我あり。","source":"方法序説, 1637"},{"id":61,"person":"フランシス・ベーコン","text":"知識そのものが力である。","source":"Meditationes Sacrae, 1597"},{"id":62,"person":"アレクサンダー・ポープ","text":"過ちは人の常、許すは神の業。","source":"An Essay on Criticism, 1711"},{"id":63,"person":"シェイクスピア","text":"何よりもまず、自分自身に忠実であれ。","source":"ハムレット 第1幕第3場"},{"id":64,"person":"シェイクスピア","text":"簡潔さは知恵の魂である。","source":"ハムレット 第2幕第2場"},{"id":65,"person":"シェイクスピア","text":"世の中は舞台、男も女もみな役者。","source":"お気に召すまま 第2幕第7場"},{"id":66,"person":"シェイクスピア","text":"臆病者は死ぬまでに何度も死ぬ。","source":"ジュリアス・シーザー 第2幕第2場"},{"id":67,"person":"シェイクスピア","text":"名前に何があるというのか。","source":"ロミオとジュリエット 第2幕第2場"},{"id":68,"person":"シェイクスピア","text":"輝くものすべてが金とは限らない。","source":"ヴェニスの商人 第2幕第7場"},{"id":69,"person":"シェイクスピア","text":"生きるべきか、死ぬべきか、それが問題だ。","source":"ハムレット 第3幕第1場"},{"id":70,"person":"シェイクスピア","text":"愛は目ではなく、心で見る。","source":"夏の夜の夢 第1幕第1場"},{"id":71,"person":"シェイクスピア","text":"過ぎたことは序章にすぎない。","source":"テンペスト 第2幕第1場"},{"id":72,"person":"シェイクスピア","text":"不幸には仲間がいると慰めになる。","source":"リア王 第3幕第6場"},{"id":73,"person":"ジョン・ミルトン","text":"心はそれ自体で一つの場所である。","source":"失楽園 第1巻"},{"id":74,"person":"ジョン・ミルトン","text":"待って仕える者もまた、仕えている。","source":"On His Blindness"},{"id":75,"person":"アレクサンダー・ポープ","text":"少しの学問は危険なものだ。","source":"An Essay on Criticism, 1711"},{"id":76,"person":"アレクサンダー・ポープ","text":"希望は人の胸に永遠に湧き出る。","source":"An Essay on Man, 1733-34"},{"id":77,"person":"サミュエル・ジョンソン","text":"好奇心は、活発な知性の永久的な特徴の一つだ。","source":"The Rambler"},{"id":78,"person":"エドマンド・バーク","text":"悪が勝利するために必要なのは、善人が何もしないことだけだ。","source":"バークに広く帰される言葉（原典には異論あり）"},{"id":79,"person":"トーマス・ペイン","text":"これこそ、人の魂が試される時だ。","source":"The American Crisis, 1776"},{"id":80,"person":"トーマス・ペイン","text":"世界をもう一度始める力が、我々にはある。","source":"Common Sense, 1776"},{"id":81,"person":"ラルフ・ワルド・エマーソン","text":"自分自身を信じよ。","source":"Self-Reliance, 1841"},{"id":82,"person":"ラルフ・ワルド・エマーソン","text":"自然の歩調を取り入れよ。その秘密は忍耐である。","source":"Essays: First Series, Nature"},{"id":83,"person":"ヘンリー・デイヴィッド・ソロー","text":"私は意図的に生きるために森へ行った。","source":"ウォールデン, 1854"},{"id":84,"person":"ヘンリー・デイヴィッド・ソロー","text":"人生を単純に、単純に、単純にせよ。","source":"ウォールデン, 1854"},{"id":85,"person":"ヘンリー・デイヴィッド・ソロー","text":"夢の方向へ自信を持って進め。","source":"ウォールデン, 1854"},{"id":86,"person":"ウォルト・ホイットマン","text":"私は大きい。私は多くのものを内に含んでいる。","source":"Song of Myself"},{"id":87,"person":"チャールズ・ディケンズ","text":"最良の時代であり、最悪の時代でもあった。","source":"二都物語, 1859"},{"id":88,"person":"チャールズ・ディケンズ","text":"誰の心も軽くする者は、この世で無駄に生きてはいない。","source":"Our Mutual Friend"},{"id":89,"person":"ジェーン・オースティン","text":"虚栄と誇りは別のものだ。","source":"高慢と偏見, 1813"},{"id":90,"person":"オスカー・ワイルド","text":"経験とは、誰もが自分の過ちにつける名前である。","source":"Lady Windermere's Fan, 1892"},{"id":91,"person":"オスカー・ワイルド","text":"自分らしくあれ。他の人はすでに誰かがやっている。","source":"ワイルドに広く帰される言葉"},{"id":92,"person":"マーク・トウェイン","text":"真実は小説より奇なり。","source":"Following the Equator, 1897"},{"id":93,"person":"マーク・トウェイン","text":"勇気とは恐怖への抵抗であり、恐怖の克服である。","source":"Pudd'nhead Wilson, 1894"},{"id":94,"person":"ルイス・キャロル","text":"昨日に戻っても意味がない。昨日の私は別の人間だった。","source":"不思議の国のアリス, 1865"},{"id":95,"person":"ウィリアム・ワーズワース","text":"子どもは大人の父である。","source":"My Heart Leaps Up, 1802"},{"id":96,"person":"ジョン・キーツ","text":"美は真、真は美。","source":"Ode on a Grecian Urn, 1819"},{"id":97,"person":"パーシー・ビッシュ・シェリー","text":"冬が来たなら、春が遠いはずがあろうか。","source":"Ode to the West Wind, 1820"},{"id":98,"person":"ロバート・フロスト","text":"森の中で二つの道に分かれていた。","source":"The Road Not Taken, 1915"},{"id":99,"person":"ウィリアム・ブレイク","text":"一粒の砂に世界を見る。","source":"Auguries of Innocence"},{"id":100,"person":"ジョージ・エリオット","text":"なれたかもしれない自分になるのに、遅すぎることはない。","source":"エリオットに広く帰される言葉"}]; let pos=Math.floor(Math.random()*quotes.length);
