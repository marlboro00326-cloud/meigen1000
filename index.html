<style>
*{box-sizing:border-box}
:root{--bg:#09101e;--bg2:#172442;--text:#fff;--muted:#aeb8d0;--panel:rgba(255,255,255,.08);}
body{margin:0;background:linear-gradient(155deg,var(--bg),var(--bg2));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));max-width:760px;margin:auto}
header{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}

.theme{font-size:12px;color:var(--muted);margin-bottom:14px}
.original{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.55;font-weight:600}

.gist{margin-top:17px;font-size:21px;line-height:1.55;font-weight:750}
.insight{margin-top:17px;padding:18px;background:rgba(255,255,255,.07);border-radius:20px;line-height:1.75;font-size:16px}
.insight b{display:block;margin-bottom:7px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button{border:0;border-radius:16px;padding:15px 10px;font-size:15px;font-weight:750;background:#f2f5ff;color:#11182b;-webkit-tap-highlight-color:transparent}
button.secondary{background:rgba(255,255,255,.12);color:#fff}
.note{font-size:11px;color:#8490aa;line-height:1.55;margin:15px 3px 0}
#favList{position:fixed;inset:0;background:#0b1020;z-index:10;overflow:auto;padding:max(22px,env(safe-area-inset-top)) 18px max(25px,env(safe-area-inset-bottom));display:none}
#favList.open{display:block}
.fav-item{padding:17px 2px;border-bottom:1px solid rgba(255,255,255,.12);line-height:1.55}

.close{position:sticky;top:0;float:right;width:auto;background:#fff;color:#11182b;padding:10px 14px}

<script>
const quotes=[{"day":1,"source_no":8,"original":"In the hour of adversity be not without hope, for crystal rain falls from black clouds.","person":"Nizāmī","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 8"},{"day":2,"source_no":30,"original":"In the height of thy prosperity expect adversity, but fear it not. If it come not, thou art the more sweetly possessed of the happiness thou hast, and the more strongly confirmed. If it come, thou art the more gently dispossessed of the happiness thou hadst, and the more firmly prepared.","person":"Quarles","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 30"},{"day":3,"source_no":57,"original":"In this thing one man is superior to another, that he is better able to bear adversity and prosperity.","person":"Philemon","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 57"},{"day":4,"source_no":78,"original":"Circumspection in calamity; mercy in greatness; good speeches in assemblies; fortitude in adversity: these are the self-attained perfections of great souls.","person":"Hitopadesa","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 78"},{"day":5,"source_no":175,"original":"Assume in adversity a countenance of prosperity, and in prosperity moderate thy temper.","person":"Livy","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 175"},{"day":6,"source_no":184,"original":"The worse the ill that fate on noble souls Inflicts, the more their firmness; and they arm Their spirits with adamant to meet the blow.","person":"Hindu Drama","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 184"},{"day":7,"source_no":185,"original":"Opportunities lose not, for all delay is madness; ’Mid bitter sorrow patience show, for ’tis the key of gladness.","person":"Turkish","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 185"},{"day":8,"source_no":330,"original":"As gold is tried by the furnace, and the baser metal shown, so the hollow-hearted friend is known by adversity.","person":"Metastasio","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 330"},{"day":9,"source_no":366,"original":"The lake no longer water holds— Off fly the fowls, the lilies stay: If friends are friends when wealth is gone, The lily’s constancy they share.","person":"Hindu Poetess","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 366"},{"day":10,"source_no":393,"original":"Seest thou good days? Prepare for evil times. No summer but hath its winter. He never reaped comfort in adversity that sowed not in prosperity.","person":"Quarles","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 393"},{"day":11,"source_no":477,"original":"Friendship throws a greater lustre on prosperity, while it lightens adversity by sharing in its griefs and troubles.","person":"Cicero","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 477"},{"day":12,"source_no":82,"original":"As drops of bitter medicine, though minute, may have a salutary force, so words, though few and painful, uttered seasonably, may rouse the prostrate energies of those who meet misfortune with despondency.","person":"Bhāravi","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 82"},{"day":13,"source_no":172,"original":"The man who listens not to the words of affectionate friends will give joy in the time of distress to his enemies.","person":"Hitopadesa","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 172"},{"day":14,"source_no":193,"original":"To address a judicious remark to a thoughtless man is a mere threshing of chaff.","person":"Hitopadesa","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 193"},{"day":15,"source_no":443,"original":"Skill in advising others is easily attained by men; but to practise righteousness themselves is what only a few can succeed in doing.","person":"Hitopadesa","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 443"},{"day":16,"source_no":117,"original":"Anger that has no limit causes terror, and unseasonable kindness does away with respect. Be not so severe as to cause disgust, nor so lenient as to make people presume.","person":"Sa’dī","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 117"},{"day":17,"source_no":119,"original":"As rain breaks through an ill-thatched house, passion breaks through an unreflecting mind.","person":"Dhammapada","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"感情を抑え込むのではなく、『今、自分は怒っている』と認識するだけでも一歩引いて見られます。感情と行動を分ける練習です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 119"},{"day":18,"source_no":130,"original":"If thou desirest that the pure in heart should praise thee, lay aside anger; be not a man of many words; and parade not thy virtues in the face of others.","person":"Firdausī","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 130"},{"day":19,"source_no":298,"original":"Do not anxiously expect what is not yet come; do not vainly regret what is already past.","person":"Chinese","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"時間はお金と違って取り戻せません。何となく使っている時間を少しだけ、本当に大切な人・仕事・楽しみに移すと、生活の満足度は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 298"},{"day":20,"source_no":383,"original":"Set about whatever you intend to do; the beginning is half the battle.","person":"Ausonius","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 383"},{"day":21,"source_no":564,"original":"Scratch yourself with your own nails; always do your own business, and when you intend asking for a service, go to a person who can appreciate your merit.","person":"Arabic","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 564"},{"day":22,"source_no":361,"original":"Vociferation and calmness of character seldom meet in the same person.","person":"Lavater","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 361"},{"day":23,"source_no":160,"original":"Never does a man portray his own character more vividly than in his manner of portraying another.","person":"Richter","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 160"},{"day":24,"source_no":94,"original":"The man who neither gives in charity nor enjoys his wealth, which every day increases, breathes, indeed, like the bellows of a smith, but cannot be said to live.","person":"Hitopadesa","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 94"},{"day":25,"source_no":302,"original":"Whoever brings cheerfulness to his work, and is ever active, dashes through the world’s labours.","person":"Tieck","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 302"},{"day":26,"source_no":391,"original":"There is nothing more beautiful than cheerfulness in an old face, and among country people it is always a sign of a well-regulated life.","person":"Richter","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 391"},{"day":27,"source_no":268,"original":"All confidence is dangerous unless it is complete; there are few circumstances in which it is not better either to hide all or to tell all.","person":"La Bruyère","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 268"},{"day":28,"source_no":10,"original":"I asked an experienced elder who had profited by his knowledge of the world, “What course should I pursue to obtain prosperity?” He replied, “Contentment—if you are able, practise contentment.”","person":"Selman","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 10"},{"day":29,"source_no":52,"original":"Health is the greatest gift, contentedness the best riches.","person":"Dhammapada","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 52"},{"day":30,"source_no":101,"original":"Contentment consisteth not in heaping more fuel, but in taking away some fire.","person":"Fuller","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 101"},{"day":31,"source_no":135,"original":"There are no riches like the sweetness of content, nor poverty comparable to the want of patience.","person":"R. Chamberlain","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 135"},{"day":32,"source_no":334,"original":"The fountain of content must spring up in the mind, and he who has so little knowledge of human nature as to seek happiness by changing anything but his own disposition will waste his life in fruitless efforts, and multiply the griefs which he purposes to remove.","person":"Johnson","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 334"},{"day":33,"source_no":471,"original":"Men are not rich or poor according to what they possess but to what they desire. The only rich man is he that with content enjoys a competence.","person":"R. Chamberlain","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"お金は貯めるだけでも、使うだけでもありません。将来の安心と今の経験の両方に配分する視点を持つと、豊かさを実感しやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 471"},{"day":34,"source_no":538,"original":"It is resignation and contentment that are best calculated to lead us safely through life. Whoever has not sufficient power to endure privations, and even suffering, can never feel that he is armour-proof against painful emotions; nay, he must attribute to himself, or at least to the morbid sensitiveness of his nature, every disagreeable feeling he may suffer.","person":"Von Humboldt","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 538"},{"day":35,"source_no":71,"original":"In conversation humour is more than wit, easiness, more than knowledge; few desire to learn, or to think they need it; all desire to be pleased, or, if not, to be easy.","person":"Sir W. Temple","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 71"},{"day":36,"source_no":189,"original":"He who labours diligently need never despair. We can accomplish every thing by diligence and labour.","person":"Menander","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 189"},{"day":37,"source_no":428,"original":"There is nothing more operative than sedulity and diligence. A man would wonder at the mighty things which have been done by degrees and gentle augmentations. Diligence and moderation are the best steps whereby to climb to any excellence, nay, it is rare that there is any other other way.","person":"Feltham","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 428"},{"day":38,"source_no":7,"original":"We in reality only know when we doubt a little. With knowledge comes doubt.","person":"Goethe","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 7"},{"day":39,"source_no":348,"original":"Education and morals will be found almost the whole that goes to make a good man.","person":"Aristotle","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 348"},{"day":40,"source_no":95,"original":"That energy which veils itself in mildness is most effective of its object.","person":"Māgha","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 95"},{"day":41,"source_no":149,"original":"Whate’er the work a man performs, The most effective aid to its completion— The most prolific source of true success— Is energy, without despondency.","person":"Ramāyāna","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 149"},{"day":42,"source_no":124,"original":"To be envied is a nobler fate than to be pitied.","person":"Pindar","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 124"},{"day":43,"source_no":168,"original":"In some dispositions there is such an envious kind of pride that they cannot endure that any but themselves should be set forth as excellent; so that when they hear one justly praised they will either openly detract from his virtues; or, if those virtues be, like a clear and shining light, eminent and distinguished, so that he cannot be safely traduced by the tongue, they will then raise a suspicion against him by a mysterious silence, as if there were something remaining to be told which overclouded even his brightest glory.","person":"Feltham","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 168"},{"day":44,"source_no":271,"original":"One man envies the success in life of another, and hates him in secret; nor is he willing to give him good advice when he is consulted, except it be by some wonderful effort of good feeling, and there are, alas, few such men in the world. A real friend, on the other hand, exults in his friend’s happiness, rejoices in all his joys, and is ready to afford him the best advice.","person":"Herodotus","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 271"},{"day":45,"source_no":343,"original":"Very distasteful is excessive fame To the sour palate of the envious mind, Who hears with grief his neighbours good by name, And hates the fortune that he ne’er shall find.","person":"Pindar","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 343"},{"day":46,"source_no":375,"original":"It is the usual consolation of the envious, if they cannot maintain their superiority, to represent those by whom they are surpassed as inferior to some one else.","person":"Plutarch","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"人生全体の正解を一度に決める必要はありません。今日の選択を一つ良くすることを積み重ねれば、方向は少しずつ変わっていきます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 375"},{"day":47,"source_no":525,"original":"Envy is a vice that would pose a man to tell what it should be liked for. Other vices we assume for that we falsely suppose they bring us either pleasure, profit, or honour. But in envy who is it can find any of these? Instead of pleasure, we vex and gall ourselves. Like cankered brass, it only eats itself, nay, discolours and renders it noisome. When some one told Agis that those of his neighbour’s family did envy him, “Why, then,” says he, “they have a double vexation—one, with their own evil, the other, at my prosperity.”","person":"Feltham","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 525"},{"day":48,"source_no":36,"original":"Human experience, like the stern-lights of a ship at sea, illumines only the path which we have passed over.","person":"Coleridge","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 36"},{"day":49,"source_no":20,"original":"In no wise ask about the faults of others, for he who reporteth the faults of others will report thine also.","person":"Firdausī","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 20"},{"day":50,"source_no":39,"original":"Men soon the faults of others learn, A few their virtues, too, find out; But is there one—I have a doubt— Who can his own defects discern?","person":"Sanskrit","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 39"},{"day":51,"source_no":41,"original":"Mention not a blemish which is thy own in detraction of a neighbour.","person":"Talmud","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 41"},{"day":52,"source_no":198,"original":"We rather confess our moral errors, faults, and crimes than our ignorance.","person":"Goethe","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 198"},{"day":53,"source_no":219,"original":"An evil-minded man is quick to see His neighbour’s faults, though small as mustard seed; But when he turns his eyes towards his own, Though large as _bilva_ fruit, he none descries.","person":"Mahābhārata","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 219"},{"day":54,"source_no":269,"original":"It is well that there is no one without a fault, for he would not have a friend in the world: he would seem to belong to a different species.","person":"Hazlitt","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 269"},{"day":55,"source_no":347,"original":"The faults of others are easily perceived, but those of oneself are difficult to perceive; a man winnows his neighbour’s faults like chaff, but his own fault he hides as a cheat hides the false dice from the gamester.","person":"Dhammapada","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 347"},{"day":56,"source_no":329,"original":"Hath any wronged thee, be bravely revenged. Slight it, and the work’s begun; forgive it, and ’tis finished. He is below himself that is not above an injury.","person":"Quarles","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 329"},{"day":57,"source_no":344,"original":"A more glorious victory cannot be gained over another man than this, that when the injury began on his part the kindness should begin on ours.","person":"Tillotson","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 344"},{"day":58,"source_no":56,"original":"Good fortune is a benefit to the wise, but a curse to the foolish.","person":"Chinese","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 56"},{"day":59,"source_no":173,"original":"It is a proverbial expression that every man is the maker of his own fortune, and we usually regard it as implying that every man by his folly or wisdom prepares good or evil for himself. But we may view it in another light, namely, that we may so accommodate ourselves to the dispositions of Providence as to be happy in our lot, whatever may be its privations.","person":"Von Humboldt","theme":"怒り・感情","gist":"感情に任せて決めず、少し時間を置く。","insight":"感情を抑え込むのではなく、『今、自分は怒っている』と認識するだけでも一歩引いて見られます。感情と行動を分ける練習です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 173"},{"day":60,"source_no":233,"original":"I have often thought that the cause of men’s good or ill fortune depends on whether they make their actions fit with the times. A man having prospered by one mode of acting can never be persuaded that it may be well for him to act differently, whence it is that a man’s Fortune varies, because she changes her times and he does not his ways.","person":"Machiavelli","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 233"},{"day":61,"source_no":249,"original":"The potter forms what he pleases with soft clay, so a man accomplishes his works by his own act.","person":"Hitopadesa","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 249"},{"day":62,"source_no":262,"original":"Man is supreme lord and master Of his own ruin and disaster, Controls his fate, but nothing less In ordering his own happiness: For all his care and providence Is too feeble a defence To render it secure and certain Against the injuries of Fortune; And oft, in spite of all his wit, Is lost by one unlucky hit, And ruined with a circumstance, And mere punctilio of a chance.","person":"Butler","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 262"},{"day":63,"source_no":276,"original":"A day of fortune is like a harvest-day, we must be busy when the corn is ripe.","person":"Goethe","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 276"},{"day":64,"source_no":536,"original":"There is nothing keeps longer than a middling fortune, and nothing melts away sooner than a great one. Poverty treads upon the heels of great and unexpected riches.","person":"La Bruyère","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 536"},{"day":65,"source_no":552,"original":"Lament not Fortune’s mutability, And seize her fickle favours ere they flee; If others never mourned departed bliss, How should a turn of Fortune come to thee?","person":"Omar Khayyām","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 552"},{"day":66,"source_no":16,"original":"The son who delights his father by his good actions; the wife who seeks only her husband’s good; the friend who is the same in prosperity and adversity—these three things are the reward of virtue.","person":"Bhartrihari","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 16"},{"day":67,"source_no":98,"original":"There is not half so much danger in the desperate sword of a known foe as in the smooth insinuations of a pretended friend.","person":"R. Chamberlain","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 98"},{"day":68,"source_no":174,"original":"Be very circumspect in the choice of thy company. In the society of thy equals thou shalt enjoy more pleasure; in the society of thy superiors thou shalt find more profit. To be the best of the company is the way to grow worse; the best means to grow better is to be the worst there.","person":"Quarles","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 174"},{"day":69,"source_no":432,"original":"It is not easy to stop the fire when the water is at a distance; friends at hand are better than relations afar off.","person":"Chinese","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 432"},{"day":70,"source_no":458,"original":"In poverty and other misfortunes of life men think friends to be their only refuge. The young they keep out of mischief, to the old they are a comfort and aid in their weakness, and those in the prime of life they incite to noble deeds.","person":"Aristotle","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 458"},{"day":71,"source_no":478,"original":"There is nothing more becoming a wise man than to make choice of friends, for by them thou shalt be judged what thou art. Let them therefore be wise and virtuous, and none of those that follow thee for gain; but make election rather of thy betters than thy inferiors; shunning always such as are poor and needy, for if thou givest twenty gifts and refuse to do the like but once, all that thou hast done will be lost, and such men will become thy mortal enemies.","person":"Sir W. Raleigh, to his Son","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 478"},{"day":72,"source_no":496,"original":"An absent friend gives us friendly company when we are well assured of his happiness.","person":"Goethe","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 496"},{"day":73,"source_no":544,"original":"Eschew that friend, if thou art wise, who consorts with thy enemies.","person":"Sa’dī","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 544"},{"day":74,"source_no":547,"original":"If thou shouldst find thy friend in the wrong reprove him secretly, but in the presence of company praise him.","person":"Arabic","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 547"},{"day":75,"source_no":588,"original":"E’en as a traveller, meeting with the shade Of some o’erhanging tree, awhile reposes, Then leaves its shelter to pursue his way, So men meet friends, then part with them for ever.","person":"Hitopadesa","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 588"},{"day":76,"source_no":24,"original":"The friendship of the bad is like the shade of some precipitous bank with crumbling sides, which, falling, buries him who is beneath.","person":"Bhāravi","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 24"},{"day":77,"source_no":116,"original":"If the friendship of the good be interrupted, their minds admit of no long change; as when the stalks of a lotus are broken the filaments within them are more visibly cemented.","person":"Hitopadesa","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 116"},{"day":78,"source_no":309,"original":"The friendships formed between good and evil men differ. The friendship of the good, at first faint like the morning light, continually increases; the friendship of the evil at the very beginning is like the light of midday, and dies away like the light of evening.[13]","person":"Bhartrihari","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 309"},{"day":79,"source_no":346,"original":"Were all thy fond endeavours vain To chase away the sufferer’s smart, Still hover near, lest absence pain His lonely heart. For friendship’s tones have kindlier power Than odorous fruit, or nectared bowl, To soothe, in sorrow’s languid hour, The sinking soul.","person":"Sa’dī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 346"},{"day":80,"source_no":316,"original":"Frugality should ever be practised, but not excessive parsimony.","person":"Hitopadesa","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 316"},{"day":81,"source_no":140,"original":"Be thou generous, and gentle, and forgiving; as God hath scattered upon thee, scatter thou upon others.","person":"Sa’dī","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 140"},{"day":82,"source_no":110,"original":"To exert his power in doing good is man’s most glorious task.","person":"Sophocles","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"準備を続けることは大切ですが、実際に始めなければ何も変わりません。5分だけ、1ページだけ、1件だけでも動くと、次の行動はずっと楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 110"},{"day":83,"source_no":136,"original":"’Tis not for gain, for fame, from fear That righteous men injustice shun, And virtuous men hold virtue dear: An inward voice they seem to hear, Which tells them duty must be done.","person":"Mahābhārata","theme":"誠実・善行","gist":"誠実さは、長い目で見ると最も強い信用になる。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 136"},{"day":84,"source_no":137,"original":"As far and wide the vernal breeze Sweet odours waft from blooming trees, So, too, the grateful savour spreads To distant lands of virtuous deeds.","person":"Sanskrit","theme":"人生","gist":"完璧な状況を待たず、今の条件でできることを探す。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 137"},{"day":85,"source_no":145,"original":"Good actions lead to success, as good medicines to a cure: a healthy man is joyful, and a diligent man attains learning; a just man gains the reward of his virtue.","person":"Hitopadesa","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 145"},{"day":86,"source_no":209,"original":"Just as the track of birds that cleave the air Is not discovered, nor yet the path of fish That skim the water, so the course of those Who do good actions is not always seen.","person":"Mahābhārata","theme":"行動・挑戦","gist":"考えるだけで終わらせず、小さくても始める。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 209"},{"day":87,"source_no":73,"original":"We may be as good as we please, if we please to be good.","person":"Barrow","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"短期的にはごまかした方が得に見える場面もありますが、長期では信用の差が大きくなります。誠実さは時間をかけて効いてくる資産です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 73"},{"day":88,"source_no":153,"original":"Increase in goodness as long as thou art here, that, when thou departest, in that thou mayest still be joyful. According to our words and deeds in this life will be the remembrance of us in the world.","person":"Firdausī","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 153"},{"day":89,"source_no":238,"original":"Whosoever does not persecute them that persecute him; whosoever takes an offence in silence; he who does good because of love; he who is cheerful under his sufferings—these are the friends of God, and of them the Scripture says, “They shall shine forth like the sun at noontide.”","person":"Talmud","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 238"},{"day":90,"source_no":317,"original":"He who receives a favour must retain a recollection of it for all time to come; but he who confers should at once forget it, if he is not to show a sordid and ungenerous spirit. To remind a man of a kindness conferred on him, and to talk of it, is little different from a reproach.","person":"Demosthenes","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 317"},{"day":91,"source_no":58,"original":"The rays of happiness, like those of light, are colourless when unbroken.","person":"Longfellow","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 58"},{"day":92,"source_no":66,"original":"Wrapt up in error is the human mind, And human bliss is ever insecure; Know we what fortune yet remains behind? Know we how long the present shall endure?","person":"Pindar","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 66"},{"day":93,"source_no":70,"original":"If a man be not so happy as he desires, let this be his comfort—he is not so wretched as he deserves.","person":"R. Chamberlain","theme":"満足・幸福","gist":"足りないものだけでなく、すでにあるものを見る。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 70"},{"day":94,"source_no":187,"original":"The man of affluence is not in fact more happy than the possessor of a bare competency, unless, in addition to his wealth, the end of his life be fortunate. We often see misery dwelling in the midst of splendour, whilst real happiness is found in humbler stations.","person":"Herodotus","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 187"},{"day":95,"source_no":253,"original":"He is happiest, be he king or peasant, who finds peace in his home.","person":"Goethe","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 253"},{"day":96,"source_no":311,"original":"The noble-minded dedicate themselves to the promotion of the happiness of others—even of those who injure them. True happiness consists in making happy.","person":"Bhāravi","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 311"},{"day":97,"source_no":337,"original":"Pleasure, most often delusive, may be born of delusion. Pleasure, herself a sorceress, may pitch her tents on enchanted ground. But happiness (or, to use a more accurate and comprehensive term, solid well-being) can be built on virtue alone, and must of necessity have truth for its foundation.","person":"Coleridge","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 337"},{"day":98,"source_no":363,"original":"Real and solid happiness springs from moderation.","person":"Goethe","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"幸福を大きな出来事だけに求めると、ほとんどの日が『普通の日』になります。食事、睡眠、人との会話など、小さな良さを拾う方が毎日は豊かになります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 363"},{"day":99,"source_no":367,"original":"Let us be well persuaded that everyone of us possesses happiness in proportion to his virtue and wisdom, and according as he acts in obedience to their suggestion.","person":"Aristotle","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 367"},{"day":100,"source_no":406,"original":"What is the most profitable? Fellowship with the good. What is the worst thing in the world? The society of evil men. What is the greatest loss? Failure in one’s duty. Where is the greatest peace? In truth and righteousness. Who is the hero? The man who subdues his senses. Who is the best beloved? The faithful wife. What is wealth? Knowledge. What is the most perfect happiness? Staying at home.","person":"Bhartrihari","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 406"},{"day":101,"source_no":150,"original":"Humility is a virtue all preach, none practise, and yet everybody is content to hear. The master thinks it good doctrine for his servant, the laity for the clergy, and the clergy for the laity.","person":"Selden","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 150"},{"day":102,"source_no":157,"original":"I never yet found pride in a noble nature nor humility in an unworthy mind.","person":"Feltham","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 157"},{"day":103,"source_no":581,"original":"Not to attend at the door of the wealthy, and not to use the voice of petition—these constitute the best life of a man.","person":"Hitopadesa","theme":"お金・豊かさ","gist":"増やすことと同じくらい、使い方を考える。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 581"},{"day":104,"source_no":580,"original":"The man of first rate excellence is virtuous in spite of instruction; he of the middle class is so after instruction; the lowest order of men are vicious in spite of instruction.","person":"Chinese","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 580"},{"day":105,"source_no":259,"original":"To form a judgment intuitively is the privilege of few; authority and example lead the rest of the world. They see with the eyes of others, they hear with the ears of others. Therefore it is very easy to think as all the world now think; but to think as all the world will think thirty years hence is not in the power of every one.","person":"Schopenhauer","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 259"},{"day":106,"source_no":4,"original":"Dost thou desire that thine own heart should not suffer, redeem thou the sufferer from the bonds of misery.","person":"Sa’dī","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 4"},{"day":107,"source_no":5,"original":"To friends and eke to foes true kindness show; No kindly heart unkindly deeds will do; Harshness will alienate a bosom friend. And kindness reconcile a deadly foe.","person":"Omar Khayyām","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 5"},{"day":108,"source_no":54,"original":"Let none with scorn a suppliant meet, Or from the door untended spurn A dog; an outcast kindly treat; And so thou shalt be blest in turn.","person":"Mahābhārata","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 54"},{"day":109,"source_no":92,"original":"The good to others kindness show, And from them no return exact; The best and greatest men, they know, Thus ever nobly love to act.[7]","person":"Mahābhārata","theme":"人間関係","gist":"相手を尊重しつつ、自分の境界線も大切にする。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 92"},{"day":110,"source_no":129,"original":"The pure in heart, who fear to sin, The good, kindly in word and deed— These are the beings in the world Whose nature should be called divine.","person":"Buddhist","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"相手を変えようとすると疲れます。自分の伝え方、距離の取り方、期待の置き方など、自分側で調整できる部分に目を向けると関係が楽になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 129"},{"day":111,"source_no":305,"original":"To bad as well as good, to all, A generous man compassion shows; On earth no mortal lives, he knows, Who does not oft through weakness fall.","person":"Rāmāyana","theme":"怒り・感情","gist":"怒りや不安は自然だが、行動の主導権は渡さない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 305"},{"day":112,"source_no":306,"original":"The good extend their loving care To men, however mean or vile; E’en base Chándálas’[12] dwellings share Th’ impartial sunbeam’s silver smile.","person":"Hitopadesa","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 306"},{"day":113,"source_no":3,"original":"Knowledge is destroyed by associating with the base; with equals equality is gained, and with the distinguished, distinction.","person":"Hitopadesa","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 3"},{"day":114,"source_no":43,"original":"A man who has learnt little grows old like an ox: his flesh grows, but his knowledge does not grow.","person":"Dhammapada","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 43"},{"day":115,"source_no":55,"original":"Choose knowledge, if thou desirest a blessing from the Universal Provider; for the ignorant man cannot raise himself above the earth, and it is by knowledge that thou must render thy soul praiseworthy.","person":"Firdausī","theme":"自分を知る","gist":"自分を過大にも過小にも評価せず、現実を見る。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 55"},{"day":116,"source_no":201,"original":"He that is ambitious of fame destroys it. He that increaseth not his knowledge diminishes it. He that uses the crown of learning as an instrument of gain will pass away.","person":"Talmud","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 201"},{"day":117,"source_no":205,"original":"If thou lackest knowledge, what hast thou then acquired? Hast thou acquired knowledge, what else dost thou want?","person":"Talmud","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 205"},{"day":118,"source_no":218,"original":"Knowledge acquired by a man of low degree places him on a level with a prince, as a small river attains the irremeable ocean; and his fortune is then exalted.","person":"Hitopadesa","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 218"},{"day":119,"source_no":225,"original":"Amongst all possessions knowledge appears pre-eminent. The wise call it supreme riches, because it can never be lost, has no price, and can at no time be destroyed.","person":"Hitopadesa","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 225"},{"day":120,"source_no":286,"original":"Adorn thy mind with knowledge, for knowledge maketh thy worth.","person":"Firdausī","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 286"},{"day":121,"source_no":307,"original":"Let a man accept with confidence valuable knowledge even from a person of low degree, good instruction regarding duty even from a humble man, and a jewel of a wife even from an ignoble family.","person":"Manu","theme":"人間関係","gist":"本当の関係は、順調な時だけでは測れない。","insight":"人間関係は、相手の言葉より困った時の行動に本質が出ることがあります。誰といると自分が穏やかでいられるかも、大切な判断材料です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 307"},{"day":122,"source_no":355,"original":"Perfect ignorance is quiet, perfect knowledge is quiet; not so the transition from the former to the latter.","person":"Carlyle","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 355"},{"day":123,"source_no":275,"original":"He who toils with pain will eat with pleasure.","person":"Chinese","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 275"},{"day":124,"source_no":429,"original":"In sooth, it is a shame to choose rather to be still borrowing in all places, from everybody, than to work and win.","person":"Rabelais","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 429"},{"day":125,"source_no":453,"original":"Rather skin a carcass for pay in the public streets than be idly dependent on charity.","person":"Talmud","theme":"誠実・善行","gist":"小さな善意でも、実際に行動に移すことに意味がある。","insight":"善意は考えるだけでなく、小さくても行動にすると相手へ届きます。感謝を言う、手伝う、約束を守るといった普通の行動が大切です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 453"},{"day":126,"source_no":40,"original":"In learning, age and youth go for nothing; the best informed take the precedence.","person":"Chinese","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 40"},{"day":127,"source_no":143,"original":"A man eminent in learning has not even a little virtue if he fears to practise it. What precious things can be shown to a blind man when he holds a lamp in his hand?","person":"Hitopadesa","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 143"},{"day":128,"source_no":342,"original":"Learning dissipates many doubts, and causes things otherwise invisible to be seen, and is the eye of everyone who is not absolutely blind.","person":"Hitopadesa","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 342"},{"day":129,"source_no":449,"original":"Liberality attended with mild language; learning without pride; valour united with mercy; wealth accompanied with a generous contempt of it—these four qualities are with difficulty acquired.","person":"Hitopadesa","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 449"},{"day":130,"source_no":479,"original":"Learning is like Scanderbeg’s sword, either good or bad according to him who hath it: an excellent weapon, if well used; otherwise, like a sharp razor in the hand of a child.","person":"R. Chamberlain","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 479"},{"day":131,"source_no":491,"original":"He who has more learning than goodness is like a tree with many branches and few roots, which the first wind throws down; whilst he whose works are greater than his knowledge is like a tree with many roots and fewer branches, which all the winds of heaven cannot uproot.","person":"Talmud","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 491"},{"day":132,"source_no":504,"original":"A man of little learning deems that little a great deal; a frog, never having seen the ocean, considers its well a great sea.","person":"Burmese","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 504"},{"day":133,"source_no":509,"original":"Women’s wealth is beauty, learning, that of men.","person":"Burmese","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 509"},{"day":134,"source_no":23,"original":"Consider, and you will find that almost all the transactions of the time of Vespasian differed little from those of the present day. You there find marrying and giving in marriage, educating children, sickness, death, war, joyous holidays, traffic, agriculture, flatterers, insolent pride, suspicions, laying of plots, longing for the death of others, newsmongers, lovers, misers, men canvassing for consulship—yet all these passed away, and are nowhere.","person":"M. Aurelius","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 23"},{"day":135,"source_no":83,"original":"There are three whose life is no life: he who lives at another’s table; he whose wife domineers over him; and he who suffers bodily affliction.","person":"Talmud","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 83"},{"day":136,"source_no":125,"original":"He only does not live in vain Who all the means within his reach Employs—his wealth, his thought, his speech— T’advance the weal of other men.","person":"Sanskrit","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 125"},{"day":137,"source_no":133,"original":"The life of man is the incessant walk of nature, wherein every moment is a step towards death. Even our growing to perfection is a progress to decay. Every thought we have is a sand running out of the glass of life.","person":"Feltham","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 133"},{"day":138,"source_no":144,"original":"The first forty years of our life give the text, the next thirty furnish the commentary upon it, which enables us rightly to understand the true meaning and connection of the text with its moral and its beauties.","person":"Schopenhauer","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 144"},{"day":139,"source_no":235,"original":"Whilom, ere youth’s conceit had waned, methought Answers to all life’s problems I had wrought; But now, grown old and wise, too late I see My life is spent, and all my lore is nought.","person":"Omar Khayyām","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 235"},{"day":140,"source_no":287,"original":"Men hail the rising sun with glee, They love his setting glow to see, But fail to mark that every day In fragments bears their life away. All Nature’s face delight to view, As changing seasons come anew; None sees how each revolving year Abridges swiftly man’s career.","person":"Ramāyāna","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 287"},{"day":141,"source_no":326,"original":"Look not mournfully into the Past. It comes not back again. Wisely improve the Present. It is thine. Go forth to meet the shadowy Future, without fear, and with a manly heart.","person":"Longfellow","theme":"時間","gist":"過去や未来に奪われすぎず、今日を使う。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 326"},{"day":142,"source_no":365,"original":"Beside the streamlet seated, mark how life glides on: That sign, how swift each moment goes, to me’s enough. Behold this world’s delights, and view its various pains: If not to you, the joy it shows to me’s enough.","person":"Hāfiz","theme":"健康・生活","gist":"心と体の状態を無視せず、休むことも選択肢にする。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 365"},{"day":143,"source_no":461,"original":"We deliberate about the parcels of life, but not about life itself, and so we arrive all unawares at its different epochs, and have the trouble of beginning all again. And so finally it is that we do not walk as men confidently towards death, but let death come suddenly upon us.","person":"Seneca","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 461"},{"day":144,"source_no":502,"original":"Hark! here the sound of lute so sweet, And there the voice of wailing loud; Here scholars grave in conclave meet, There howls the brawling drunken crowd; Here, charming maidens full of glee, There, tottering, withered dames we see. Such light! Such shade! I cannot tell, If here we live in heaven or hell.","person":"Bhartrihari","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 502"},{"day":145,"source_no":314,"original":"All love, at first, like generous wine, Ferments and frets until ’tis fine; But when ’tis settled on the lee, And from th’ impurer matter free, Becomes the richer still the older, And proves the pleasanter the colder.","person":"Butler","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"つらい状況では、目の前の問題が永遠に続くように感じます。この言葉は、状況を楽観視するのではなく、苦しい中でも次にできる行動を残しておく大切さを教えてくれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 314"},{"day":146,"source_no":414,"original":"In all that belongs to man you cannot find a greater wonder than memory. What a treasury of all things! What a record! What a journal of all! As if provident Nature, because she would have man circumspect, had furnished him with an account-book, to carry always with him. Yet it neither burthens nor takes up room.","person":"Feltham","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 414"},{"day":147,"source_no":115,"original":"Depend not on another, rather lean Upon thyself; trust to thine own exertions: Subjection to another’s will gives pain; True happiness consists in self-reliance.","person":"Manu","theme":"逆境・希望","gist":"苦しい時ほど、希望と次の一手を手放さない。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 115"},{"day":148,"source_no":226,"original":"The shadows of the mind are like those of the body. In the morning of life they all lie behind us, at noon we trample them under foot, and in the evening they stretch long, broad, and deepening before us.","person":"Longfellow","theme":"健康・生活","gist":"生活を良くする時は、まず無理のない習慣から。","insight":"体調が崩れると、仕事も気持ちも影響を受けます。睡眠・食事・休息の基本を後回しにしすぎないことが、結果的には効率にもつながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 226"},{"day":149,"source_no":229,"original":"A vacant mind is open to all suggestions, as the hollow mountain returns all sounds.","person":"Chinese","theme":"人生","gist":"長い目で見て、自分が納得できる生き方を選ぶ。","insight":"環境が完璧になるのを待っていると、始める時期を失います。今ある条件の中でできることを探す姿勢が、次の選択肢を増やします。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 229"},{"day":150,"source_no":270,"original":"The mind alike, Vigorous or weak, is capable of culture, But still bears fruit according to its nature. ’Tis not the teacher’s skill that rears the scholar: The sparkling gem gives back the glorious radiance It drinks from other light, but the dull earth Absorbs the blaze, and yields no gleam again.","person":"Bhavabhūti","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 270"},{"day":151,"source_no":279,"original":"It is good to tame the mind, which is difficult to hold in, and flighty, rushing wheresoever it listeth: a tamed mind brings blessings.","person":"Dhammapada","theme":"誠実・善行","gist":"評価されるためではなく、自分が納得できる行動を選ぶ。","insight":"人に見られている時だけ正しく振る舞うのではなく、誰も見ていなくても自分が納得できる行動を選ぶ。それが信用の土台になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 279"},{"day":152,"source_no":188,"original":"Love of money is the disease which renders us most pitiful and grovelling, and love of pleasure is that which renders us most despicable.","person":"Longinus","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 188"},{"day":153,"source_no":190,"original":"Lost money is bewailed with deeper sighs Than friends, or kindred, and with louder cries.","person":"Juvenal","theme":"人間関係","gist":"人との関係は、言葉より日々の態度で育つ。","insight":"親しさがあるほど礼儀を忘れやすくなります。感謝や謝罪を言葉にする小さな習慣が、長い関係を支えます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 190"},{"day":154,"source_no":368,"original":"All property which comes to hand by means of violence, or infamy, or baseness, however large it may be, is tainted and unblest. On the other hand, whatever is obtained by honest profit, small though it be, brings a blessing with it.[17]","person":"Akhlak-i-Jalālī","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 368"},{"day":155,"source_no":573,"original":"If thou be rich, strive to command thy money, lest it command thee.","person":"Quarles","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 573"},{"day":156,"source_no":420,"original":"It is easy to lose important opportunities, and difficult to regain them; therefore when they present themselves it is the more necessary to make every effort to retain them.","person":"Guicciardini","theme":"時間","gist":"機会には期限がある。動ける時に動く。","insight":"機会はいつまでも同じ形では残りません。完璧な準備を待ちすぎず、後で修正できることなら早めに試す価値があります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 420"},{"day":157,"source_no":42,"original":"Affairs succeed by patience, and he that is hasty falleth headlong.","person":"Sa’dī","theme":"忍耐・継続","gist":"一度の頑張りより、続けられる形を作る。","insight":"継続のコツは、意志を強くすることより、続けやすい大きさにすることです。毎日10分でも、半年続けば大きな量になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 42"},{"day":158,"source_no":118,"original":"Be patient, if thou wouldst thy ends accomplish; for like patience is there no appliance effective of success, producing certainly abundant fruit of actions, never damped by failure, conquering all impediments.","person":"Bhāravi","theme":"行動・挑戦","gist":"前進は、実際に手を動かしたところから始まる。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 118"},{"day":159,"source_no":207,"original":"Bootless grief hurts a man’s self, but patience makes a jest of an injury.","person":"R. Chamberlain","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"相手の行動は制御できませんが、自分がどう反応するかは選べます。その余白を持つことが、自分を守る力になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 207"},{"day":160,"source_no":476,"original":"Patience is the chiefest fruit of study; a man that strives to make himself different from other men by much reading gains this chiefest good, that in all fortunes he hath something to entertain and comfort himself withal.","person":"Selden","theme":"自分を知る","gist":"成長は、自分の欠点を認めるところから始まる。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 476"},{"day":161,"source_no":327,"original":"Plans that are wise and prudent in themselves are rendered vain when the execution of them is carried on negligently and with imprudence.","person":"Guicciardini","theme":"学び・知恵","gist":"知識は増えるほど、考える力も必要になる。","insight":"知識を集めるだけでは生活は変わりません。今日学んだことを一つ試してみると、知識が経験に変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 327"},{"day":162,"source_no":487,"original":"Let him take heart who does advance, even in the smallest degree.","person":"Plato","theme":"人生","gist":"人生を一気に変えようとせず、今日の選択を一つ良くする。","insight":"周囲の基準ではなく、自分が長い目で納得できるかを考えること。人生の満足は、他人との比較だけでは測れません。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 487"},{"day":163,"source_no":93,"original":"Trees loaded with fruit are bent down; the clouds when charged with fresh rain hang down near the earth: even so good men are not uplifted through prosperity. Such is the natural character of the liberal.","person":"Bhartrihari","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 93"},{"day":164,"source_no":224,"original":"The man who is in the highest state of prosperity, and who thinks his fortune is most secure, knows not if it will remain unchanged till the evening.","person":"Demosthenes","theme":"お金・豊かさ","gist":"豊かさは、持つ量だけでなく欲望との距離で決まる。","insight":"値段だけではなく、そこに使う時間や維持費まで含めて考えると、本当に得かどうかが見えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 224"},{"day":165,"source_no":350,"original":"Enjoy thou the prosperity of others, Although thyself unprosperous; noble men Take pleasure in their neighbours’ happiness.","person":"Mahābhārata","theme":"満足・幸福","gist":"幸福を外側だけに求めず、自分の受け止め方も整える。","insight":"何事も多ければ良いとは限りません。楽しみも適度な距離があるから長く楽しめます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 350"},{"day":166,"source_no":14,"original":"Reason is captive in the hands of the passions, as a weak man in the hands of an artful woman.","person":"Sa’dī","theme":"怒り・感情","gist":"感情を否定せず、それに振り回されない。","insight":"怒りや不安そのものは悪いものではありません。ただ、その瞬間の感情で大きな決断をすると後悔しやすい。時間を置いてから決めるだけでも失敗を減らせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 14"},{"day":167,"source_no":299,"original":"The way to subject all things to thyself is to subject thyself to reason; thou shalt govern many if reason govern thee. Wouldst thou be a monarch of a little world, command thyself.","person":"Quarles","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 299"},{"day":168,"source_no":559,"original":"Those who are guided by reason are generally successful in their plans; those who are rash and precipitate seldom enjoy the favour of the gods.","person":"Herodotus","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 559"},{"day":169,"source_no":486,"original":"Those men are wise who do not desire the unattainable, who do not love to mourn over what is lost, and are not overwhelmed by calamities.","person":"Mahābhārata","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 486"},{"day":170,"source_no":12,"original":"The foolish undertake a trifling act, and soon desist, discouraged; wise men engage in mighty works, and persevere.","person":"Māgha","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"大きな目標は、そのままだと重く感じます。今日できるサイズまで小さくして実行することが、結果的には最短の前進になります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 12"},{"day":171,"source_no":263,"original":"There is nothing in this world which a resolute man, who exerts himself, cannot attain.","person":"Somadeva","theme":"行動・挑戦","gist":"結果を待つより、今日の一歩を積み重ねる。","insight":"やる気が十分になるのを待つより、まず行動してみる。行動した後から気持ちがついてくることも多いものです。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 263"},{"day":172,"source_no":280,"original":"The man who every sacred science knows, Yet has not strength to keep in check the foes That rise within him, mars his Fortune’s fame, And brings her by his feebleness to shame.","person":"Bhāravi","theme":"お金・豊かさ","gist":"お金は目的ではなく、より良く生きるための道具。","insight":"収入を増やすことは大切ですが、欲しいものが無限に増えると満足は遠ざかります。『十分』の基準を持つと、お金の使い方が安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 280"},{"day":173,"source_no":152,"original":"No man learns to know his inmost nature by introspection, for he rates himself sometimes too low, and often too high, by his own measurement. Man knows himself only by comparing himself with other men; it is life that touches his genuine worth.","person":"Goethe","theme":"時間","gist":"時間は戻らない。大切なことを先延ばしにしない。","insight":"過去の後悔も未来の不安も必要な時はありますが、使えるのは今の時間です。『今日できることは何か』まで戻すと考えやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 152"},{"day":174,"source_no":261,"original":"How can we learn to know ourselves? By reflection, never, but by our actions. Attempt to do your duty, and you will immediately find what is in you.","person":"Goethe","theme":"逆境・希望","gist":"つらい時は、状況よりも自分の姿勢を整える。","insight":"順調な時に備え、苦しい時に希望を失わない。生活でも仕事でも、この二つをセットで考えると変化に強くなれます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 261"},{"day":175,"source_no":22,"original":"Nothing is more becoming a man than silence. It is not the preaching but the practice which ought to be considered as the more important. A profusion of words is sure to lead to error.","person":"Talmud","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 22"},{"day":176,"source_no":180,"original":"When thou utterest not a word thou hast laid thy hand upon it; when thou hast uttered it, it hath laid its hand on thee.","person":"Sa’dī","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 180"},{"day":177,"source_no":244,"original":"Obstinate silence implies either a mean opinion of ourselves, or a contempt for our company; and it is the more provoking, as others do not know to which of these causes to attribute it—whether humility or pride.","person":"Hazlitt","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 244"},{"day":178,"source_no":254,"original":"If with a stranger thou discourse, first learn, By strictest observation, to discern If he be wiser than thyself, if so, Be dumb, and rather choose by him to know; But if thyself perchance the wiser be, Then do thou speak, that he may learn by thee.","person":"Randolph","theme":"学び・知恵","gist":"学んだことは、実際の行動に使ってこそ身につく。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 254"},{"day":179,"source_no":438,"original":"Give not thy tongue too great a liberty, lest it take thee prisoner. A word unspoken is like thy sword in thy scabbard; if vented, the sword is in another’s hand.[23] If thou desire to be held wise, be so wise as to hold thy tongue.","person":"Quarles","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 438"},{"day":180,"source_no":444,"original":"Hast thou not perfect excellence, ’tis best To keep thy tongue in silence, for ’tis this Which shames a man; as lightness does attest The nut is empty, nor of value is.","person":"Sa’dī","theme":"言葉・会話","gist":"話す力と同じくらい、黙る力も大切にする。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 444"},{"day":181,"source_no":465,"original":"Even a blockhead may respect inspire, So long as he is suitably attired; A fool may gain esteem among the wise, So long as he has sense to hold his tongue.","person":"Hitopadesa","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"一度口にした言葉は完全には取り消せません。感情が強い時ほど、送信や返答の前に少し時間を置くのは有効な習慣です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 465"},{"day":182,"source_no":474,"original":"First think, and if thy thoughts approve thy will, Then speak, and after, what thou speak’st fulfil.","person":"Randolph","theme":"言葉・会話","gist":"賢く見せるより、相手に伝わる言葉を選ぶ。","insight":"会話では『正しいことを言う』だけでなく、『相手にどう届くか』も重要です。短く、具体的に、相手を傷つけない形に整えるだけで伝わり方は変わります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 474"},{"day":183,"source_no":556,"original":"Listen, if you would learn; be silent, if you would be safe.","person":"Arabic","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"人の意見をそのまま信じるのではなく、自分で確かめる習慣を持つこと。情報が多い時代ほど、この姿勢が役に立ちます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 556"},{"day":184,"source_no":435,"original":"Simplicity of character is the natural result of profound thought.","person":"Hazlitt","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"他人の欠点はよく見えるのに、自分の癖は見えにくいものです。失敗した時に『相手が悪い』だけで終わらず、自分が変えられる部分を一つ探すと成長につながります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 435"},{"day":185,"source_no":488,"original":"A truly great man never puts away the simplicity of a child.[27]","person":"Chinese","theme":"健康・生活","gist":"毎日の基本を整えることが、長い目で一番効く。","insight":"生活改善は極端な方法より、毎日続けられる小さな変更の方が残ります。まず一つだけ変えるところから始めましょう。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 488"},{"day":186,"source_no":568,"original":"In character, in manners, in style, in all things, the supreme excellence is simplicity.","person":"Longfellow","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自分を責め続ける必要はありませんが、都合の悪い部分から目をそらさないことも大切です。気づけた欠点は、改善できる欠点です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 568"},{"day":187,"source_no":183,"original":"Two sources of success are known: wisdom and effort; make them both thine own, if thou wouldst haply rise.","person":"Māgha","theme":"学び・知恵","gist":"分からないことを認めることが、学びの入口になる。","insight":"本当に学んでいる人ほど、『まだ分からない』ことに気づきます。分からないことを恥ずかしがらず、質問や確認を増やす方が上達は速くなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 183"},{"day":188,"source_no":578,"original":"A man should never despise himself, for brilliant success never attends on the man who is contemned by himself.","person":"Mahābhārata","theme":"自分を知る","gist":"他人を見る前に、自分の癖や弱点を見直す。","insight":"自信は、自分を大きく見せることではありません。得意なことと苦手なことの両方を現実的に把握している状態の方が、長く安定します。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 578"},{"day":189,"source_no":583,"original":"Comprehensive talkers are apt to be tiresome when we are not athirst for information; but, to be quite fair, we must admit that superior reticence is a good deal due to lack of matter. Speech is often barren, but silence also does not necessarily brood over a full nest. Your still fowl, blinking at you without remark, may all the while be sitting on one addled nest-egg; and, when it takes to cackling, will have nothing to announce but that addled delusion.","person":"George Eliot","theme":"言葉・会話","gist":"言葉は戻せない。話す前に一度考える。","insight":"何か言いたくなった時に、あえて黙ることも立派な選択です。必要な言葉だけを残すと、むしろ伝わりやすくなります。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 583"},{"day":190,"source_no":380,"original":"The sweetest pleasures soonest cloy, And its best flavour temperance gives to joy.","person":"Juvenal","theme":"満足・幸福","gist":"楽しみは、適度だからこそ長く味わえる。","insight":"不足ばかり見ていると、条件が良くなっても次の不足が見えてきます。すでにある良いものを意識して数えることも、満足する力の一部です。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 380"},{"day":191,"source_no":114,"original":"All that we are is made up of our thoughts; it is founded on our thoughts, it is made up of our thoughts. If a man speak or act with a pure thought, happiness will follow him, like a shadow that never leaves him.","person":"Dhammapada","theme":"逆境・希望","gist":"逆境は永遠ではない。今できることに集中する。","insight":"逆境の時ほど視野が狭くなりがちです。今日すべてを解決しようとせず、『今できる一つ』に集中すると、気持ちと状況の両方を少しずつ動かせます。","source":"W. A. Clouston『Book of Wise Sayings』(1893) No. 114"},{"day":192,"source_no":402,"original":"It is very hard for the mind to disengage itself from a subject on which it has been long employed. The thoughts will be rising of themselves from time to time, though we have given them no encouragement, as the tossings and fluctuations of the sea continue se
